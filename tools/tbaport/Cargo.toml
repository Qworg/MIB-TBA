[package]
name = "tbaport"
description = "Deterministic tbaMUD -> MIB content converter (build-time tool)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This is a build-time tool, independent of the running server. It depends on
# the *schema* crates only: `mib-stdlib` and `mib-tba` own the content types
# the converter serialises, so the YAML it writes is schema-exact by
# construction rather than by hand.
[dependencies]
mib-stdlib.workspace = true
# `mib-tba` is the sibling `code/` crate (it is a workspace member, not a
# published engine dep), so it is referenced by path rather than through
# `workspace.dependencies`.
mib-tba = { path = "../../code" }
# The DG script VM's static analysis states what the emitted corpus contains.
dg-vm = { path = "../../crates/dg-vm" }
mib-core.workspace = true
mib-content.workspace = true
serde.workspace = true
# Pinned to the version the engine uses (`serde_yaml = "0.9"` in the MIB
# workspace); kept inline because this game's workspace does not re-export it.
serde_yaml = "0.9"
serde_json = "1"

[lints]
workspace = true
