  tba.27234:
    area: tba_272
    name: The House of Witches
    description: |2
         Dangling mirrors reflect your face a thousand times from the walls and
      ceiling of this supply house of witchcraft.  Ingredients for the hexes of hags
      and the poisons of roguish assassins bubble and float in jars crowded onto
      shelves, and tinkling against each other from strings around the stone doorway.
      A voodoo doll pinned to one wall seems to be eyeing you.  Let's hope you are
      not already earmarked for demise by someone.
    exits:
      up:
        to: tba.27233
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_23
          name: |
            stone
          pickable: false
          difficulty: 0
    spawns: []
