  tba.27132:
    area: tba_271
    name: A gold sand road
    description: |2
         The sand road continues north and south, crowded with citizens going about
      their business.  The armory stands to the west, emitting heat from the fires
      of the forge.  Occasional drunken shouts and laughter can be heard from a
      smoking lodge to the east.
    exits:
      east:
        to: tba.27148
        hidden: false
        door: null
