  tba.27134:
    area: tba_271
    name: A bend in the road
    description: |2
         You have come to a narrow bend, and can feel the faint heat of a fire from a
      small, blackened stone structure to the north.  Patches of gold sand are
      scattered about.
    exits:
      east:
        to: tba.27282
        hidden: false
        door: null
      north:
        to: tba.27154
