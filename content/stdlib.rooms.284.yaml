    area: tba_284
    name: Lair entrance.
    description: |2
         This is an arched cavern of great size - it looks like the Houston
      astrodome.  A great ledge of rock juts out above your head, showering you with
      a steady gush of blood and entrails.  A raucous sound of crunching viscera,
      intermingled with a slurp here and there, turns your stomach.  Then you hear
      it...  An encouraging voice which keeps repeating "Yes, yes, thats it...  Just
      a few steps more...  You're almost there.  "
