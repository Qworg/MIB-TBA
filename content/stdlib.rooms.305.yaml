rooms:
  tba.30500:
    area: tba_305
    name: The Stone Door
    description: |2
         You find yourself standing in a dry circular room which is illuminated by a
      small brass torch set in the wall.  Flickering shadows dance about the room in
      a manner you find disorienting.  Beneath the torch is an elaborate mahogany
      door, complete with a small silver doorknob.
    exits:
      north:
        to: tba.30501
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_30501
          name: door mahogany
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 30500
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - credits
      - info
      description: |2
           Chessboard
        Written March 1994
        This area is kinda weird, It started as an addendum to
        Moria and then went off in its own direction. *shrug*

        Enclosed is an area I wrote back in my mudding days; they
        are designed for circle code, but with some modifications can probably
        be integrated into whatever kind of mud you're running.

        These areas are FREE- however, if you use them:
        1. Feel free to make whatever modifications you need, change mobs,
        objects, room descriptions etc.- but please make sure that signs and author
        references are unmodified and readable by players.
        2. Please send me an e-mail message if you do use them, I'd just
        like to have some idea of where they end up (please include mud site)- my
        address is wjp@hopper.unh.edu until Sept 1996
        3. If you redistribute these areas, please make sure this README
        file goes with them :)

        Bill Pelletier
        wjp@hopper.unh.edu
        Aten/Talisman of GenericMUD
  tba.30501:
    area: tba_305
    name: The Smooth Tunnel
    description: |2
         Looking down at your feet, you are somewhat surprised to find that you are
      walking on a thick woven rug.  The walls of the tunnel that you are in are
      completely smooth, and polished to a gleam.  Before you, the tunnel opens up to
      what appears to be a small chamber.
    exits:
      north:
        to: tba.30502
        hidden: false
        door: null
      south:
        to: tba.30501
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30501
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30502:
    area: tba_305
    name: The Furnished Chamber
    description: |2
         This chamber is furnished quite nicely, with a thick woven rug beneath your
      feet, and tapestries along the walls.  There is a rectangular hole in the rug,
      revealing a trapdoor which seems to open via a small iron ring, The room's exit
      looms behind you.
    exits:
      down:
        to: tba.30503
        hidden: false
        door:
          locked: false
          closed: false
          key: null
          name: trapdoor trap
          pickable: true
          difficulty: 0
      south:
        to: tba.30501
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30502
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30503:
    area: tba_305
    name: The Stone Staircase
    description: |2
         You find yourself in a rough stone staircase, which winds around a smooth
      core of stone, descending deeper into the bowels of the earth.  Small torches
      are set into the stone, guiding your way.
    exits:
      down:
        to: tba.30504
        hidden: false
        door: null
      up:
        to: tba.30502
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30503
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30504:
    area: tba_305
    name: Down..Down..Down..
    description: |2
         Your descent picks up speed, and you trip over an unseen obstacle in the
      stairway!  As you tumble, the stairs start to become narrower and then begin to
      slope forward.  You soon find yourself sliding in circles down the tunnel,
      which has now become smooth stone, covered with very fine sand.  You faintly
      detect the sound of delighted laughter echoing in some faraway place.
    exits:
      down:
        to: tba.30505
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30504
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30505:
    area: tba_305
    name: The Slide
    description: |2
         You come out of the last spin, and are abruptly deposited on a slide made of
      some slick metal.  You descend rapidy, being abruptly slammed against the walls
      as the slide banks through several tight corners.  Ahead of you, approaching
      rapidly is a small point of light.
    exits:
      down:
        to: tba.30506
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30505
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30506:
    area: tba_305
    name: The Ledge
    description: |2
         You pop out of the slide, sail through the air for several long moments,
      crash into the side of a cavern, and land on a ledge in a crumpled heap.  You
      slowly look upwards, and what you see astounds even you- a seasoned adventurer.
      You are in the north end of a perfectly square cavern with a floor composed of
      sixty-four alternating black and white marble tiles.  Giant torches line the
      walls, casting a dazzling glow over the entire room.  Standing guard over half
      the squares are giant carved wooden beings, looming and silent.  There is a
      neat wooden ladder beneath you, leading downward, and three quarters up the
      opposite wall is the small hole you just came flying out of.
    exits:
      down:
        to: tba.30507
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30506
    coord: null
    sector: inside
    extra_descriptions: []
  tba.30507:
    area: tba_305
    name: The Ladder
    description: |2
         You are on a simple wooden ladder, which has been bolted by means of small
      metal hooks to the cavern wall.  The ledge is above you, and the cavern floor
      is below you.  There is a small sign on the wall.
    exits:
      down:
        to: tba.30512
        hidden: false
        door: null
      up:
        to: tba.30506
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 30507
    coord: null
    sector: inside
    extra_descriptions: []
