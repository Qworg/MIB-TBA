  tba.2074:
    area: tba_20
    name: Main Arena
    description: |2
         The arena floor is slick with blood and other bodily fluids that make
      your stomach turn.  Above you is the Imperial Box where Emperor Titus
      commands the fights of the arena.
    exits:
      east:
        to: tba.2077
        hidden: false
