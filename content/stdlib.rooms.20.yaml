  tba.2073:
    area: tba_20
    name: Main Arena
    description: |2
         The crowd is deafening and the heat stifling.  The sand is baking underneath
      your feet.  This is where the gladiators fight to the death for the pleasure of
      the citizens of Rome.
    exits:
      east:
        to: tba.2076
        hidden: false
        door: null
