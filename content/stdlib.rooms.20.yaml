  tba.2079:
    area: tba_20
    name: Main Arena
    description: |2
         Prisoners can fight for their freedom here to become gladiators and make
      some good money or, even better, become a famous gladiator and be held in
      awe by all the citizens of Rome.
    exits:
      north:
        to: tba.2078
        hidden: false
        door: null
