    area: tba_20
    name: Main Arena
    description: |2
         The floor of the arena is covered with a fine sand.  The crowd cheers in
      anticipation of the fighting and bloodshed.  The sound is deafening and
      definitely distracting.
    exits:
      down:
        to: tba.2002
