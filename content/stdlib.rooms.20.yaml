  tba.2076:
    area: tba_20
    name: Main Arena
    description: |2
         Thousands of battles and even more deaths have colored the sand on the
      arena floor a sickly brown.  Slaves are dumping fresh sand over the
      stains, but it doesn't seem to be helping.
    exits:
      east:
        to: tba.2079
        hidden: false
