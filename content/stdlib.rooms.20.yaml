  tba.2080:
    area: tba_20
    name: Roman Ampitheater
    description: |2
         The arena below you is empty right now, but from the shouting of the
      crowd you expect the games are about to begin.  The crowd that seems to
      be more of a mob than anything else is growing impatient.
    exits:
      east:
        to: tba.2081
        hidden: false
        door: null
      south:
        to: tba.2095
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2080
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2081:
    area: tba_20
    name: Roman Ampitheater
    description: |2
         The amphitheater is a microcosm of Roman society.  The seating
      arrangements reflect the stratification of Roman society.  The emperor
      has a special box for himself and his family.  Senators and knights sit in
      their own special section.  Soldiers are separated from civilians, married
      men, from bachelors.  Boys and their tutors sit together.  Women, except
      for the Vestal Virgins who sit in the best seats with religious officials,
      sit with the poorest men in the top tier.
    exits:
      east:
        to: tba.2082
        hidden: false
        door: null
      west:
        to: tba.2080
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2081
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2082:
    area: tba_20
    name: Imperial Box
    description: |2
         The emperor sits on his lavish throne, watching the bouts that he has
      provided for his people so they will look upon him with favor.  The Vestal
      Virgins sit to both sides of the emperor fanning themselves from the
      oppressive heat.
    exits:
      east:
        to: tba.2083
        hidden: false
        door: null
      west:
        to: tba.2081
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2082
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2083:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         Certain criminals are executed here by being given to the wild beasts
      or are forced to fight to the death as gladiators.  It also represents the
      domination of Rome over its enemies: prisoners of war are either executed
      or forced to fight each other as gladiators.  But for the professional
      gladiator it is also a place of redemption, in which one can overcome death
      by victory or by stoically accepting it.
    exits:
      east:
        to: tba.2084
        hidden: false
        door: null
      west:
        to: tba.2082
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2083
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2084:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         Several slaves walk into the arena with barrows of sand to cover over the
      blood stains and prepare for the next bout.  The populace is once again
      getting restless.
    exits:
      south:
        to: tba.2085
        hidden: false
        door: null
      west:
        to: tba.2083
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2084
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2085:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         Slaves, that had been forced to exhaust themselves helping to finish
      building the very amphitheater in which they are to die, are pushed into the
      arena.  As the mob screams, howls and roars, barred doors are lifted,
      releasing man-eating lions and tigers who have not been fed for quite a time.
    exits:
      north:
        to: tba.2084
        hidden: false
        door: null
      south:
        to: tba.2086
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2085
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2086:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         At last this fighting seems to have gone on long enough to satisfy,
      momentarily, the mob.  The few survivors retire to get their laurel crowns,
      their bags of gold and to anticipate the adulation of Rome.  Squads of
      little men run into the arena with ropes and metal hooks to drag the bodies of the
      dead and wounded to a mortuary cell where valuable weapons and armor are
      retrieved and sorted out.  The gasping, bleeding, groaning and wounded are
      finished off.  The bodies are then piled into carts to be taken and flung
      into a nameless common grave.
    exits:
      north:
        to: tba.2085
        hidden: false
        door: null
      south:
        to: tba.2087
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2086
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2087:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         Flashing swords, the clash of steel, and the first wounds arouse the
      passions, the hatred and the desperate fury of the gladiators and inflame
      the blood-lust of the mob.  The shouts and yells and screams of the
      onlookers grow to a huge, roaring crescendo of sound as one Samnite after
      another go down with their stomachs gashed open or their necks spouting
      blood and one Thracian after another crumbles with a Samnite sword through
      his chest.  Reinforcements are rushed in to restore the balance and to add
      to the pile of bleeding, writhing bodies on the sand-strewn floor.
    exits:
      north:
        to: tba.2086
        hidden: false
        door: null
      south:
        to: tba.2088
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2087
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2088:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         Another fanfare of trumpets announces the entry of two teams of 24
      gladiators in charge of two renowned trainers, themselves former gladiators
      who, scarred and maimed, have somehow survived with their glory from many a
      combat.  According to tradition, 24 men heavily armed as the ancient
      Samnites, Rome's oldest enemies, face 24 lightly clad and lightly armed
      'Thracians,' each with exposed chests.  Both teams march smartly up to face
      the Emperor in his resplendent Imperial Box to shout as one man: 'Hail,
      Caesar.  Those about to die salute you.'
    exits:
      north:
        to: tba.2087
        hidden: false
        door: null
      west:
        to: tba.2089
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2088
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2089:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         A tremendous fanfare of trumpets follows the entrance of the Emperor.
      The Games begin.  It is the turn of the gladiators, men trained for battle,
      sworn to the gladiators' oath to suffer death by fire, in chains, under
      the lash or by the sword as their master might decide and to obey as a
      true gladiator should.
    exits:
      east:
        to: tba.2088
        hidden: false
        door: null
      west:
        to: tba.2090
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2089
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2090:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         You walk under a spread of canvas which sailors of the fleet have slung
      as a partial roof from masts all around the amphitheater's rim, to serve
      as a shield against the sun.  It makes a hothouse of the upper seats.
      After the solemn, long procession of civic dignitaries, priests and
      performers, together with images of the gods, the entry of the Emperor
      Titus across the floor of the arena is the signal for renewed frenzied
      applause from the restive crowd.
    exits:
      east:
        to: tba.2089
        hidden: false
        door: null
      west:
        to: tba.2091
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2090
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2091:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         The first rows are filled with senators, priests, augurs, magistrates,
      and other officials of distinction.  Up to the first 17 rows are crammed
      with the worthy citizens of wealth and standing.  Above them and entirely
      filling the second and third rows up to the very top is the mob making up
      the great mass of the inhabitants of the Imperial City.
    exits:
      east:
        to: tba.2090
        hidden: false
        door: null
      west:
        to: tba.2092
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2091
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2092:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         The whole amphitheater and the lavish shows held in it are arranged to
      keep the populace of this city amused.  Excitable and noisy, the crowds
      near-animal instincts and passions, unrestrained by education, good manners
      or breeding, are squashed promiscuously together, men, women and children,
      crying, shouting and sweating in a deafening crescendo of noise.
    exits:
      east:
        to: tba.2091
        hidden: false
        door: null
      north:
        to: tba.2093
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2092
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2093:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         It is here the Romans hold their gladiatorial games, with man against
      man or man against beast.  Trap doors in the floor allow famous gladiators
      to make grand entrances, or to allow the Caesar to spring animals into the
      arena.  The Colosseum looks like it could hold about 50,000 spectators.
    exits:
      north:
        to: tba.2094
        hidden: false
        door: null
      south:
        to: tba.2092
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 2093
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.2094:
    area: tba_20
    name: Roman Amphitheater
    description: |2
         You have entered a great oval amphitheater, also known as the Colosseum.
      Crowds of people pour in through the entrance, pushing, shoving and
      scrambling to fill the top half of the immense number of seats looking down
      on the huge arena.  It looks like the whole of Rome is here.
    exits:
      down:
        to: tba.2001
