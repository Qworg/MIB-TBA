    area: tba_20
    name: Main Arena
    description: |2
         You stand in the center of the arena.  The crowd starts to calm down
      and silence blankets the arena as everyone waits in anticipation.  Are
      you ready to Rumble?
    exits:
      east:
        to: tba.2078
        hidden: false
        door: null
