  tba.2077:
    area: tba_20
    name: Main Arena
    description: |2
         The crowd is going wild and you start to wonder if some of them may come
      down into the arena after you.  In the crowd above you sits the prestigious
      magistrates, senators, augurs and priests of Rome.
    exits:
      south:
        to: tba.2078
