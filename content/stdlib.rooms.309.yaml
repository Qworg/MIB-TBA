  tba.30944:
    area: tba_309
    name: Entrance into the Dining Hall
    description: |2
         Just west of here is the start of an enormous feastng hall, or more aptly
      what would be called a mess hall in this place.  A thick, wooden table runs the
      entire length of the hall, one which could easily seat a score and a half of men
      at dinner and then some.  There are nightly feasts here at this table, feasts
      that everyone in the keep is invited to and usually attend.  Much revelry,
      singing and baudy jokes are told throughout the evenings - a favorite past time
      of the Baron's.  On the east wall is the door into the kitchen, where wonderful
      smells emanate all day long - there is always something cooking in this place.
