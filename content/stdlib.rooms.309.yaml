    area: tba_309
    name: Inner Yard
    description: |2
         The entire inner yard is surrounded by the walls of the keep, a protective
      barrier against marauders and the possibility that another baron might try to
      attack Westlawn to gain control of his land and holdings.  This yard is where
      all the people who live on Westlawn's land come in times of strife or bad
      weather, to stay together in number and relative safety.
