  tba.30948:
    area: tba_309
    name: The Head of the Table
    description: |2
         This is the Baron's spot at the table.  He had it purposely designed that he
      could make a grand entrance to his seat of honor on a nightly basis, walking
      slowly and deliberately past all who would dine at his table.  His chair is, of
      course, slightly raised from the rest of the chairs at the table - not that he
      needs the height.  Rumor has it, the baron is close to seven feet in height.
