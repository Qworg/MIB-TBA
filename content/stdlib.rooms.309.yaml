    description: |2
         This is the southeastern corner of the yard, where most of major business
      deals are made by the local nobles of the area.  It is said that any word
      uttered within the confines of the inner keep can be and are heard by Westlawn,
      so most of the bargains which are made are done outdoors in this very area.
