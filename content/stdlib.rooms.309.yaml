  tba.30950:
    area: tba_309
    name: Soldier's Barracks
    description: |2
         All of the single men who are part of the Baron's barbaric fighting force are
      given quarters in this large room.  There are bunks lined in straight, perfect
      rows, all of them clean and crisp.  The baron always makes it a point to stop
      into this room at least once a day so that he might make sure that no soldier of
      his lives like a pig.  There are severe penalties for slovenly behavior.
