  tba.30939:
    area: tba_309
    name: Wide Hallway
    description: |2
         The hallway is a high, arched affair made from stone and mortar.  It rises at
      least fifteen feet at its highest point, twelve at the lowest along the walls.
      The floor is dented and gouged from the tread of many hooves upon it - it seems
      that the Baron has no qualms about leading his fine steeds through this section
      of his home.  The hall meets with another hall just to the east, the courtyard
      lies to the west through a set of heavy double doors.
