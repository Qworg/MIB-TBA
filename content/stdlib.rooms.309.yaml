      description: |2
           Keep of Baron Westlawn by Kaan for Dibrova
        Level: 25-30
        90 rooms
        42 mobs
        40 objs
        Connector zones: The King's Highway
        This is one of eight main baronies that lie within the open plains
        area that the King's Highway runs through. The main exports of this
        Baron's land are beer and horses. He is a warrior baron to the core,
        his soldiers finely tuned and he himself a fine warrior who could
        drink any man under the table.
