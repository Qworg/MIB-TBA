  tba.24391:
    area: tba_243
    name: Steep Cliff
    description: |2
         Oops. You didn't read the sign, did you? As you go south, your feet slip
      right off the edge of the cliff. Now you're plunging downward towards the
      forest below. Hey, now it doesn't look so far anymore. Oh, now you're impaled
      on a tall icy pine tree. Right before you black out, you feel the coldness of
      the wood in your chest.
