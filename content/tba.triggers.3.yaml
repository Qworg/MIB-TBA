    name: Mob Speech - Hunt Example
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 100
    arglist: hunt
    script: |
      * By Welcor
      if %speech.car% != hunt
        return 0
        halt
      end
      eval target %speech.cdr%
      if !%target% || %target% == hunt
        return 0
        halt
      end
      if %actor.gold% < 4000
        tell %actor.name% You cannot afford my services - go away!
        halt
      end
      nop %actor.gold(-4000)%
      mhunt %target%
      tell %actor.name% I'll charge you 4000 gold for that. I'll hunt %target% as long as I can.
