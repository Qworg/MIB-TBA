      wait 1 sec
      %echo% %self.name% 'Answer me this riddle, fool, and an audience I shall grant you.'
      %echo% 'Cannot be seen,
      %echo% Cannot be felt,
      %echo% Cannot be heard,
      %echo% Cannot be smelt.'
      wait 1 sec
      %echo% %self.name% laughs with dark delight, before absorbing itself into nonexistence.
      %purge% Spectre
