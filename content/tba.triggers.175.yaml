triggers:
  tba_trig_17500:
    vnum: 17500
    name: All-Exit Guardian
    attach_type: mob
    flags: q
    types:
    - leave
    narg: 100
    arglist: none
    script: |
      if %actor.is_pc% && %actor.level% < 30
        say Pass here %actor.name% not. Mistress see %actor.name% not! Begone!
        return 0
      else
        say Mistress see %actor.name%. Pass here %actor.name% may.
        return 1
      end
  tba_trig_17501:
    vnum: 17501
    name: Guardian Elemental
    attach_type: mob
    flags: q
    types:
    - leave
    narg: 100
    arglist: none
    script: |
      if %direction% == north
        if %actor.level%<30
          say You are not permitted to leave in that direction, %actor.name%. Trilless does not wish to see you.
          return 0
        else
          say You are permitted to enter, %actor.name%. Trilless will see you.
          return 1
        end
      end
  tba_trig_17502:
    vnum: 17502
    name: 'Riddle #1'
    attach_type: wld
    flags: d
    types:
    - speech
    narg: 0
    arglist: e
    script: |
      %door% 17519 down flags a
      %door% 17517 up flags a
      %echo% *CLICK*
      %echo% The porthole slides open!
  tba_trig_17503:
    vnum: 17503
    name: 'Riddle #1 Restore'
    attach_type: wld
    flags: g
    types:
    - enter
    narg: 100
    arglist: ''
    script: |
      %door% 17517 u flags bcd
      %door% 17519 d flags bcd
      wait 1 sec
