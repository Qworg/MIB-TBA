  tba.32610:
    area: tba_326
    name: Camp Perimeter
    description: |2
         You stand at the crest of a large valley which is home to a huge military
      encampment.  It appears that this must be a well-funded installation as there
      are so many memebers of this army even at peace-time.  You might head east into
      the valley to see what sort of army this is, if not for the gate blocking your
      way and the two guards which stand solemnly at attention awaiting to see your
      pass.  You may walk the perimeter to the north or south, around the crest of the
      valley, but that might not be wise to pursue to any long-term degree as the
      archers towers that line the perimeter seem to have been designed for sight
