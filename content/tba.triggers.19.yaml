        elseif %1999_choice% == stripper
          %at% %1999_recip% %load% mob 1997
        end
        %at% %1999_recip% xxrecipxx %1999_recip%
      %at% %1999_recip% xxagexx %1999_age%
        detach 1927 %self.id%
      %purge% %self%
      elseif %cmd% == shake
        say Ok %actor.name%, lets just start all over again shall we!
