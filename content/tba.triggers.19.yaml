  tba_trig_1987:
    vnum: 1987
    name: firework trig
    attach_type: obj
    flags: c
    types:
    - command
    narg: 3
    arglist: light
    script: |
      if fireworks /= %arg%
        %send% %actor% You light the firework.
        %echoaround% %actor% %actor.name% lights %actor.hisher% firework.
        wait 1 s
        %echo% The fuse hisses and sparks.
        wait 2 s
        eval cx %random.7%
        set col[1] B
        set col[2] G
        set col[3] C
        set col[4] R
        set col[5] M
        set col[6] Y
        set col[7] W
        set  color %%col[%cx%]%%
        eval color %color%
        eval sx %random.7%
        set sou[1] an almighty bang
        set sou[2] a piercing whistle
        set sou[3] a painful shriek
        set sou[4] an immensely loud pop
        set sou[5] a long scream
        set sou[6] a tremendous screech
        set sou[7] a shower of sparks
        set  sound %%sou[%sx%]%%
        eval sound %sound%
        %echo% With %sound%, a        %color% F I R E W O R K explodes into light.
        %purge% self
      else
        %send% %actor% Light what?
      end
