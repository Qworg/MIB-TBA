  tba_trig_5404:
    vnum: 5404
    name: Magic User - 5421-5428, 5440, 5455
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 10
    arglist: ''
    script: |
      switch %actor.level%
        case 1
        case 2
        case 3
        break
        case 4
          dg_cast 'magic missile' %actor%
        break
        case 5
          dg_cast 'chill touch' %actor%
        break
        case 6
          dg_cast 'burning hands' %actor%
        break
        case 7
        case 8
          dg_cast 'shocking grasp' %actor%
        break
        case 9
        case 10
        case 11
          dg_cast 'lightning bolt' %actor%
        break
        case 12
          dg_cast 'color spray' %actor%
        break
        case 13
          dg_cast 'energy drain' %actor%
        break
        case 14
          dg_cast 'curse' %actor%
        break
        case 15
          dg_cast 'poison' %actor%
        break
        case 16
          if %actor.align% > 0
            dg_cast 'dispel good' %actor%
          else
            dg_cast 'dispel evil' %actor%
          end
       break
        case 17
        case 18
          dg_cast 'call lightning' %actor%
        break
        case 19
        case 20
        case 21
        case 22
          dg_cast 'harm' %actor%
        break
        default
          dg_cast 'fireball' %actor%
        break
      done
  tba_trig_5405:
    vnum: 5405
    name: Cityguard - 5434, 61-63, 82
    attach_type: mob
    flags: b
    types:
    - random
    narg: 50
    arglist: ''
    script: |
      if !%self.fighting%
        set actor %random.char%
        if %actor%
          if %actor.is_killer%
            emote screams 'HEY!!!  You're one of those PLAYER KILLERS!!!!!!'
            kill %actor.name%
          elseif %actor.is_thief%
            emote screams 'HEY!!!  You're one of those PLAYER THIEVES!!!!!!'
            kill %actor.name%
          elseif %actor.cha% < 6
            %send% %actor% %self.name% spits in your face.
            %echoaround% %actor% %self.name% spits in %actor.name%'s face.
          end
          if %actor.fighting%
            eval victim %actor.fighting%
            if %actor.align% < %victim.align% && %victim.align% >= 0
              emote screams 'PROTECT THE INNOCENT!  BANZAI!  CHARGE!  ARARARAGGGHH!'
              kill %actor.name%
            end
          end
        end
      end
  tba_trig_5406:
    vnum: 5406
    name: Healer - 5481
    attach_type: mob
    flags: b
    types:
    - random
    narg: 10
    arglist: ''
    script: |
      * This is required because a random trig does not have an actor.
      set actor %random.char%
      * only continue if an actor is defined.
      if %actor%
        * if they have lost more than half their hitpoints heal em
        if %actor.hitp% < %actor.maxhitp% / 2
          wait 1 sec
          say You are injured, let me help.
          wait 2 sec
          %echoaround% %actor% %self.name% lays %self.hisher% hands on %actor.name%'s wounds and bows %actor.hisher% head in concentration.
          %send% %actor% %self.name% lays %self.hisher% hands on your wounds and bows %actor.hisher% head in concentration.
          dg_cast 'heal' %actor%
        end
      end
  tba_trig_5407:
    vnum: 5407
    name: Thief - 5435
    attach_type: mob
    flags: b
    types:
    - random
    narg: 10
    arglist: ''
    script: |
      set actor %random.char%
      if %actor%
        if %actor.is_pc% && %actor.gold%
          %send% %actor% You discover that %self.name% has %self.hisher% hands in your wallet.
          %echoaround% %actor% %self.name% tries to steal gold from %actor.name%.
          eval coins %actor.gold% * %random.10% / 100
          nop %actor.gold(-%coins%)%
          nop %self.gold(%coins%)%
        end
      end
