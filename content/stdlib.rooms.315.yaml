  tba.31579:
    area: tba_315
    name: Town Meeting Hall
    description: |2
         This Hall has been used for many years as the center for the development of
      McGintey Cove and its laws, plus as the shouting house for the people of the
      town.  Monthly meetings are still held by either the town mayor or the immortal
      sponsor for this town.  The upper reaches of this fine place hold the various
      board rooms for McGintey Cove.
    exits:
      south:
        to: tba.31512
        hidden: false
        door: null
      up:
        to: tba.31580
        hidden: false
        door: null
    spawns: []
    tags:
    - peaceful
    num: 31579
    coord: null
    sector: inside
    extra_descriptions: []
  tba.31580:
    area: tba_315
    name: Reading Room
    description: |2
         This is the place where players may post messages to other players, or to the
      Gods or just post whatever might be on their mind in general.  This is not a
      board to be used to post flames, if a message is considered to be a flame it
      will be removed immediately.
    exits:
      down:
        to: tba.31579
        hidden: false
        door: null
      east:
        to: tba.31582
        hidden: false
