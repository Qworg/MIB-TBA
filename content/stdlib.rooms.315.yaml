    num: 31580
    coord: null
    sector: inside
    extra_descriptions: []
  tba.31581:
    area: tba_315
    name: Quest Room
    description: |2
         This is where most quests will begin, unless a different room from another
      hometown is chosen instead.  The board here is intended to be used by players to
      talk about quests, request quests, or suggest new quests.  Feel free to post any
      suggestions you may have.
