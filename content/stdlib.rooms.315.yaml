    name: The Bazaar
    description: |2
         The bazaar, surrounding you from every side, seems to close in on you.  The
      people, the noise, smell, the colors all shifting, blazing, burning before you.
      All the people, they seem to be staring at you, they seem to be laughing.  Your
      arms!  Your arms seem to be growing, they begin to drag on the ground and your
      jaw - for the love of Pete!  You jaw has elongated to the point that it is
      resting on your chest even though your head is held high.  Now the whole bazaar
      is laughing, laughing, laughing...  Just kidding.  A bit of crowd claustrophobia
      there.
