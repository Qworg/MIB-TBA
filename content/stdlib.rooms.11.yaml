      increased further by the angry winds that whip and howl against it, physical
      forces lashing at the castle as if an army of ghosts were battering to get in.
      The years of constant abuse are evidenced on the weary stone walls, which
      although sturdy, are cracked and broken in several places.  Far in the distance,
