    ambient_weather: {}
  tba.31263:
    area: tba_312
    name: Cliff's Edge
    description: |2
         A trail leads down the cliff face, a natural set of small steps allowing
      access to the beach below.  A trail follows along the edge of the cliff to the
      north, a small encampment visible in that direction.
    exits:
      down:
        to: tba.31264
        hidden: false
        door: null
      north:
