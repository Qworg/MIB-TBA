  tba.31264:
    area: tba_312
    name: Cliff
    description: |2
         This is about the half-way point between the base of the cliff on the beach
      and the top.  The steps look natural, made by nature to have happened to have
      worked well as steps.
    exits:
      down:
        to: tba.31265
        hidden: false
        door: null
      up:
