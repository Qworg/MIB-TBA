    num: 5330
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - writings
      - glyphs
      - sigils
      - hieroglyphics
      - symbols
      description: |2
           You don't understand the meaning of these symbols.
  tba.5331:
    area: tba_53
    name: A Raised Dais
    description: |2
         You are at the southern end of the ancient hall, the dust and darkness
      absorbing your light so that you cannot see past the steps of the dais.
      A low pedestal rests here.  You see something written into the face of it.
    exits:
      down:
        to: tba.5332
        hidden: false
        door:
          locked: false
          closed: false
          key: null
          name: tomb
          pickable: true
          difficulty: 0
      north:
        to: tba.5330
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    num: 5331
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - pedestal
      - writings
      description: |2
           The writings are covered in sand and worn nearly away by the passage of time:
        'I am Ramses the Damned, once counselor and aide to the mightiest of pharaohs
        and queens of this land.  Much time has passed since I last walked the earth.
        Disturb my rest at your peril.  '
  tba.5332:
    area: tba_53
    name: The Tomb Of Ramses
    description: |2
         You stand in an empty tomb, a cubicle no more then ten feet to a side.
    exits:
      up:
