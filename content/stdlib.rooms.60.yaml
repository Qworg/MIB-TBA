      - chasm
      description: |2
           To the south you see a river flowing roughly from the northeast to the west.
        It emerges from a dark opening in the side of a mountain and flows through
        Midgaard, and on into the forest.  It has eroded a deep chasm in the soft stone
        under the forest floor, and is not visible for long after it enters the forest
        proper.
    - keywords:
      - mountain
      - range
      - northeast
      description: |2
           A long mountain range stretches across the horizon to the north and
        northeast.  You have heard rumors of many different sorts of creatures living
        there, varying from Dwarves and Humans to Ogres and various humanoid creatures.
        Some say that evil Dark Elves dwell in the underworld deep below the lands of
        the Dwarves.  The caves of Moria also are found there, populated by all sorts of
        evil creatures.
    - keywords:
