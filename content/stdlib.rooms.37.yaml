  tba.3727:
    area: tba_37
    name: The west tunnel
    description: |2
         The tunnel seems to go on forever.  From small holes in the walls ooze is
      dripping onto the floor, and bats are everywhere, almost driving you crazy.
      The tunnel stretches west to east.
    exits:
      east:
