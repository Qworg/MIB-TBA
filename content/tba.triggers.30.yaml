  tba_trig_3007:
    vnum: 3007
    name: Stock Magic User
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 10
    arglist: ''
    script: |
      switch %actor.level%
        case 1
        case 2
        case 3
        break
        case 4
          dg_cast 'magic missile' %actor%
        break
        case 5
          dg_cast 'chill touch' %actor%
        break
        case 6
          dg_cast 'burning hands' %actor%
        break
        case 7
        case 8
          dg_cast 'shocking grasp' %actor%
        break
        case 9
        case 10
        case 11
          dg_cast 'lightning bolt' %actor%
        break
        case 12
          dg_cast 'color spray' %actor%
        break
        case 13
          dg_cast 'energy drain' %actor%
        break
        case 14
          dg_cast 'curse' %actor%
        break
        case 15
          dg_cast 'poison' %actor%
        break
        case 16
          if %actor.align% > 0
            dg_cast 'dispel good' %actor%
          else
            dg_cast 'dispel evil' %actor%
          end
       break
        case 17
        case 18
          dg_cast 'call lightning' %actor%
        break
        case 19
        case 20
        case 21
        case 22
          dg_cast 'harm' %actor%
        break
        default
          dg_cast 'fireball' %actor%
        break
      done
  tba_trig_3008:
    vnum: 3008
    name: Near Death Trap
    attach_type: wld
    flags: g
    types:
