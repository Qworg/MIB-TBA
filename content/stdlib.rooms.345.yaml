  tba.34500:
    area: tba_345
    name: Duluth's Zone Description Room
    description: |2
         The Location is going to be an old insane asylum with a level range of 6 to
      10. The whole zone is about 55 rooms large with three sections, the asylum, the
      asylum's cemetery, and the basement. It will have a horror theme so the
      alignment will be evil. As for the Plot, the player will have to make his/her
      way through the grounds to on a mini quest to find a piece of eq that will
      modify their strength up by three but lower their wisdom by three when they wear
      it. The quest will have one task that will need to be completed to get the
      piece of eq, but there is a quest just to get into the asylum as well. This is
      all in a modern day time period.
    exits:
      down:
        to: tba.34501
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 34500
    coord: null
    sector: inside
    extra_descriptions: []
