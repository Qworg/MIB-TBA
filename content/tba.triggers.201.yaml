  tba_trig_20195:
    vnum: 20195
    name: Aloha Welcome! - Tour Guide
    attach_type: mob
    flags: g
    types:
    - greet
    narg: 100
    arglist: ''
    script: |
      if !(%actor.varexists(aloha_welcome)%)
        smile %actor.name%
        wait 2 secs
        say Welcome to the Sapphire Islands, %actor.name%!
        wait 2 secs
        say I have prepared some items for you.
        wait 2 secs
        %load% obj 20198
        give shirt %actor.name%
        %load% obj 20193
        give bag %actor.name%
        %load% obj 20104
        give coconut %actor.name%
        %load% obj 20124
        give book %actor.name%
        wait 2 secs
        whisper %actor.name% If you lose the objects at any point of time, you can come to me and say replace
        wait 2 secs
        wink
        wait 2 secs
        open door
        wait 2 secs
        say Have fun!
        set aloha_welcome 1
        remote aloha_welcome %actor.id%
        wait 10 secs
        close door
      else
        say Welcome back!
        open door
        wait 10 secs
        close door
      end
  tba_trig_20196:
