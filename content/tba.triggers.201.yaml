  tba_trig_20134:
    vnum: 20134
    name: Tryny Sleeps - 20105
    attach_type: mob
    flags: b
    types:
    - random
    narg: 100
    arglist: ''
    script: |
      wait until 7:00
      wake
      wait 5 secs
      yawn
      wait 1 secs
      stand
      unlock door
      open door
      wait until 21:00
      say The shop if close now, please leave.
      wait 1 secs
      open door
      wait 1 secs
      set room_var %self.room%
      set target_char %room_var.people%
      while %target_char%
        if (%target_char%==%self%)
          set target_char %tmp_target%
        else
          %send% %target_char% Tryny beckons you out of the door.
          %force% %target_char% south
          set target_char %tmp_target%
        end
      done
      close door
      lock door
      wait 5 secs
      emote prepares to go to bed.
      wait 5 secs
      yawn
      wait 5 secs
      sleep
  tba_trig_20135:
    vnum: 20135
    name: CLIMB - 20109
    attach_type: wld
    flags: c
    types:
    - command
    narg: 100
    arglist: climb
    script: |
      if (%arg%==up)
        %send% %actor% You swiftly climb up the vines.
        %echoaround% %actor% %actor.name% grabs at hanging vines and deftly climbs %actor.hisher% way to the top.
        %teleport% %actor% 20157
        %force% %actor% look
      else
        %send% %actor% Climb where?
      end
  tba_trig_20136:
    vnum: 20136
    name: Talk to Old Fool - 20136
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: greet
    script: |
      if ((%arg%==man) || (%arg%==fool))
        %send% %actor% You greet an Old Fool.
        %echoaround% %actor% %actor.name% greets an Old Fool.
        wait 2 secs
        peer %actor.name%
        wait 2 secs
        say What do you want %actor.name%?
        %send% %actor% 1) Talk
        %send% %actor% 2) Trade Prism Shards for Prism Shells
        %send% %actor% 3) say Can you make me some fine prism equipments?
      else
        %send% %actor% Greet who?
      end
  tba_trig_20137:
    vnum: 20137
    name: Old fool 1) talk - 20106
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: '1'
    script: |
      %send% %actor% You talk to an Old Fool.
      %echoaround% %actor% %actor.name% talks to an Old Fool.
      wait 2 secs
      say I am one of the last few people who can make prism equipments out from prism shards and shells.
      wait 2 secs
      ponder
      say I will make some for you if you would just bring me some of those stuff.
  tba_trig_20138:
    vnum: 20138
    name: Numder of shards - 20106
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: '2'
    script: |
      %send% %actor% An Old Fool tells you 'Ten Prism Shards is the same as a single Prism Shell.'
      wait 2 secs
      %send% %actor% An Old Fool tells you 'Holding a single shell is way lighter than having 10 shards, and it is wise to exchange them to ease your load.'
      wait 2 secs
      %send% %actor% An Old Fool tells you 'If you want just TRADE with me, and I'll exchange them for you.'
      eval i %actor.inventory%
      set no_of_shards 0
      while (%i%)
        set next %i.next_in_list%
        if %i.vnum%==20115
          eval no_of_shards %no_of_shards%+1
          set i %next%
        else
          set i %next%
        end
      done
      say %actor.name%, you currently have %no_of_shards% number of prism shards in your inventory.
  tba_trig_20139:
    vnum: 20139
    name: CLIMBDOWN! - 20157
    attach_type: wld
    flags: c
    types:
    - command
    narg: 0
    arglist: climb
    script: |
      if (%arg%==down)
        %send% %actor% You swing down the vines.
        %echoaround% %actor% %actor.name% grabs at hanging vines and swings down.
        %teleport% %actor% 20109
        %force% %actor% look
      else
        %send% %actor% Climb where?
      end
  tba_trig_20140:
    vnum: 20140
    name: trade for shards -20106
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: trade
    script: |
      eval i %actor.inventory%
      set no_of_shards 0
      while (%i%)
        set next %i.next_in_list%
        if %i.vnum%==20115
          eval no_of_shards %no_of_shards%+1
          set i %next%
        else
          set i %next%
        end
      done
      if (%no_of_shards%<10)
        say You don't have enough shards for me to trade that many shells!
      else
        %send% %actor% You give an Old Fool ten Prism Shards!
        %echoaround% %actor% %actor.name% gives ten Prism Shards to an Old Fool.
        wait 2 secs
        %send% %actor% An Old Fool gives you a Prism Shell.
        %echoaround% %actor% An Old Fool gives %actor.name% a Prism Shell.
        set n 10
        while (%n%>0)
          %purge% %actor.inventory(20115)%
          eval n %n%-1

        done
        %load% obj 20116 %actor% inv
      end
  tba_trig_20141:
    vnum: 20141
    name: MAKE the Prism stuff
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: create
    script: |
      eval i %actor.inventory%
      set no_of_shells 0
      while (%i%)
        set next %i.next_in_list%
        if %i.vnum%==20116
          eval no_of_shells %no_of_shells%+1
          set i %next%
        else
          set i %next%
        end
      done
      if (%arg%==anklet)
        if (%no_of_shells%>=5)
          %send% %actor% You hand the shells to the Fool, who gives you a Prism Anklet in return.
          %echoaround% %actor% %actor.name% hands a few shells to the Fool, who in return gives %actor.name% a Prism Anklet.
          set n 5
          while (%n%>0)
            %purge% %actor.inventory(20116)%
            eval n %n%-1
          done
          %load% obj 20120 %actor% inv
        else
          say You do not have enough shells for me, %actor.name%.
        end
      else
        if (%arg%==collar)
          if (%no_of_shells%>=5)
            %send% %actor% You hand the shells to the Fool, who gives you a Prism Collar in return.
            %echoaround% %actor% %actor.name% hands a few shells to the Fool, who in return gives %actor.name% a Prism Collar.
            set n 5
            while (%n%>0)
              %purge% %actor.inventory(20116)%
              eval n %n%-1
            done
            %load% obj 20122 %actor% inv
          else
            say You do not have enough shells for me, %actor.name%.
          end
        else
          if (%arg%==dress)
            if (%no_of_shells%>=15)
              %send% %actor% You hand the shells to the Fool, who gives you a Prism Dress in return.
              %echoaround% %actor% %actor.name% hands a few shells to the Fool, who in return gives %actor.name% a Prism Dress.
              set n 15
              while (%n%>0)
                %purge% %actor.inventory(20116)%
                eval n %n%-1
              done
              %load% obj 20121 %actor% inv
            else
              say You do not have enough shells for me, %actor.name%.
            end
          else
            %send% %actor% An Old Fool tells you 'Make what?'
          end
        end
      end
