    sector: inside
    extra_descriptions: []
  tba.151:
    area: tba_1
    name: Entrance to the Thieves Guild
    description: |2
         A thief stands in the back in front of a stairwell.  Obviously making sure no
      one goes by without his permission.  The room is shabby with little furniture.
      Just a table and a few wooden chairs.  A few expensive tapestries look out of
      place hanging on the walls.
    exits:
      south:
        to: tba.164
        hidden: false
        door: null
      up:
        to: tba.110
        hidden: false
        door: null
    spawns: []
