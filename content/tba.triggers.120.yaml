triggers:
  tba_trig_12000:
    vnum: 12000
    name: Near Death Trap Lions - 12017
    attach_type: wld
    flags: g
    types:
    - enter
    narg: 100
    arglist: ''
    script: |
      * Near Death Trap stuns actor
      wait 1 sec
      set stunned %actor.hitp%
      %damage% %actor% %stunned%
      wait 5 sec
      %send% %actor% The lions grow bored once you stop struggling and leave you to die.
  tba_trig_12001:
    vnum: 12001
    name: Magic User - 12009, 20, 25, 30-32
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 10
    arglist: ''
    script: |
      switch %actor.level%
        case 1
        case 2
        case 3
        break
        case 4
          dg_cast 'magic missile' %actor%
        break
        case 5
          dg_cast 'chill touch' %actor%
        break
        case 6
          dg_cast 'burning hands' %actor%
        break
        case 7
        case 8
          dg_cast 'shocking grasp' %actor%
        break
        case 9
        case 10
        case 11
          dg_cast 'lightning bolt' %actor%
        break
        case 12
          dg_cast 'color spray' %actor%
        break
        case 13
          dg_cast 'energy drain' %actor%
        break
        case 14
          dg_cast 'curse' %actor%
        break
        case 15
          dg_cast 'poison' %actor%
        break
        case 16
          if %actor.align% > 0
            dg_cast 'dispel good' %actor%
          else
            dg_cast 'dispel evil' %actor%
          end
       break
        case 17
        case 18
          dg_cast 'call lightning' %actor%
        break
        case 19
        case 20
        case 21
        case 22
          dg_cast 'harm' %actor%
        break
        default
          dg_cast 'fireball' %actor%
        break
      done
  tba_trig_12002:
    vnum: 12002
    name: Cityguard - 12018, 21
    attach_type: mob
    flags: b
    types:
    - random
    narg: 50
    arglist: ''
    script: |
      if !%self.fighting%
        set actor %random.char%
        if %actor%
          if %actor.is_killer%
            emote screams 'HEY!!!  You're one of those PLAYER KILLERS!!!!!!'
            kill %actor.name%
          elseif %actor.is_thief%
            emote screams 'HEY!!!  You're one of those PLAYER THIEVES!!!!!!'
            kill %actor.name%
          elseif %actor.cha% < 6
            %send% %actor% %self.name% spits in your face.
            %echoaround% %actor% %self.name% spits in %actor.name%'s face.
          end
          if %actor.fighting%
            eval victim %actor.fighting%
            if %actor.align% < %victim.align% && %victim.align% >= 0
              emote screams 'PROTECT THE INNOCENT!  BANZAI!  CHARGE!  ARARARAGGGHH!'
              kill %actor.name%
            end
          end
        end
      end
  tba_trig_12015:
    vnum: 12015
    name: Room Zone Number
    attach_type: wld
    flags: bg
    types:
    - random
    - enter
    narg: 100
    arglist: ''
    script: |
      set room %room.vnum%
      eval number %room.strlen%
      switch %number%
        case 3
          set zone %room.charat(1)%
        break
        case 4
          set 1st %room.charat(1)%
          set 2nd %room.charat(2)%
          set zone %1st%%2nd%
        break
        case 5
          set 1st %room.charat(1)%
          set 2nd %room.charat(2)%
          set 3rd %room.charat(3)%
          set zone %1st%%2nd%%3rd%
        break
      done
      %echo% Room #%room.vnum% is part of zone: %zone%
