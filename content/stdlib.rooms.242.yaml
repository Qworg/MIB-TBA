  tba.24271:
    area: tba_242
    name: Midgaard Curling Club Entrance Hall
    description: |2
         You're in the entrance hall of the Midgaard Curling Club. A gray carpet
      runs down the hallway, where it ends at a set of stairs leading up and to
      the east. The walls are a pale beige color, and an ancient looking tile
      ceiling is slowly rotting away. This place looks like it's at least fifty
      years old.
    exits:
      north:
        to: tba.24272
        hidden: false
        door: null
