  tba.24266:
    area: tba_242
    name: Black Ladder
    description: |2
         You are on a black metal ladder, leading up to the catwalks.  The ladder
      rungs are slick with condensation and bits of rust break off in your hands.
      The rungs are almost ready to collapse.
