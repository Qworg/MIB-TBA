    coord: null
    sector: inside
    extra_descriptions: []
  tba.24220:
    area: tba_242
    name: The Cooland Press Office
    description: |2
         You find yourself in a quiet newspaper office. A row of darkly tinted
      windows look out onto the street, making this place fairly dark. A high
      desk stands directly in front of you, and from behind it you can see
      many desks with computers on them. Journalists are seated, typing up
      stories for the Cooland Press.
    exits:
