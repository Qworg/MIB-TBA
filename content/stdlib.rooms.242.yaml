    area: tba_242
    name: The Southern Docks
    description: |2
         You're on the docks on the southern side of the river. The wooden docks
      have been built fairly high off the river, making it impossible to access
      the river from here. Several large crates and barrels are scattered around
      here. Across the river, you can see the levee.
