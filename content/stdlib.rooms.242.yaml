  tba.24272:
    area: tba_242
    name: Curling Club Entrance Stairs
    description: |2
         You're in the far end of the Midgaard Curling Club entrance hall. The
      gray carpet ends here, and a short set of stairs leads up to east. A large
      wooden door leads north, but it's blocked off.
    exits:
      south:
