  tba.24219:
    area: tba_242
    name: The Bank of Midgaard
    description: |2
         You enter the doors and you find yourself in the bank of Midgaard. It's
      a very large room, with high ceilings and a shiny polished floor. Large
      windows let in light, giving the bank a bright glow. A long desk spans
      the entire western wall, and behind it stand several tellers, looking
      bored. An immensely thick steel door leads north, to the vault.
    exits:
      north:
        to: tba.24234
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_24298
          name: door
          pickable: false
          difficulty: 0
