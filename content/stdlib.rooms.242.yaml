  tba.24277:
    area: tba_242
    name: Spectator's Area
    description: |2
         You find yourself at the far left end of the spectator's area of
      the curling club. An enormous window looks south onto the curling
      rink. Many wooden chairs are here, lined up facing the window. Behind you,
      a large bulletin board has been attached to the wall. It's covered with
      posters and advertisements. At the top of the wall is a railing. A set of
      doors leads north onto the ice.
    exits:
