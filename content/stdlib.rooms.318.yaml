  tba.31813:
    area: tba_318
    name: McGintey Boat Station
    description: |2
         Upon entering into this huge hall, the first thing you notice is the rush of
      sound that comes at you from every side.  It seems everyone is trying
      desperately to yell over everyone else to make sure they get the right ticket to
      the right destination.  The next thing you notice is the amount of people who
      seem to have found a home here at the station, on the benches which are rowed
      neatly in the center of the floor.  These benches were obviously intended for
      use by the customers who await the arrival of their boat, but it seems that some
      the lower class, possibly less fortunates have decide that these benches work
      very well as a bed, too.  There are ticket booths to the north and south.  The
      exit is east.
