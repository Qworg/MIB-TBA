  tba.16917:
    area: tba_169
    name: A Dark Cave
    description: |2
         This room is thick with the dog-like smell of gibberlings, going about their
      daily routine, making weapons and eating, which are two of their favorite
      hobbies.  In this narrow section of the cave, it's a marvel to watch so many of
      these crazed, ill-mannered beasts exist in such a small area.  There is barely
      even room to manuever here, so they simply rush through, trampling anything in
      their path.
    exits:
      south:
        to: tba.16918
        hidden: false
        door: null
      west:
        to: tba.16916
        hidden: false
        door: null
    spawns: []
