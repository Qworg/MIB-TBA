  tba.8639:
    area: tba_86
    name: Dead End
    description: |2
         This end of the cavern is extremely rough and unfinished.  The wall is
      covered with a reddish-green ooze and the water has pooled deeply at the far
      end of the passage.
    exits:
      north:
        to: tba.8640
        hidden: false
        door: null
    spawns: []
