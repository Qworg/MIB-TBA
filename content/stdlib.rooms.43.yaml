      description: |2
           The walls in this room are perfectly smoothed away and still refecting that
        strange blue light.  You think the light must be coming from outside for there
        are no lights in here.
    - keywords:
      - throne
      - chair
      description: |2
           This chair made completly of ice is suberbly crafted and sqared away.  It
        seems to be made of one block of ice as you can see no grooves to mark that it
        is not.  The seat of the chair is very low in humanoid standards, but penguins
        see it not fit to be in high places.
