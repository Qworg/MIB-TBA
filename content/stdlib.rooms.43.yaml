    ambient_phases: {}
    ambient_weather: {}
  tba.4394:
    area: tba_43
    name: A Hunting Trail
    description: |2
         You are on a game path.  Many animals have come by here to be attacked and
      killed to be eaten.  There are eskimo tracks everywhere heading to the east
      were the hunting trail leads on.
    exits:
      east:
        to: tba.4395
        hidden: false
        door: null
      west:
        to: tba.4348
        hidden: false
        door:
          locked: false
          closed: false
          key: null
          name: gate
          pickable: true
          difficulty: 0
