  tba.4386:
    area: tba_43
    name: Rankit Weaponry
    description: |2
         There is a large clamor of metal on heated metal as you enter.  The weapons
      lining the walls are all polished and shining waiting to be used for good or
      evil.  The heat here is unbearably hot as the room is stuffy and congested.
      The temperature outside must be at least 50 degrees lower than in here.
    exits:
      west:
        to: tba.4342
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4386
