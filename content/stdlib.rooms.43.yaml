  tba.4387:
    area: tba_43
    name: Rankit Tunic Fitter
    description: |2
         While standing in this room with fur lined leather clothing upon every wall
      the young shopkeeper stands and greets you upon entering.  There are sewing
      needles and unfinished hides littering the floor, evidence of continued
      buissness.
    exits:
      east:
        to: tba.4340
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4387
    coord: null
