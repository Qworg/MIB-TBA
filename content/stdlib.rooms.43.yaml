  tba.4332:
    area: tba_43
    name: Royal Penguins Chamber
    description: |2
         This Room is enormous!  The walls are almost translucent as you look into
      them.  You see behind the Royal Penguin's throne, a chest implanted in the ice.
      The throne itself seems much to big for any penguin you have come across so
      far.  The ice on the ground on either side of the throne is well worn.  Those
      grooves in the ice may be the posts for the loyal guards of the royal penguin.
