    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4395:
    area: tba_43
    name: A hunting Trail
    description: |2
         The trail turns east and is quickly lost to the skill of eskimo hunters in
      snow.  Save the very fine foots prints hardly noticeable to the naked eye.  To
      the west is the gate of Rankit and to the south is barren lands of snow and
      ice.
    exits:
      south:
        to: tba.4335
        hidden: false
        door: null
      west:
        to: tba.4394
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4395
    coord: null
    sector: field
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4396:
    area: tba_43
    name: A Mud Trail
    description: |2
         The road becomes wet with melted water from the north.  The water seeps
      between your toes and is uncomfortably cold.  The trail continues west through
      more mud and back east to dry dirt.
    exits:
      west:
        to: tba.4397
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4396
    coord: null
    sector: field
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4397:
    area: tba_43
    name: A Mud Trail
    description: |2
         The surroundings are changing as the weather becomes colder and the ground
      begins to freeze.  The mud is becoming harder and a chill wind begins blowing
      from the north and west.  To the east is the warmth of the minotaur city, Dun
      Maura.  To the north is a wasteland of cold.
    exits:
      east:
        to: tba.4396
        hidden: false
        door: null
      north:
        to: tba.4398
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4397
    coord: null
    sector: field
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4398:
    area: tba_43
    name: A Cold, Wet Trail
    description: |2
         The trail is very wet and very cold now.  The mud has disappeared and the
      cold is all that is left.  There seems to be no trace of life anywhere around.
