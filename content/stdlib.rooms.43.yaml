    description: |2
         Standing by a large fountain in this extremly busy town square the snow
      starts falling very lightly and the townsfolk don't even care.  There are so
      many people in this little town it could be thought impossible by many in such
      a desolate place.  The snow glistings off of everything covered in it.  There
      is a small post by the fountain with many numbers on it measuring the snow.
      The snow reaches up to the 13' foot mark upon closer examination.  Also on the
      post there is a dark line at the 18.5 mark which must be the highest snow
      fall ever.  There are stairs going down from the south side of the fountain.
