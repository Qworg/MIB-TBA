    extra_descriptions:
    - keywords:
      - hides
      - skins
      description: |2
           The hides that line the walls are tanned and shaped.  They are just models
        for the sizing is different for different people.
    ambient_phases: {}
    ambient_weather: {}
  tba.4388:
    area: tba_43
    name: The Butchery
    description: |2
         Blood stained snow seeps out onto the snow outside.  The odor is unbearable
      as you enter as it smells like long over due socks that need washing.  Other
      fouler smells are mixed throughout the area but none worse than the smell of
      dead animals.  No one seems to be able to cope with the smell except for the
      butcher himself as you see residents come in then run out.
    exits:
      west:
        to: tba.4340
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4388
    coord: null
    sector: inside
