    ambient_phases: {}
    ambient_weather: {}
  tba.4389:
    area: tba_43
    name: Entrance to Glogtar's Throne Room
    description: |2
         The steps leading back up to a hole in the snow emerges out in the air of
      the center of the city.  Nobody comes here from the outside for fear of seeing
      their dictator, Glogtar the Ruler of Ice.  To the north is a tunnel with a
      large light coming from the end.
    exits:
      north:
        to: tba.4390
        hidden: false
        door: null
      up:
        to: tba.4341
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    - no_mob
    num: 4389
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4390:
    area: tba_43
    name: A Tunnel Through the Snow
    description: |2
         Walking along the tunnel under the snow you hear the sound of feet above
      you.  The light to the north is getting bigger if you continue northward.  Or
      the stairs are just to the south if you wish to leave the presense of Glogtar.
    exits:
      north:
        to: tba.4391
        hidden: false
        door: null
      south:
        to: tba.4389
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4390
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4391:
    area: tba_43
    name: 'A Tunnel Through the Snow '
    description: |2
         The stairs are away at the end of this tunnel with the sun filtering down
      through the hole that is continually cleared of snow.  Just to the north is the
      throne of Glogtar.  The light coming there is bright and does not flicker.  If
      there was a fire here it would melt and collapse the whole chamber and tunnel
      causing the raod below to cave in.
    exits:
      north:
        to: tba.4392
        hidden: false
        door: null
      south:
        to: tba.4390
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 4391
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.4392:
    area: tba_43
    name: Throne of Glogtar
    description: |2
         Glogtar seems to be a very large man.  His throne, sitting here, is twice
      the size it should be for his size.  The snow is neatly packed around the
      chamber and dug out so you have to decend several steps to come upon the Ruler
      of the Ice.  Servants constantly coming in and out through a small entry way in
      the west side of the wall bring their king delicacies.  To the south is the
      exit and there is a small intricately carved door to te east.
    exits:
      east:
        to: tba.4393
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_4322
          name: door
          pickable: true
          difficulty: 0
      south:
        to: tba.4391
        hidden: false
        door: null
      west:
        to: tba.4341
        hidden: false
        door:
          locked: false
          closed: false
          key: null
          name: hidden
          pickable: true
          difficulty: 0
    spawns: []
    tags:
    - outdoor
    num: 4392
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - throne
      description: |2
           The throne is carved very delicately and very skillfully.  The carving in
        the wood has many curves and intricate lacings throughout the intirething from
        the legs to the head.
    ambient_phases: {}
    ambient_weather: {}
  tba.4393:
    area: tba_43
    name: Treasure Room
    description: |2
         This room is lined with steel and looks like a prison cell.  The one
      exception to it being a prison is the HUGE amount of money sitting in the
      corner.  The only way out is the way you came in.
    exits:
      west:
        to: tba.4392
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_4322
          name: door
          pickable: true
          difficulty: 0
