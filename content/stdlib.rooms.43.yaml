  tba.4300:
    area: tba_43
    name: Polar/Walrus Zone Description Room
    description: |2
         This zone is made for leveling up and experience.  Because in CW there are
      little places to get good or even moderate exp.  This zone will have two
      halves.  In the first half there will be penguins on a large scale in a
      community in the northern wastes of Ilnyir.  The other half is the city of
      eskimos, Rankit.  Rankit is ruled by a gluttonus king, Glogtar, and does little
      for his kingdom.
      Rooms: 95
      Objs: 23
      Mobs: 17
      Location: Branching of west from 8601 to 4396 leading to the icy bridge
      Zone 43 was linked to the following zones:
      86 Duke Kalithorn's Keep          at  4396 (east ) --->  8601
