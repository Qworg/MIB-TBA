  tba.4385:
    area: tba_43
    name: Rankit Food Supply
    description: |2
         The smell of freshly baked food eminates from this shop.  There is a list on
      the counter for all to see the contents of the shop.  There are four large
      ovens on the back wall releaseing heat that makes this room at least 20 degrees
      warmer than outside.
    exits:
      east:
        to: tba.4342
        hidden: false
        door: null
    spawns: []
