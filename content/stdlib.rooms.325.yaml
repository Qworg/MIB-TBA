  tba.32539:
    area: tba_325
    name: Grassy Court
    description: |2
         Just north of here is a small wooden castle about five feet high.  It is
      painted in bright, garish colors that bring immediate attention to it.  Inside
      of it, puppets dance and cavort to the squeals of delight from the children
      seated on the ground before the castle.  To the east is a small area where caged
      animals pace in their cages, a place where rare animals can be seen and in some
      instances - touched.
