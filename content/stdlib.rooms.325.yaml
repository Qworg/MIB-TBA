  tba.32544:
    area: tba_325
    name: Open Air Restaurant
    description: |2
         There are no walls on this place, only a set of four poles which hold up a
      thin wooden roofing.  A grill with steaming meats and a keg filled with pleasant
      juices lies at one end of the structure, tended by workers.  This would
