    name: The Dark Tunnel
    description: |2
         This tunnel is short but dark.  At the far end it opens up into an extremely
      large room.  In the center a fire burns and the tracks stop at the far end in
      front of a large throne.  Shadows caused by the fire dance across the tunnels
      walls making eerie shapes.  Your adventure looks to be almost finished.
