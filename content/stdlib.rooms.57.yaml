      description: |2
           Sap oozes down this ladder forming a sticky covering.
  tba.5728:
    area: tba_57
    name: The Cave
    description: |2
         This cave is large and spacious.  At the far end stands a glowing set of
      scales.  They dont seem to move or even be alive, the tracks continue through
      here and into a hole at the back of the cave.  The hole is very large and
      dirty, bones surround the entrance.  Where do they go?
