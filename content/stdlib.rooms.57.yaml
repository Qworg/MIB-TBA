    area: tba_57
    name: In the valley of Capricorn
    description: |2
         A large valley stretches before the eye.  The grass is deep and springy and
      the smell of fresh mountain air greets thy nostrils.  There are large mountains
      surrounding this valley and young goats are climbing around on the foot of the
      large one near the far end.  These goats are drinking from the pool of water at
      the bottom of the waterfall.  Exits lead east and west toward groups of goats
      and and west, further into the valley.  Of course there is also and exit back
      into the pass.
