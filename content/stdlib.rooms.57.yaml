    name: Floating in the Ethereal Void
    description: |2
         The green speck from before is the size of a doorway now, this portal seems
      to stretch the limits of space and time.  Red fills the eyes and a chilly wind
      has started to blow through the doorway.  Through the door there looks to be a
      mountain valley, and by the sounds of it there is a herd of goats as well.
