  tba.5727:
    area: tba_57
    name: Under an Oak Tree
    description: |2
         Under this tree is a small grouping of goats.  They look to be males from
      all their headbutting and grunting.  This tree is very large and stripes that
      have been scored into the tree form a ladder.  Tree sap oozes down the ladder
      and it has a sweet smell.  Little red eyes can be seen up the ladder.
    exits:
