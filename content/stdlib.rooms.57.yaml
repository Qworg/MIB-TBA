  tba.5733:
    area: tba_57
    name: Near the top of the Tree
    description: |2
         The red eyes have disappeared up into the boughs of the tree.  The
      noises are now very loud and mournful.  Maybe somethings hurt!  Whatever it is,
      it doesnt sound too good.  Could the thing with red eyes be the one
      moaning?  Or is it something else?
