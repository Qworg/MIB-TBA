  tba.5721:
    area: tba_57
    name: Entrance to the valley
    description: |2
         Lush green grass covers the ground of this valley.  There are goats
      scattered across the pastures nibbling here and there, bleating and headbutting
      each other.  At the far end stands Capricorn, on his head is what you saw
      before, golden horns.  There are a few trees dotted throughout the valley and
      goats are standing under them sleeping and just lazing about.  Rivers
      criss-cross the valley and at the far end is a waterfall.  Exits lead back into
      the pass and down into the valley.
    exits:
