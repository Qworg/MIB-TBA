    area: tba_57
    name: Scorpio's Throneroom
    description: |2
         This is the throneroom of the self proclaimed leader of the zodiac, The
      tracks throughout this area were his!  He stands here clicking his claws in
      anticipation of his next meal which is squirming behind his throne.  It's
      Virgo!  That sleazy freak has zodianapped her!  It's time someone taught him a
      lesson.
