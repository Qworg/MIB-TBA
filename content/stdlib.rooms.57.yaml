  tba.5714:
    area: tba_57
    name: Virgos' Bedroom
    description: |2
         This bedroom is lavishly furnished.  Almost everything is blue and gold but
      there are also hints of red and orange.  All the metal work is made with
      copper.  There is a large double bed in one corner, it looks to be made out of
      solid oak, there is also a table and chairs.  The roof is covered with a star
      chart, certain parts are glowing dimly.  The most brightly shining sign on the
      chart appears to be Scorpio.  How very strange.
