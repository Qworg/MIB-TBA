    area: tba_57
    name: Exit from the Portal
    description: |2
         Upon exiting from the red portal a mountain pass comes into view.  The
      bleating from the goats echoes through here and makes a terrible din.  In the
      distance there is a faint gold colored sparkle, maybe two.  Large hills,
      possibly small mountains stretch up to the east and west and they have snow
      covered peaks.  There are exits north back into the portal and south into the
      pass.
