triggers:
  tba_trig_28800:
    vnum: 28800
    name: Cleric Fight Function
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 35
    arglist: ''
    script: |
      * Written by Fizban to imitate ROM Cleric Function
      set current_hp %actor.hitp%
      set rand %random.7%
      * The dmg 5000 is actually non-damage, not damage.
      switch %rand%
        case 1
          case 2
          case 3
          case 4
          set dmg 5000
        break
        case 5
          eval dmg (%random.2% * %random.8%) + (%self.level% / 2)
          set spellname cause serious
        break
        case 6
          eval dmg (%random.3% * %random.8%) + (%self.level% - 6)
          set spellname cause critical
        break
        case 7
          eval dmg %random.6% + %self.level%
          set spellname flamestrike
        break
      done
      eval new_current_hp %current_hp% - %dmg%
      eval dmgpc (%dmg% * 100) / %current_hp%
      if %dmgpc% == 0
        set vp misses
      elseif %dmgpc% <= 4
        set vp scratches
      elseif %dmgpc% <= 8
        set vp grazes
      elseif %dmgpc% <= 12
        set vp hits
      elseif %dmgpc% <= 16
        set vp injures
      elseif %dmgpc% <= 20
        set vp wounds
      elseif %dmgpc% <= 24
        set vp mauls
      elseif %dmgpc% <= 28
        set vp decimates
      elseif %dmgpc% <= 32
        set vp devastates
      elseif %dmgpc% <= 36
        set vp maims
      elseif %dmgpc% <= 40
        set vp MUTILATES
      elseif %dmgpc% <= 44
        set vp DISEMBOWELS
      elseif %dmgpc% <= 48
        set vp EVISCERATES
      elseif %dmgpc% <= 52
        set vp MASSACRES
      elseif %dmgpc% <= 100
        set vp DEMOLISHES
      else
        set vp ANNIHILATES
      end
      if %dmg% > 4000
        return 1
      else
        %send% %actor% %self.name%'s %spellname% %vp% you!
        %echoaround% %actor% %self.name%'s %spellname% %vp% %actor.name%!
      end
      switch %rand%
        case 1
          dg_cast 'poison' %actor%
        break
        case 2
          dg_cast 'curse' %actor%
        break
        case 3
          dg_cast 'blindness' %actor%
        break
        case 4
          dg_cast 'earthquake'
        break
        case 5
          case 6
          case 7
          %damage% %actor% %dmg%
        break
      done
