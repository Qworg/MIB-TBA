  tba.31176:
    area: tba_311
    name: A Humid Cave Entrance
    description: |2
         Standing within the conifines of this wide, arched cave entrance you feel an
      immediate change in the quality of the air about you.  It has become thick, warm
      and heavy to breathe.  It almost seems as if you might be able to see your
      breath, so thick it feels as it issues from your mouth.
    exits:
      east:
        to: tba.31177
        hidden: false
        door: null
