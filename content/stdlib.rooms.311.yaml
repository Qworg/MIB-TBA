  tba.31192:
    area: tba_311
    name: Entrance to the Emerald Cave
    description: |2
         A green glow comes from the innards of the cave before you, a powerful
      emanation of strength and wealth.  All but the green glow is completely dark,
      the glow making the entire scene before you seem surreal, otherwordly.
    exits:
      east:
        to: tba.31193
        hidden: false
        door: null
      west:
        to: tba.31135
        hidden: false
        door: null
