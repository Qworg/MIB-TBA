    area: tba_311
    name: A Humid Cave
    description: |2
         There is an almost pleasant, steady light pervading the inner depths of this
      cave, one that does not really give off any uneasy or dangerous vibes.  The
      cavern slopes downward a bit before entering into a very large room just east of
      here.
    exits:
