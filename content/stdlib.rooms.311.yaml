    name: Behind the Waterfall
    description: |2
         The water cascades down just south of here, pouring into the reservoir used
      by the farmers of the Ofingian farmlands.  A long, narrow tunnel heads straight
      west toward a very bright source of light, one which is blinding to look upon
      without shading one's eyes.
    exits:
      west:
