    area: tba_311
    name: Lair of the Blue Dragon
    description: |2
         All of the glory and majesty that is a dragon is personified by this enormous
      room which is the home of just such a creature.  The walls glow a strange, blue
      light which contrasts with the hot, thick air which infests this place.  Heaps
      of all manner of odds and ends, valuable and otherwise, litter the floors of the
      place.
    exits:
      north:
