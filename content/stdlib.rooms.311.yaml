  tba.31184:
    area: tba_311
    name: Cold, Wet Cave Entrance
    description: |2
         A steady trickle of clear water runs from the interior of the cave, running
      down in a rivulet out the edge of the entrance and down the cliff face to the
      plains below.  Cold air blows from the depths of the cave, a frigid, odd air
      that smacks of the unnatural.
    exits:
      east:
        to: tba.31185
        hidden: false
        door: null
