    area: tba_311
    name: Lair of the Green Dragon
    description: |2
         The smell of this room is repulsive, a fetid, old, nasty reek that assaults
      your nostrils and holds you hostage by its stench.  Your feet stick to the
      floor, mired down by a thick, black, gooey substance which coats the entire
      cavern.  Heaps of junk, treasure, and bones lie scattered and jumbled, covered
      in the goo all about the room.
    exits:
      west:
        to: tba.31182
        hidden: false
        door: null
    spawns: []
