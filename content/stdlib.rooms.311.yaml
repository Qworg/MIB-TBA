    area: tba_311
    name: A Feeling of Immensity
    description: |2
         Upon entering into this room, an immediate feeling of vast size seeps into
      your awareness.  You are no longer in a long tunnel but in a vast room with a
      great amount of space.  The steady sound of some sort of deep, heavy wind can be
      heard.  Or is that breathing?
