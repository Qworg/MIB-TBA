  tba.31193:
    area: tba_311
    name: In an Emerald Cave
    description: |2
         A huge chamber lies just to the east, the source of the green glow which
      could be seen from outside the cave.  All manner of treasure, mostly precious
      gems, lie scattered about in heaps all over the floor of the room.  This is
      obviously the home of a dragon - best to be extremely cautious.
    exits:
      east:
        to: tba.31194
        hidden: false
        door: null
      west:
        to: tba.31192
