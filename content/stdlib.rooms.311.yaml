  tba.31101:
    area: tba_311
    name: Through the Mountain
    description: |2
         The weight of an entire mountain enfolds all about you, the immensity and
      sheer presence of such a sizable force as a mountain forces itself into your
      awareness.  The way west leads toward the bright light, an opening into another
      section of the world, cut off from the rest of the world by the impassable
      mountain which you currently travel through.  Just east of here is the falling
      water of the waterfall which runs down into the reservoir in the Ofingian
      farmlands.
    exits:
      east:
        to: tba.31100
        hidden: false
        door: null
      west:
        to: tba.31102
        hidden: false
        door: null
    spawns: []
