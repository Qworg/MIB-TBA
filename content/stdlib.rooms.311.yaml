    area: tba_311
    name: A Smaller Cave Entrance
    description: |2
         Smaller.  Smaller meaning only twenty feet high and thirty feet wide.  Do not
      be fooled.  The creature which resides within is no easy kill.  The scorch marks
      which riddle the walls of the cave all the way through give testament to the
      fact the caution would be well advised.
    exits:
      east:
