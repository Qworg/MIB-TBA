  tba.31186:
    area: tba_311
    name: The Frost Cavern
    description: |2
         This can only be the lair of a white dragon, a very feared predator who's
      anger and evil is matched only by a very select few of its cousins.  Frost coats
      the walls, iced over in many places to a thick, white sheen.  Stalagtites are
      replaced by sharp spikes of ice which have dripped to form gigantic icicles.
    exits:
      south:
        to: tba.31187
        hidden: false
        door: null
      west:
        to: tba.31185
        hidden: false
        door: null
    spawns: []
