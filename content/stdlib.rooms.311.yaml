  tba.31189:
    area: tba_311
    name: A Glowing Cave
    description: |2
         A huge, gleaming cave lies only a few steps from here, its walls covered in
      glowing, clear shards of crystal which are melted into the walls, embedded by
      the strong heat.  The exit to this place lies just to the west.
    exits:
      east:
        to: tba.31190
        hidden: false
        door: null
      west:
        to: tba.31188
        hidden: false
