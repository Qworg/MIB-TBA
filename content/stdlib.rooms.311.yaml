  tba.31182:
    area: tba_311
    name: A Slimy Bend
    description: |2
         The cave makes a sharp bend, opening into a an enormous room within which
      lies the lair of a green dragon.  The oozing slime covers not only in a layer on
      the floor but covering everything in a thick, three to four inch pool of the
      stuff.
    exits:
      east:
        to: tba.31183
        hidden: false
        door: null
      west:
        to: tba.31181
        hidden: false
