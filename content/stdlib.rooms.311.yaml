  tba.31173:
    area: tba_311
    name: A Hot, Humid Cave
    description: |2
         The temperature inside this rough-hewn cavern is markedly higher in
      temperature than it is outside in the fresh, bright air.  It is not dark,
      although the light which permeates this place is a red-hued, onholy light which
      flickers and twists almost as if alive, like that of fire.  The passage runs
      deeper into the mountain or ends just west of here in open air.
    exits:
      south:
        to: tba.31174
        hidden: false
        door: null
      west:
        to: tba.31172
