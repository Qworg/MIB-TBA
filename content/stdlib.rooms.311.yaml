  tba.31115:
    area: tba_311
    name: An Entrance Into an Enormous Cavern
    description: |2
         This is by far the largest and most intimidating cave along the Dragon's
      Teeth.  That is not to say that the rest of the caves which dot the cliffside
      are not fairly imposing and fearsome, but they most certainly pale in comparison
      to the amazing size of this cave.  The entrance is at least fifty feet in height
      and twice as wide, if not more.  A steady sound from within leads you to believe
      that someone is probably home.
