  tba.31172:
    area: tba_311
    name: Entrance to a Dragon's Cave
    description: |2
         This can be nothing else than the home of a dragon.  The evidence is
      scattered all about your feet in the form of thick dragonscales and the
      shattered bones of animals and people which fell prey to the appetite of the
      monster within.
    exits:
      east:
        to: tba.31173
