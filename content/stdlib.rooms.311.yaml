  tba.31141:
    area: tba_311
    name: The Entry Into a Smaller Cave
    description: |2
         The cave before you is by no means small, however it is smaller in size by
      far than the rest of the caves which dot this cliffside.  The entryway is
      blackened and scorched from DragonFire and extremely cluttered with old scales
      and sloughed skin.  The bones of old meals lie strewn about the entrance,
      looking as they were attempted to be pushed out to fall onto the plains below,
      but the effort was only half-attempted.
