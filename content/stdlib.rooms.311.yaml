    name: Flying the Teeth
    description: |2
         The cliff's base lies still far below, a considerable drop for even a winged
      creature.  The cliff is of the smoothest rock, as if carefully carved and sanded
      by an expert sculptor.  The entryways into the caves which dot this cliff face
      are easily found, from any vantage point.  Just north of here is the entrance
      into one of the caves.
