  tba.31175:
    area: tba_311
    name: Lair of the Red Dragon
    description: |2
         The walls of this emormous room glow in amber hues, a reflecting light that
      makes concentration fairly difficult.  Most of the floor of the room is clear of
      any sort of debris, as the dragon which makes his home here needs a large amount
      of space to stretch out and relax when he is slumbering.  All along the edge of
      the floor lies strewn bits and pieces of old meals, bones, treasure and other
      various objects.
    exits:
