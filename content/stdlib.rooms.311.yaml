  tba.31102:
    area: tba_311
    name: Halfway Through the Mountain
    description: |2
         Squinting against the light coming from the western opening in this tunnel,
      you begin to finally get used to the dimness of the cavern combined with the
      glare from the light coming from the other opening.  Scorch-marks riddle the
      walls of the tunnel, a thick, black, phospherous soot glazes the walls,
      dwindling away to the east but getting quite thick closer toward the western
      exit.  Some sort of fire was blasted into this tunnel - and more than once.
    exits:
      east:
        to: tba.31101
