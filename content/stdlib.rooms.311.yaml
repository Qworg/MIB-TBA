  tba.31190:
    area: tba_311
    name: Lair of the Crystal Dragon
    description: |2
         The glow from the walls makes your vision swim a bit before coming into
      focus, the glimmer and gleam of so much clear crystal reflecting light from one
      wall to another.  The place is a wonder - the dragon which resides here must
      have spent many years collecting the shards to make this place completely
      enclosed in the glimmering glow of so much crystal.
    exits:
      east:
        to: tba.31191
        hidden: false
        door: null
