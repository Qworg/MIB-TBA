    area: tba_311
    name: Slimy Cave
    description: |2
         The denizen of this large cave has to be the most distusting form of life
      that this world could house.  The black goo which was only on the floor at the
      entryway now covers the walls and ceiling, as if spattered and splashed by
      something very large - and the smell, the smell is indescribable.
    exits:
      east:
        to: tba.31182
        hidden: false
        door: null
      west:
        to: tba.31180
        hidden: false
