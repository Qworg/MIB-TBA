    area: tba_311
    name: Cave Entrance
    description: |2
         A terribly nasty odor envelopes you as you step foot into the entryway to
      this place.  A thick, black goo covers the floor of the cave and sticks to your
      feet, making your footing treacherous to say the least.  Darkness and death lay
      within - beware.
    exits:
