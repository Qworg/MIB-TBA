  tba.31168:
    area: tba_311
    name: Entrance into a Black Cave
    description: |2
         Everything instantly goes dark as you enter into this cave, even the glaring
      bright light of the sun just to the west is immediately shut out.  Feeling along
      the walls, you find that the cave continues westward, deeper into the hard rock
      of the mountain.
    exits:
