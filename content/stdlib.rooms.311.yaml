  tba.31174:
    area: tba_311
    name: Lair of the Red Dragon
    description: |2
         This huge room is the antechamber to the main room in which resides a very
      large, and very mean-looking red dragon.  Its heaving flanks can be seen from
      this area of the cave, its deep, malevolent black eyes fixed squarely on you,
      bearing down into your soul.
    exits:
      east:
        to: tba.31175
        hidden: false
        door: null
      north:
        to: tba.31173
        hidden: false
        door: null
    spawns: []
