    area: tba_311
    name: The Emerald Lair
    description: |2
         This is the home of a great Emerald Dragon, one of very few still exist
      anywhere in the world.  The walls are aglow with a greenish light which comes
      mostly from the many emeralds which are embedded in the rock, melted and
      scorched there by the dragon's killing breath.
    exits:
      south:
        to: tba.31195
        hidden: false
        door: null
      west:
