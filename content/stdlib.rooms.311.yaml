  tba.31169:
    area: tba_311
    name: In a Darkened Cave
    description: |2
         Nothing can be seen, not the walls, nor the floor, nor you hand were you to
      hold it directly before your eyes.  It can only be that the darkness of this
      place is magical in nature, a cloak of obscurity maintained by the resident so
      that intruders might never have the upper hand.
    exits:
