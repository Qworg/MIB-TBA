    area: tba_311
    name: A Cold Cave
    description: |2
         As you get deeper into the cave, the air gets colder and colder.  Every step
      take the temperature down by at least ten degrees, making your face begin to
      numb.  Just ahead is a huge cavern room draped in icicles and frost.
    exits:
