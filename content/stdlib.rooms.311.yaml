  tba.31104:
    area: tba_311
    name: The Northern Exit
    description: |2
         There is absolutely no way to describe the feeling of coming to the opening
      of a cave to find yourself standing well over five hundred feet up from any sort
      of solid ground.  The cave 'entrance' is nothing more than a hole in a cliff
      face - a cliff which rises far above the green grasslands which it borders the
      east side of, very far.  Unless you can fly, the only way you might have the
      chance at getting down below into those grasslands is if you hitch a ride on a
      passing dragon - and that is just not likely to happen.  Looking directly down
      from where you perch, you see a small (or is it small, it could just appear that
      way from this height) fortress nestled quite close up to the cliff face.
    exits:
      east:
        to: tba.31103
        hidden: false
        door: null
      west:
        to: tba.31105
        hidden: false
        door: null
