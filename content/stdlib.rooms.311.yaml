  tba.31188:
    area: tba_311
    name: Entrance to a Glowing Cave
    description: |2
         An odd glow comes from the inside of the cave, a strange light that seems
      both steady and fragile, as it flickering but not really flickering.  The walls
      of the entrance are blackened and scorched, but only at this front area.  Just a
      bit further in, the walls of the cave are smooth and clean.
    exits:
      east:
        to: tba.31189
        hidden: false
