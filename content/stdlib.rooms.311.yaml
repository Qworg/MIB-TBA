  tba.31103:
    area: tba_311
    name: Just East of the Western Exit
    description: |2
         The light blasting in from the opening just west of here is now not only
      bright, but warm as well - almost painfully so.  Shielding your eyes from the
      bright rays does not help to give you any more of a clear picture of what might
      lie beyond the exit of that blinding hole, it is much too bright.  The way to
      the east is dim, yet for some reason exudes much less of a dangerous vibe than
      the way west.
    exits:
