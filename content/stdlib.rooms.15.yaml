  tba.1514:
    area: tba_15
    name: The Fall
    description: |2
         In the beginning, he was the best, the most beautiful of all the angels,
      and God's most loved creation.  Look at your own beauty, human, and do what
      he could not.  Look at your beauty, and learn to kneel!
    exits:
      north:
