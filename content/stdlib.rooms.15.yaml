  tba.1526:
    area: tba_15
    name: Conversion
    description: |2
         Unbelievers, I do not worship what you worship, nor do you worship
      what I worship.  I shall never worship what you worship, nor will you
      ever worship what I worship.  You have your own religion, and I have
      mine.
    exits:
