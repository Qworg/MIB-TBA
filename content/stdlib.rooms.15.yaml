  tba.1503:
    area: tba_15
    name: A Long Road
    description: |2
         The road clears, the fog and pain of the first few steps left behind
      you.  Despite the sudden clarity, your mind is still haunted, images of
      an old woman kneeling in prayer, eyes closing, smiling and crying.
