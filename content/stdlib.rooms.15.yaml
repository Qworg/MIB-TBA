  tba.1515:
    area: tba_15
    name: Temptation
    description: |2
         Temptation is the IF, the wondering, the second-guessing, the "I will
      be a better man... if..."  And that if is usually taken, sitting alone,
      listening to that voice, calling you, offering such an easy way, but such
      a crooked one.
    exits:
