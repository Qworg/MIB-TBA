    name: Wooden Guard Gate
    description: |2
         The road south of this gate is covered in an even coating of gravel, just a
      short distance to the southeast a small settlement is visible.  The gate appears
      to be more of a stopping point for travelers to stop for directions or to make
      certain that the Baron is indeed in his tower rather than a checkpoint for a
      military operation - although there are guards who man it.  To the west is the
      short stretch of the King's Highway before it turns north, headind far from
      Cailveh's lands.
