    area: tba_314
    name: X'Raantra's Altar
    description: |2
         The floor of the gazebo is stone, like the rest of the edifices which make up
      this asylum, and is sunk in roughly a foot from the edges.  This sunken area
      forms a sort of a pool, which was probably not the original intent of the
      builders, which is filled to the rim with thick, dark blood.  Torches are thrust
      into holders on the supports of the gazebo's ceiling, four of them in number
      lighting this terrible place all too well.
