    description: |2
         The entrance to a chapel lies just south from here, a wide set of stone steps
      leading up east to the main door.  To the southwest, in the center of the
      courtyard, is a large stone gazebo with a ceremony of some sort in progress.
      People of some race or another can be seen shuffling about in the courtyard
