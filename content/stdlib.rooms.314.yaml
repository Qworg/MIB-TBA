  tba.31440:
    area: tba_314
    name: The Old Stables
    description: |2
         At one time this must have been where the residents, faculty and visitors of
      the asylum kept their mounts while they stayed on the grounds.  The floor shows
      no sign of ever having been stoned, the walls are all of a crude stone which
      does not look to have been made for the purpose of warmth at all.
    exits:
