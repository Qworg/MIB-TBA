  tba.31438:
    area: tba_314
    name: The Guards' Quarters
    description: |2
         It must be that the inmates of this institution were at least slightly
      harmful to themselves and others if a guard had to be kept on the grounds at all
      times.  This building is much like any of the others around, decripid and
      falling apart, blood stains everywhere.
