  tba.31439:
    area: tba_314
    name: The Guards' Quarters
    description: |2
         The building is in a shambles in every area.  Nothing is left of any value,
      only broken bits of furniture and the like.  This asylum must have been
      abandoned and left to rot quite some time ago.
    exits:
