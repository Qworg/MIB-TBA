    area: tba_314
    name: Receiving Chamber
    description: |2
         This was the dean of the asylum resided back when the asylum was functional -
      as an asylum anyway.  The blood which seems to cover most of the grounds of the
      asylum seems especially thick here, the walls sticky to the touch and the floor
      tacky when stepped upon.  There is a small door in the east wall.
    exits:
