  tba.31433:
    area: tba_314
    name: Bedchamber
    description: |2
         This ramshackle room is all that is left of what was once a very comfortable
      bedchamber to the dean and his wife.  The sheets and pillows have long since
      been torn to shreds and carried off by rats for bedding and nests, now all that
      is left is a pile of timber from the bed and furniture and a lot of plaster
      chunks which have fallen from the walls.  All of which is - of course - soaked
      in blood.
    exits:
      north:
        to: tba.31432
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    num: 31433
    coord: null
    sector: inside
    extra_descriptions: []
  tba.31434:
    area: tba_314
    name: Jumbled Path
    description: |2
         Mostly covered in weeds and brownish plant life, this trail is strewn with a
      litter of rock and mortar from the buildings around it all of which is covered
      with a deep red hue, the color of blood.  It appears that the way may have been
      cleared quite recently as although there is a great deal of rubble strewn about,
      the way through it all is not in any way prohibitive, as if a path had been
      cleared.  To the south a flickering light of some sort can be seen.  To the east
      is the entryway into a small, low building made of stone.
    exits:
      east:
        to: tba.31438
        hidden: false
        door: null
      north:
        to: tba.31404
        hidden: false
        door: null
      south:
        to: tba.31436
