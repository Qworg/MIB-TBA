    name: Cloaking Room
    description: |2
         The stone hooks still jut from the walls where the clergy must once have hung
      or donned their robes of office before or after a service.  There are, of
      course, no robes hanging from those hooks any longer.  This room, like most of
      the other rooms in the buildings of this asylum, has succumbed to the demand of
      time and decay, the walls crumbling and the floors broken and cracked.  All of
      this is, of course covered in a sheen of red.
