    - no_mob
    num: 31436
    coord: null
    sector: inside
    extra_descriptions: []
  tba.31437:
    area: tba_314
    name: Just North of the Courtyard
    description: |2
         The path enters into the northwest corner of a large stone courtyard,
      complete with a huge stone gazebo in the center.  It turns out the gazebo is the
      source of the flickering light, as some sort of fire is lit upon it, humans
      moving about around that fire.  All along in the courtyard are also people who
      seem to be about some sort of business, whether swaying in some ritual of some
      sort of going about a task of some sort, they are many.
    exits:
      north:
        to: tba.31435
        hidden: false
        door: null
