    name: Shaft
    description: |2
         This is nothing more than a small five by five room with no ceiling.  A look
      upward reveals that this tall shaft leads directly up into the bell tower, as
      the bell is visible even from here on the ground level.  A set of ropes hang
      down, their frayed ends high out of reach.  They must once have connected to
      something here, but whatever that was, it is long since rotted or taken.
    exits:
