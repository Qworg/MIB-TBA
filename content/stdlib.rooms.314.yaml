    description: |2
         There is not much of interest on this roof save for the fact that it is the
      only place thus far that is not soaked in blood, nor is it full of the rubble
      and trash that is littered about the ground and in the buildings.  It must be
      too much effort for the vandals of this area to climb out here and trash this
      part as well.  It appears that the only way from this rooftop is down, jumping
      from the roof to the courtyard below.
