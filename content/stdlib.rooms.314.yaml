    num: 31435
    coord: null
    sector: inside
    extra_descriptions: []
  tba.31436:
    area: tba_314
    name: Jumbled Path Near the Courtyard
    description: |2
         The source of the flickering light is now in sight.  It comes from a large
      crumbling stone gazebo set in the middle of a huge courtyard.  The courtyard is
      surrounded by darkened buildings, all of which show signs of decay.  There are
      humanoid shaped moving all about the courtyard, some appear as if they might be
      dancing, others appear to be going about specified tasks.  In the gazebo there
      are a number of people as well, all of which swaying in unison to some as yet
      unheard sound.  In looking down on the floor of the courtyard and even on this
      path, blood can be seen spilled in huge quantities all over the stone.  It
      almost appears as if it were poured on the stone in an attempt to saturate the
      entire area.
    exits:
      north:
        to: tba.31434
        hidden: false
        door: null
      south:
        to: tba.31445
        hidden: false
        door: null
    spawns: []
