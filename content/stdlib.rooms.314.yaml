  tba.31432:
    area: tba_314
    name: Living Area
    description: |2
         This was the dean and his family's main room for gathering together and
      eating meals or sharing time.  The remains of an old table are here, one leg all
      that is left of the original four, propping the table up at an absurd angle.
    exits:
