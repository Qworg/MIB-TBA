    name: Chapel Worship Room
    description: |2
         There are spots where rows of pews once lined before a carved stone altar,
      however all that is left of the majesty of the place are two pews and the
      remains of the altar, tipped to the side and split asunder.  It would only
      appear the work of vandals or looters if not for the immense amounts of blood
      soaked into the stonework of the place.  This was a calculated ruination of a
      place of worship.
