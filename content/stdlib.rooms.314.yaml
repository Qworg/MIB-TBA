  tba.31460:
    area: tba_314
    name: Entrance to the Chapel
    description: |2
         These steps lead straight up to the door of the chapel, a carved wooden door
      which has withstood the ravages of time and looters.  The wood must once have
      been very beautiful with its carved cherubs and angels floating about on its
      surface, but now those angels are smeared in blood, their faces ghastly and
      horrific in the flickering light.  The steps up to the gazebo in the center of
      the courtyard lie just west.
    exits:
