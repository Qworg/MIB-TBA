    extra_descriptions: []
  tba.31435:
    area: tba_314
    name: A Flickering Path
    description: |2
         The path heads south toward the source of the light.  In the dim flickers,
      wet red stains can be seen splashed all over the ground, the old stones soaked
      and in some cases already dried by the splash of blood.  A terrible feeling
      accompanies this place, almost as if an anticipation of death were in the near
      future.  A crude stone foundation with no roof lies just to the west.
    exits:
      north:
        to: tba.31406
        hidden: false
        door: null
      south:
        to: tba.31437
        hidden: false
        door: null
      west:
        to: tba.31440
        hidden: false
        door: null
    spawns: []
