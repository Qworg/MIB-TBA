    area: tba_314
    name: Asylum Courtyard
    description: |2
         The courtyard here is enormous, dominated in the center by a large gazebo
      which holds within a flickering flame of some sort.  The stones underfoot are
      tacky, sticking to the soles of boots and shoes, making progress at the very
      least discouraged.
