rooms:
  tba.31400:
    area: tba_314
    name: Entrance to the Asylum Grounds
    description: |2
         The pitted black gate lies just to the north, the crumbling stone wall
      running off east and west from the gate.  It is a wonder the gate is still
      functional, so old and decrepit it seems.  South is what used to be the main
      entryway to a large compound of some sort, one that seems almost scholastic in
      appearance, but more somber - more militaristic.  In any case, it is certainly
      no longer in use, and has not been for some time.
    exits:
      south:
        to: tba.31401
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 31400
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - info
      - credits
      description: |2
           *X'Raantra's Altar of Sacrifice
           *Written by Kaan for Dibrova
        Level: 15 - 45
        100 rooms
        21 mobs
        30 objs
        Connector Zones: The Plains of Blood
        This is set in the grounds of an old insane asylum which X'Raantra
        took for his own use. X'Raantra hears a voice in his head -he is a
        nutball- this voice he hears, he takes to be the Lord Almighty. The
        voice tells him that only through human sacrifice will he ascend
        through the gates of Heaven. X'Raantra, though obviously crazy, is
        extremely enigmatic and has been able to gather a good number of people
        to join in his cult which is centered in the ruins of this old asylum.
        There are a few spec_procs I added to a couple of mobs - just for
        effect, really. The zone probably will not lack without these procs.
        Links: 00n
