  tba.25723:
    area: tba_257
    name: PETSHOP STOREROOM
    description: |2
         Make two rooms and some pets.  The rooms MUST be sequential.  If the first
      room is 315 then the second must be 316.  The second room is known as the
      storeroom.  All that is required in the storeroom is to load one of each mob you
      wish to be a pet.  This room can not have any exits and will never be used by
      mortals.  Although a pet shopkeeper is not required it is recommended.  After
      all of this is done ask your coder to implement the petshop.  It will not work
      until the code is changed and the MUD is rebooted.  The cost of pets is 300
      times their level.
    exits: {}
    spawns: []
    tags:
    - outdoor
    - private
    - godroom
    num: 25723
    coord: null
    sector: inside
    extra_descriptions: []
  tba.25724:
    area: tba_257
    name: The Bloated Goat
    description: |2
         Entering the Bloated Goat, you notice a lack of the normal hubbub and noise
      the usually accompanies a tavern such as this.  There are plenty of customers
      here, which seems odd to you, because only the occasional murmur or low voice is
      what drifts over to you, and the more of those customers that notice your
      entrance into the Goat, the quieter it gets.  Soon it is completely silent.
      Everyone is looking at you.  "What'll it be?  ", the bartender growls at you
      from under his thick beard.
    exits:
      down:
        to: tba.25774
        hidden: false
        door: null
      east:
        to: tba.25725
        hidden: false
