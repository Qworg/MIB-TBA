    name: The Catacombs
    description: |2
         You have cone to a dead end.  Large block lie strewn around the ground here
      and you feel that if the passage did continue it wouldn't go much further
      without being blocked by rubble anyway.  The passageway heads south and there
      is a stone door to the west.  Looks like there is an inscription on the door.
    exits:
