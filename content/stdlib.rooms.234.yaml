      mobs.  If you ask other players to join you, you can go around in your own
      group.  To follow someone, type Follow Playername or you can type Fol
      Playername.  If you enable Autoassist, you will automatically fight when your
      partner fights.  However this won't work if a spell is cast first.  To view the
