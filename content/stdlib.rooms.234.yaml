  tba.23409:
    area: tba_234
    name: Newbie School
    description: |2
         You can regain hitpoints, mana points, and movement points by Sleeping
      and resting.   Sleeping is exactly as it states, you fall asleep, you can
      still check your stats and listen to Gossips, group talks, view the Who list
      and simple commands.  Resting allows you to sit down, you can listen to talk,
      as well as all other channels that you belong to.  You can also do more
      commands that sleeping will not allow you to do, but some commands require you
      to be standing.  Resting does not heal hitpoints as fast as sleeping, but will
      restore movement points just as fast.  Being Drunk and sleeping increases the
      Rate of Mana point rejuvenation.
    exits:
