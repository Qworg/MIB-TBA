  tba.23407:
    area: tba_234
    name: Newbie School
    description: |2
         AUTO's.  AutoSac will allow you to sacarifice corpses of mobs that you
      defeat.  AutoLoot gives you the ability to take all the items from a corpse
      of a mob you defeat (this will work before the autosac).  Autogold takes
      only the gold from the defeated mobs.  Autoloot overrides autogold, so you will
      still take items.  Autosplit will split your gold from a defeated mob and
      disperse it to all the people within your group.  All these commands are
      toggles, so you can turn them on or off at will.  Type TOGGLE to see all
      the available toggles that you can turn on or off.
