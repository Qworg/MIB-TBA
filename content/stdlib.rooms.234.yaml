  tba.23424:
    area: tba_234
    name: Newbie School
    description: |2+
         In town you will stumble across the Postmaster.  The postmaster will allow
      you to send mail to players that are part of this mud.  It will send it to the
      player if that player is in the game or not.  When that players joins the mud,
      they will receive a personal announcement that they have mail.  To send a
      message, go to the postmaster and type Mail recipient.  If I wanted to send
      mail to Rumble, I would type Mail Rumble.  Just type your massage in, and
      then on a new line type /s to save and send the mail.  To receive mail, go to
      the postmaster and type Receive mail.  Sending mail will cost you 150 gold.

