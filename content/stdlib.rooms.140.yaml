  tba.14061:
    area: tba_140
    name: Spike road.
    description: |2
         This side of the city seems to be the residential district.  Citizens
      quietly walk by in all directions.  There looks to be a small cave off to the
      north west from here.
    exits:
      north:
        to: tba.14060
