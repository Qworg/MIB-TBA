        to: tba.5560
        hidden: false
        door: null
      south:
        to: tba.5557
        hidden: false
        door: null
      west:
        to: tba.5605
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 5550
    coord: null
    sector: inside
    extra_descriptions: []
  tba.5551:
    area: tba_55
    name: The Library
    description: |2
         This building holds the vast collection of books and documents
      that have been brought here by the commitee apointed to recover the
      lost knowledge of Thalos.  Rows of shelves filled with book in every
      condition line the walls.  The air has the aroma of old parchment
      and glue.
    exits:
      east:
        to: tba.5455
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 5551
    coord: null
    sector: inside
    extra_descriptions: []
  tba.5552:
    area: tba_55
    name: The Dance Hall
    description: |2
         You seem to have missed a huge party.  The janitors are here cleaning
      up the confetti and pieces of food.  Hundreds of empty beer mugs on the
      tables surrounding the dance floor suggest that the citizens love their
      drink.  There is still a banner on the wall.
    exits:
      east:
        to: tba.5456
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 5552
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - banner
      description: |2
           =====================================================================
                        H A P P Y   B I R T H D A Y   T O   U S
           =====================================================================
  tba.5553:
    area: tba_55
    name: The Jail
    description: |2
         You are in jail.  For some reason, someone feels that you've screwed
      up pretty bad and should be put away safely for a while.
    exits:
      north:
        to: tba.5444
        hidden: false
        door:
          locked: false
