    num: 5561
    coord: null
    sector: inside
    extra_descriptions: []
  tba.5562:
    area: tba_55
    name: The Northeast Tower
    description: |2
         You stand on one of the four towers guarding the city.  To the north
      you see the wide plains and then the forset.  South of here you see the
      city and the Great Eastern Desert beyond.
    exits:
      down:
        to: tba.5454
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 5562
    coord: null
    sector: inside
