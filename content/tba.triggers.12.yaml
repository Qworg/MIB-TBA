  tba_trig_1212:
    vnum: 1212
    name: Animal Chase Board Game - O1212
    attach_type: obj
    flags: c
    types:
    - command
    narg: 4
    arglist: go
    script: "if %cmd% == go\n  * By Mordecai\n  * Animal chase board game. Triggers: 1212-1214. O1212, M1212 in R1200.\n  if !(%arg%==up||%arg%==down||%arg%==left||%arg%==right||!%created%||!%arg%||%arg%==stay)\n    return 0\n    if %cmd%!=gos\n      %send% %actor% Type: go < up | down | left | right >\n    end\n    halt\n  end\n  if %arg%\n    eval dedu %nextlev%*105\n    if %exx%>%dedu%\n      nop %actor.exp(-%dedu%)%\n      set dd %dedu%\n    end\n  end\n  if !%nextlev%\n    set nextlev 1\n    global nextlev\n  elseif %nextlev_s%\n    eval nextlev %nextlev_s%\n    global nextlev\n  end\n  if !%created%\n    %force% %actor% createnewgame\n  end\n  if %created%\n    set p_dir %arg%\n    extract px 1 %playerco%\n    extract py 2 %playerco%\n    set [%py%][%px%] \\*\n    switch %p_dir%\n      case right\n        if %px%!=10\n          eval px %px%+1\n        else\n          eval px 1\n        end\n      break\n      case left\n        if %px%!=1\n          eval px %px%-1\n        else\n          eval px 10\n        end\n      break\n      case down\n        if %py%!=1\n          eval py %py%-1\n        else\n          eval py 10\n        end\n      break\n      case up\n        if %py%!=10\n          eval py %py%+1\n        else\n          eval py 1\n        end\n      break\n    done\n    if %chase%>0\n      eval chase %chase%-1\n      global chase\n    end\n    if ([%py%][%px%]==%spec_prize%)\n      set spec_prize\n      global spec_prize\n      eval exo (%nextlev%*2000)\n      nop %actor.exp(%exo%)%\n      eval points %points%+(%nextlev%*2)\n      global points\n      set alert You can now FLY and kill the animal!\n      eval chase 5+(%nextlev%/70)+(%chase%)\n      global chase\n    end\n    eval holech %%[%py%][%px%]%%\n    if %holech%/=@\n      if !(%chase%>0)\n        set alert You fall into a bottomless pit!\n        unset points\n        set nextlev 0\n        global nextlev\n        unset created\n        unset exx\n        set ax 1\n        set ay 1\n        set px 10\n        set py 10\n        %force% %actor% createnewgame\n      else\n        set alert You FLY over the pit!\n      end\n    end\n    eval prz_ch %%[%py%][%px%]%%\n    if (%prz_ch.contains(p)%)\n      eval points (%points%+%nextlev%)\n      global points\n      eval exo (%nextlev%*950)\n      nop %actor.exp(%exo%)%\n      set [%py%][%px%] .\n      global [%py%][%px%]\n      eval prize_count (%prize_count%)+1\n      set winner [%prize_count%]\n      if %prize_count%>=%numofprizes%\n        eval nextlev (%nextlev%)+1\n        global nextlev\n        set winner You Win!!! Moving to level %nextlev%.\n        set px 10\n        set py 10\n        set ax 1\n        set ay 1\n        set created\n        global created\n        set prize_count 0\n        set numofprizes 0\n        %force% %actor% createnewgame\n      end\n      global prize_count\n      set alert You collect a prize. %winner%\n    end\n    set playerco %px% %py%\n    global playerco\n    if (%random.15%==1)||(%spec_on%)\n      if !%spec_on%\n        eval spec_on %random.4%+(%nextlev%/90)\n        global spec_on\n      end\n      eval spec_on (%spec_on%)-1\n      global spec_on\n      if !%spec_prize%\n        eval spec_prize [%random.10%][%random.10%]\n        global spec_prize\n      else\n        set %spec_prize% Y\n        eval spec_prize\n        global spec_prize\n      end\n    end\n    if %sizem%\n      set [%py%][%px%] O\n      unset sizem\n    else\n      set [%py%][%px%] o\n      set sizem 1\n      global sizem\n    end\n    extract ax 1 %animal%\n    extract ay 2 %animal%\n    set [%ay%][%ax%] \\*\n    if !%dir_chosen%\n      set dir_chosen 1\n      if %px%>%ax%\n        eval dis_x (%px%-%ax%)\n        eval move_x 1\n      elseif %px%<%ax%\n        eval dis_x (%ax%-%px%)\n        eval move_x 2\n      end\n      if %py%>%ay%\n        eval dis_y (%py%-%ay%)\n        eval move_y 4\n      elseif %py%<%ay%\n        eval dis_y (%ay%-%py%)\n        eval move_y 3\n      end\n      if %dis_x%>%dis_y%\n        set ani_dir %move_x%\n      else %dis_x%<%dis_y%\n        set ani_dir %move_y%\n      end\n      eval dificulty 100-(%nextlev%*4)\n      if (%random.100%)<=(%dificulty%)\n        eval ani_dir %random.4%\n      end\n      if %chase%\n        if %ani_dir%==1\n          eval ani_dir 2\n        elseif %ani_dir%==2\n          eval ani_dir 1\n        elseif %ani_dir%==3\n          eval ani_dir 4\n        elseif %ani_dir%==4\n          eval ani_dir 3\n        end\n      end\n      if !%arg%\n        set ani_dir 5\n      end\n      switch %ani_dir%\n        case 1\n          if %ax%!=10\n            eval ax %ax%+1\n          else\n            eval ax 1\n          end\n        break\n        case 2\n          if %ax%!=1\n            eval ax %ax%-1\n          else\n            eval ax 10\n          end\n        break\n        case 3\n          if %ay%!=1\n            eval ay %ay%-1\n          else\n            eval ay 10\n          end\n        break\n        case 4\n          if %ay%!=10\n            eval ay %ay%+1\n          else\n            eval ay 1\n          end\n        break\n      done\n      set animal %ax% %ay%\n      global animal\n    end\n    eval [%ay%][%ax%] a\n    eval ch_3 %%[%py%][%px%]%%\n    set ch_3 %ch_3%\n    if %ch_3.contains(a)%\n      if %chase%\n        eval pointinc %nextlev%*%random.10%\n        eval points (%points%+%pointinc%)\n        global points\n        eval exo %nextlev%*7000\n        nop %actor.exp(%exo%)%\n        eval nextlev %nextlev%+1\n        global nextlev\n        set alert You kill the animal. You gain %pointinc% points and a new level. (%nextlev%)\n        unset created\n        set ax 1\n        set ay 1\n        set px 10\n        set py 10\n        %force% %actor% createnewgame\n      else\n        set alert You have been eaten by the animal.\n        set points 0\n        global points\n        set nextlev 0\n        global nextlev\n        unset created\n        unset chase\n        set exx 0\n        global exx\n        %force% %actor% createnewgame\n      end\n    end\n    eval h 11\n    while (%h%>1)\n      eval h (%h%)-1\n      eval printrow%h% %%[%h%][1]%% %%[%h%][2]%% %%[%h%][3]%% %%[%h%][4]%% %%[%h%][5]%% %%[%h%][6]%% %%[%h%][7]%% %%[%h%][8]%% %%[%h%][9]%% %%[%h%][10]%%\n      *eval printrow%h% %%row%h%%%\n    done\n    if %numofprizes%<10\n      set numop 0%numofprizes%\n    else\n      set numop %numofprizes%\n    end\n    if %prize_count%<10\n      set przc 0%prize_count%\n    else\n      set przc %prize_count%\n    end\n    if %nextlev%<10\n      set levlev 000%nextlev%\n    elseif %nextlev%<100\n      set levlev 00%nextlev%\n    elseif %nextlev%<1000\n      set levlev 0%nextlev%\n    else\n      set levlev %nextlev%\n    end\n    eval exx (%exo%+%exx%)-(%dd%)\n    if %exx%<=0\n      set exx 0\n    end\n    global exx\n    eval cht %chase%-1\n    if %cht%>0\n      set chy You can FLY and chase the animal %cht% more times.\n    end\n    set snd %send% %actor% \n    %force% %actor% cls\n    %snd%                    )       \\\\   /      (\n    %snd%                   /\\|\\\\      )\\\\_/(     /\\|\\\\\n    %snd% \\*                / \\| \\\\    (/\\\\\\|/\\\\)   / \\| \\\\         \\*\n    %snd% \\|\\`._____________/__\\|__o____\\\\\\`\\|'/___o__\\|__\\\\______.'\\|\n    %snd% \\|                    '\\^\\` \\|  \\\\\\|/   '\\^\\`             \\|\n    %snd% \\|                        \\|   V   level: %levlev%      \\| Dir:  %arg%\n    %snd% \\|   %printrow10%  \\| @ = Bottomless Pit     \\| Points: %points%\n    %snd% \\|   %printrow9%  \\| Y = Power Up           \\| Exp: %exx%\n    %snd% \\|   %printrow8%  \\| p = Prize              \\| AMU: %dedu%\n    %snd% \\|   %printrow7%  \\| o = You                \\|\n    %snd% \\|   %printrow6%  \\| a = Animal             \\|\n    %snd% \\|   %printrow5%  \\| To Move Type:          \\|\n    %snd% \\|   %printrow4%  \\| go <up\\|down\\|left\\|right>\\|\n    %snd% \\|   %printrow3%  \\|                        \\|\n    %snd% \\|   %printrow2%  \\| Cost of AMU exp per MV \\|\n    %snd% \\|   %printrow1%  \\|    If you have exp.    \\|\n    %snd% \\|                        \\|                        \\|\n    %snd% \\|                        \\|  NEEDED: %numop% HAVE: %przc%   \\|\n    %snd% \\| .______________________\\|______________________. \\|\n    %snd% \\|'         l    /\\\\ /     \\\\\\\\            \\\\ /\\\\    l \\`\\|\n    %snd% \\*          l  /   V       ))             V  \\\\  l  \\*\n    %snd%            l/            //                   \\\\I\n    %snd%                          V\n    %snd%  %alert%\n    %snd%  %chy%\n    %snd%  Animal: ax:%ax% ay:%ay% You: px:%px% py:%py%\n  end\nelse\n  return 0\nend\n"
  tba_trig_1213:
    vnum: 1213
    name: Animal Chase Board - Newgame - O1212
    attach_type: obj
    flags: c
    types:
    - command
    narg: 100
    arglist: newgame
    script: |
      * By Mordecai
      * Animal chase board game. Triggers: 1212-1214. O1212, M1212 in R1200.
      if %arg.cdr% == %actor.id%
        eval nextlev %arg.car%
        global nextlev
      end
      if %nextlev%>1&&%points%>0
        set dd scoreboardmob
        if %dd.vnum%>0
          set nums 1
          while %nums%
            eval j %j%+1
            eval nums %dd.varexists(%j%)%
            if %nums%
              eval nums2 %%dd.%j%%%
              if (%nums2%/=%actor.name%)
                extract partlev 2 %nums2%
                set added 1
                if %partlev%<%nextlev%
                  set %j% %actor.name% %nextlev% %points% %exx%
                  remote %j% %dd.id%
                end
              end
            else
              if !%added%
                set %j% %actor.name% %nextlev% %points% %exx%
                remote %j% %dd.id%
              end
            end
          done
        end
      end
      unset chase
      set tail 1
      global tail
      eval animal 1 1
      global animal
      eval playerco 10 10
      global playerco
      set [1][1] a
      set [10][10] o
      global [1][1]
      global [10][10]
      eval numofprizes 0
      global numofprizes
      set prize_count 0
      global prize_count
      set created 1
      global created
      eval ww 11
      while (%ww%>1)
        eval ww %ww%-1
        eval n %ww%
        eval row %random.10%
        eval r_col (%random.3%-1)
        set [%n%][1] .
        global [%n%][1]
        set [%n%][2] .
        global [%n%][2]
        set [%n%][3] .
        global [%n%][3]
        set [%n%][4] .
        global [%n%][4]
        set [%n%][5] .
        global [%n%][5]
        set [%n%][6] .
        global [%n%][6]
        set [%n%][7] .
        global [%n%][7]
        set [%n%][8] .
        global [%n%][8]
        set [%n%][9] .
        global [%n%][9]
        set [%n%][10] .
        global [%n%][10]
        if (%r_col%)
          while (%r_col%<3)
            eval r_col %r_col%+1
            eval jj %random.10%
            if !(%posis%/=[%n%][%jj%])
              eval numofprizes %numofprizes%+1
              global numofprizes
              eval [%n%][%jj%] p
              global [%n%][%jj%]
              set posis %posis% [%n%][%jj%]
            end
          done
        end
      done
      eval r_ttt %nextlev%-35
      if (%r_ttt%>0)
        eval hrt (%random.6%-1)+(%nextlev%/20)
        while %hrt%>0
          eval hrt %hrt%-1
          eval j8 %random.10%
          eval j9 %random.10%
          eval cer %%[%j9%][%j8%]%%
          if !(%cer%/=p)
            eval [%j9%][%j8%] \@
            global [%j9%][%j8%]
          end
        done
      end
      if !(%[10][10]%/=p)
        set [10][10] .
        global [10][10]
      end
  tba_trig_1214:
    vnum: 1214
    name: Scoreboard Mob
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 100
    arglist: score scores
    script: |
      * By Mordecai
      * Animal chase board game. Triggers: 1212-1214. O1212, M1212 in R1200.
      set j 1
      while %self.varexists(%j%)%
        eval r %%self.%j%%%
        eval nam %r.car%
        eval k %nam.strlen%
        while %k%<15
          eval k %k%+1
          eval sgg %%s%j%%%
          set s%j% %sgg%-
        done
        eval j %j%+1
      done
      %echo% O===============SCORE======BOARD=====================O
      wait 1
      %echo% O=#==NAME============\|=Level=\|=Points==\|=EXP=========O
      set i 1
      set j 1
      while %self.varexists(%j%)%
        eval r %%self.%j%%%
        eval nam %r.car%
        extract ll 2 %r%
        extract points 3 %r%
        extract exp 4 %r%
        eval sp %%s%j%%%
        if %ll%<10
          set ll 0000%ll%
        elseif %ll%<100
          set ll 000%ll%
        elseif %ll%<1000
          set ll 00%ll%
        elseif %ll%<10000
          set ll 0%ll%
        end
        if %points%<10
          set points 000000%points%
        elseif %points%<100
          set points 00000%points%
        elseif %points%<1000
          set points 0000%points%
        elseif %points%<10000
          set points 000%points%
        elseif %points%<100000
          set points 00%points%
        elseif %points%<1000000
          set points 0%points%
        end
        eval d %j%
        if %d%<9
          set d 0%j%
        end
        %echo% \|%d%: %nam% %sp%\| %ll% \| %points% \| %exp%
        eval j %j%+1
      done
      %echo% O=#==================================================O
