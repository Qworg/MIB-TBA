  tba_trig_1201:
    vnum: 1201
    name: Calculator By Mordecai
    attach_type: wld
    flags: d
    types:
    - speech
    narg: 100
    arglist: '*'
    script: |
      * By Mordecai
      if %actor.is_pc%
        return 0
        eval sum %speech%
        eval test1 "%speech%"
        eval test %test1.strlen%
        eval che %sum%/1
        if %che% == %sum%
          %echo% Computing results...
          if (%speech%/===)
            if (%sum%==1)
              set sum Yes
            elseif (%sum%==0)
              set sum No
            end
          end
          eval st 2+%test%
          eval o .
          eval sumslen "%sum%
          eval len %st% - (%sumslen.strlen%-2)
          if %len% > 0
            eval dif (%len%/2)
            while %y.strlen% < %st%
              eval o .%o%
              eval y %o%
              eval m ?%m%
              eval p %m%
              if %dif% == %y.strlen%
                eval wid1 %p%
              end
            done
          end
          eval opt1 8 + %test%
          eval opt2 (2*%wid1.strlen%)+%sumslen.strlen%+5
          %echo% Wizzzzzzzzzz....
          if (%opt1%-2) == (%opt2%)
            %echo% ...%y%...
            %echo% :..%y%..:
            %echo% ::   %speech%   ::
            %echo% ::.%y%.::
            %echo% :: %wid1% %sum% %wid1% ::
            %echo% ::.%y%.::
            %echo% :..%y%..:
          else
            %echo% ....%y%...
            %echo% :...%y%..:
            %echo% ::    %speech%   ::
            %echo% ::..%y%.::
            %echo% :: %wid1% %sum% %wid1% ::
            %echo% ::..%y%.::
            %echo% :...%y%..:
          end
        end
      end
  tba_trig_1202:
    vnum: 1202
    name: Object Wear or Wield Example
    attach_type: obj
    flags: j
    types:
    - wear
    narg: 100
    arglist: ''
    script: |
      * test trigger
      %echo% actor : %actor%
      wait 10
      if %actor.level% < 34
         %send% %actor% The sword whispers: I will not serve you!
         wait 2
         %echoaround% %actor% The sword exclaims: 'I will not serve those without honor.'
         %damage% %actor% 100
         %purge% self
      else
         %send% %actor% The sword whispers: I was made to serve, great one!
         wait 2
         %echoaround% %actor% The sword exclaims: 'I will serve you honorable one..'
      end
  tba_trig_1203:
    vnum: 1203
    name: Mynah Bird
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 100
    arglist: '*'
    script: |
      if %actor.is_pc%
        if %c%<20
          eval c 20
          global c
        end
        if !%speech.contains(!)%
          eval c (%c%)+1
          global c
          set %c% %speech%
          global %c%
          set 1 Hello
          set 2 Yes
          set 3 Killed him
          set 4 Food?
          set 5 Dig dig dig.
          set 6 Freddy says hi.
          set 7 Inconceivable.
          set 8 Stop mimicking me.
          set 9 I love you.
          set 10 Do you like me?
          set 11 Freak.
          set 12 You are not funny.
          set 13 Don't you ever shut up?.
          set 14 Eat my shorts.
          set 15 I'm pretty. Pretty bird.
          set 16 Let's tango.
          set 17 Doh.
          set 18 Who rang that bell??
          set 19 Beam me up.
          set 20 Shut up and get me a drink.
          eval count %%random.%c%%%
          eval ans %%%count%%%
          wait %random.5%
          say %ans%
        end
      end
