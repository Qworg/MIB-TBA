  tba.1745:
    area: tba_17
    name: West Lane
    description: |2
         You hear loud laughter and roughhousing to the east, actually coming through
      the stone walls of a building in that direction.  Somebody still seems to be
      able to celebrate.
    exits:
      north:
        to: tba.1720
        hidden: false
        door: null
      south:
        to: tba.1770
        hidden: false
