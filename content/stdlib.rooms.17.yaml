    area: tba_17
    name: Tourney Yard
    description: |2
         You watch the orange knight fly and land with a sickening crash on the
      yard.  The black knight circles and raises his lance in a salute to
      Arthur.  A few people cheer, but most seem to be preoccupied.
    exits:
      east:
        to: tba.1764
        hidden: false
        door: null
      north:
