  tba.1775:
    area: tba_17
    name: A Muddy Trail
    description: |2
         As the forest closes, the trail on both sides the ground becomes more solid.
      The overhanging branches block out most of the light and you feel a strange
      silence overcoming the woods.  You quicken your pace.  The western wall of
      Bellau City is to the east and the path turns to the west.  A large uprooted
      tree blocks the forest to the south.
    exits:
      north:
        to: tba.1750
        hidden: false
        door: null
      west:
        to: tba.1776
