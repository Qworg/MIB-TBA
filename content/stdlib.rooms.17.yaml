  tba.1766:
    area: tba_17
    name: Tourney Yard
    description: |2
         The lady-in-waiting is weeping, as her knight was the orange knight.  She
      quickly recovers and tosses her favor to the black knight.  The spectators that
      were cheering for the orange knight quietly disperse.
    exits:
      east:
        to: tba.1765
        hidden: false
        door: null
      north:
