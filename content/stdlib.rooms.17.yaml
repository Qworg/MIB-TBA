  tba.1757:
    area: tba_17
    name: South Lane
    description: |2
         A stranger stops you and whispers, 'Leave while you can!  The king is
      ordering people into his army to fight the northern army.  No one has come back
      from the battles.'  He emphasizes his words with a long stare that sets your
      nerves on end, then turns and walks away.
    exits:
      east:
        to: tba.1756
        hidden: false
        door: null
      west:
        to: tba.1758
