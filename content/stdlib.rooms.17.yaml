  tba.1759:
    area: tba_17
    name: South Lane
    description: |2
         The road turns along the wall to the north and east.  A guard is arguing with
      a merchant about some new tax he's supposed to be collecting.  The merchant
      seemed to think he wouldn't have to pay right up until the guard drew his sword.
      A set of stairs is carved into the wall to the west, leading up into the tower.
    exits:
      east:
