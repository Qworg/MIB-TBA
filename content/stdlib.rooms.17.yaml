    area: tba_17
    name: East Lane
    description: |2
         The shadows are even deeper in the southeastern corner of the castle.  The
      south and east walls meet each other and leave you with the choice of exiting
      north or west.  A beggar looks up at you, raising a small tin cup, a glimmer of
      hope in his eyes.  A set of stairs are carved into the wall to the west, leading
      up into the tower.
    exits:
      north:
        to: tba.1726
        hidden: false
