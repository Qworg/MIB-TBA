  tba.1755:
    area: tba_17
    name: South Lane
    description: |2
         The southern wall continues east and west.  To the north, a passage through
      the center of the castle carries the smell of food and wine to you.  The lane
      you are on is empty except for a scattering of guards in the distance.  Where
      are all the common folk?
    exits:
      east:
        to: tba.1754
        hidden: false
        door: null
