    name: Horse Stall
    description: |2
         This horse isn't quite as large as the other ones but looks to have been
      raised for speed and agility.  This is the kind of horse you wish you had so you
      wouldn't have to walk everywhere.  A bale of hay, a grain bin and a salt lick
