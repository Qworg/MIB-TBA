  tba.1777:
    area: tba_17
    name: A Dark Trail
    description: |2
         The remains of an old wagon and the corpses of a couple of merchants lie on
      the side of the path.  Those rumors about robbers and thieves hiding in these
      woods must be true.  You check the contents of your purse then move on.  The
      lake still blocks the north and the forest doesn't look very safe to the south.
    exits:
