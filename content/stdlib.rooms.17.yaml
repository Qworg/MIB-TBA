         You stand in the fabled court of Camelot.  Here in the sunny courtyard,
      noblemen and knights walk barefoot in the grass discussing chivalry and wars to
      come.  Everyone seems to be avoiding the subject of the present war, which you
      would think would be the major topic of all the conversations.
