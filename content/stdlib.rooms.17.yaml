    area: tba_17
    name: South Lane
    description: |2
         The southern wall and a building to the north guide you along this road to
      the east or west.  Shadows cover a large portion of the road and you try
      unsuccessfully to peer into them.  Beggars seemed to have taken over this part
      of the castle.  This must be the poor sector.
    exits:
      east:
        to: tba.1751
        hidden: false
