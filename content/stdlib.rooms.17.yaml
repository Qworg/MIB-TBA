  tba.1750:
    area: tba_17
    name: A Muddy Trail
    description: |2
         You are covered in mud from the knees down as it's almost impossible to keep
      your balance on the slimy road.  The trail narrows and the forest has already
      began to reclaim the path as its own.  The western wall of Bellau City is still
      to the east and you hear the gentle lapping of waves on the shoreline to the
      west.
    exits:
      north:
        to: tba.1725
        hidden: false
        door: null
      south:
        to: tba.1775
        hidden: false
