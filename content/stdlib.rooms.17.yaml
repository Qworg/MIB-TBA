  tba.1774:
    area: tba_17
    name: Open Field
    description: |2
         The island, now to the east, is completely covered by the massive stone
      castle.  You try to ask the peasants and farmers how to reach it but they ignore
      you.  A farmer is here driving a pair of oxen pulling a plow, furrowing one of
      the fields so it can be planted.
