  tba.1791:
    area: tba_17
    name: Court of Camelot
    description: |2
         Troubadours play ballads on their lutes while entertainers hop and leap into
      the air, all for a chance of earning the kings favor.  Ladies-in-waiting play
      their love games with young knights and squires.
