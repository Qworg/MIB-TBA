  tba.1776:
    area: tba_17
    name: A Dark Trail
    description: |2
         The silence is broken only by the racing of your heart as shadows run deep
      and you find yourself jumping at every movement or sound.  The lake to the north
      is cloaked in a thick fog.  You see a large shadow on an island in the fog.  It
      looks to be a building of some sort but you can't see it clearly.  The path
      leads east and west.
    exits:
      east:
        to: tba.1775
        hidden: false
