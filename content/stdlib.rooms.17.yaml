    area: tba_17
    name: Tourney Yard
    description: |2
         Both knights collide in the center of the yard with a resounding crash.  The
      orange plummed knight contorts in his saddle at the last second, delivering a
      thrust high on the shield of the black caped knight.  The black caped knight
      connects with a hard shot to the center of the shield of the orange knight.
    exits:
