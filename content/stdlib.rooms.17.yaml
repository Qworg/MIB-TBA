         Stable hands are busy currying animals, shoeing horses, and feeding the
      magnificent chargers of Camelot.  Light filters in through the rafters.  You
      wonder how easy it would be to sneak one of these animals out.  You quickly
      discard the idea when you see one of the stable hands skillfully playing with a
      small dagger, tossing it 10 feet in the air, catching it by the blade and then
      burying it in the middle of a bale of hay 20 feet away.
