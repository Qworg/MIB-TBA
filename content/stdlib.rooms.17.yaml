    area: tba_17
    name: Tourney Yard
    description: |2
         The lady-in-waiting yells in ecstasy, as her knight dismounts the orange
      knight.  She quickly runs over to congratulate the black knight, hanging on to
      him like a leech.  The spectators cheer weakly, hurrying over to shake the
      knights hand.
    exits:
      north:
        to: tba.1739
        hidden: false
        door: null
      south:
