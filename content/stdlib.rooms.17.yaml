    area: tba_17
    name: Ladies' Chambers
    description: |2
         You are in the ladies' chambers.  I hope you are a lady, for you are in big
      trouble if you are not!  There certainly is a lot of activity.  A young girl
      stands in sorrow here weeping, and you notice a group of ladies off in the
      corner.
    exits:
      north:
        to: tba.1738
        hidden: false
