  tba.1758:
    area: tba_17
    name: South Lane
    description: |2
         The lane continues east or west.  A guard watches as you walk by, looking at
      you as if measuring your abilities against his.  He writes something down on a
      piece of paper and hands it to a page that is walking by.  The guard looks back
      up at you and grins.
    exits:
      east:
        to: tba.1757
        hidden: false
        door: null
