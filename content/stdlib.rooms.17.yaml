    ambient_weather: {}
  tba.1748:
    area: tba_17
    name: Princess' Bed
    description: |2
         A large bed takes up the entire northern half of the room.  Various toys are
      neatly laid across the bed.  The toys and the bed haven't been used in a long
      time so where is the child that should live in here?
    exits:
      south:
        to: tba.1773
        hidden: false
        door: null
    spawns: []
