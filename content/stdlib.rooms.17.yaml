    name: Abbey
    description: |2
         More monks are here copying various books that are worn from time and will be
      lost soon.  The monks ignore you when you try to ask them questions.  Most just
      wave you away with their ink smudged hands.  One of these books must be able to
      tell you something, but which one?
    exits:
