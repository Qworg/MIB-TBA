    description: |2
         A large room with a dome ceiling spreads further to the north.  The granite
      floor is polished smooth and everything has a bright shine to it.  You stare in
      awe from the suits of armor to the assorted weapons and flags hanging on the
      walls.  Further north you see a large table.
