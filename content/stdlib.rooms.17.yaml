    area: tba_17
    name: Practice Yard
    description: |2
         Racks of weapons and armor line the walls.  A squire is here practicing with
      a ball and chain, swinging it around with very little control.  The lead ball is
      too much for him and keeps pulling him off balance.  You decide to quickly move
      on before the inexperienced squire hurts himself or you.
    exits:
      north:
        to: tba.1718
