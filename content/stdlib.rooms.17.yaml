  tba.1792:
    area: tba_17
    name: Archbishop's Room
    description: |2
         Around you is the comfortable interior of someone's bedchamber, complete with
      feather bed and fireplace.  A table has been set with fresh meat and bread and
      an ornate chalice filled with water.  A candle burns brightly and there is a
      single chair at the table.
