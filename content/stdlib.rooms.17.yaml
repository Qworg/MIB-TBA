    name: King's Chamber
    description: |2
         This is by far the most luxurious room you have ever seen in your life.  A
      window to the east is covered by thick velvet curtains.  A lamp, ink bottle and
      several messages are set on top of a large mahogany desk.  Some of the messages
      have writing on them, and others are already sealed with wax and ready for
      delivery.
