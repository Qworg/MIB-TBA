    area: tba_17
    name: A Dark Trail
    description: |2
         Two more bodies lay on the forest floor to the south, feeding the local
      scavengers and fertilizing the plants.  A beautiful red rose is growing out of
      one corpses eye socket.  You hear a crashing sound to the south as a large
      person or animal makes a run for cover.  You should follow the trail east or
      west.
