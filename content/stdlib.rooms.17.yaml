  tba.1749:
    area: tba_17
    name: Open Field
    description: |2
         The smell of freshly plowed, highly fertile soil fills your nostrils.  The
      ground here has been plowed and several serfs are dutifully picking rocks out of
      the field and throwing them into the lake.  You duck as they don't seem to care
      whether they hit the lake or you.
    exits:
      north:
        to: tba.1724
        hidden: false
        door: null
