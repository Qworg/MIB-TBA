  tba.1753:
    area: tba_17
    name: South Lane
    description: |2
         Very few people are out and about the streets which seems strange for a
      castle this size.  An unlawful merchant suddenly walks up to you showing you a
      note that looks to be signed by the king himself.  He starts to tell you what
      it's about, but then a guard rounds a corner to the west and the merchant
      immediately walks away from you.
    exits:
      east:
        to: tba.1752
        hidden: false
        door: null
