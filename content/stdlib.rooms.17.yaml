    area: tba_17
    name: Scottish Clansmen
    description: |2
         Various animals are slowly roasting over open fires and the smell is almost
      appetizing.  More of the Scots are here arm wrestling or having dagger throwing
      contests.  You hear someone scream from across the room and guess that he won
      that bout.
    exits:
      north:
