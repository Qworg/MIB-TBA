  tba.1756:
    area: tba_17
    name: South Lane
    description: |2
         The packed dirt trail leading to the east and west is deserted by the normal
      traffic that would flow through a castle this size.  The few people that hurry
      past you don't even attempt to be polite to anyone else.  Though the road is
      wide and empty, they still shoulder you out of their way.
    exits:
      east:
