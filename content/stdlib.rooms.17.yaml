  tba.1746:
    area: tba_17
    name: King's Chamber
    description: |2
         You have entered the private chambers of King Arthur.  A dragon banner serves
      as a canopy and curtains for his large four poster bed.  He has a marble basin
      and a cherry desk and chair.  A huge rug lies on the floor.  Tapestries,
      depicting him pulling Excalibur from the stone and his campaigns of unification,
      adorn the walls.
    exits:
      south:
        to: tba.1771
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 1746
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.1747:
    area: tba_17
    name: Meeting Room
    description: |2
         Six chairs circle the table.  Each chair is very well crafted but made of
      wood and doesn't look to be very comfortable.  A map covers the northern wall,
      showing the area surrounding the castle.  You notice that the northwestern
      corner of the map has been redone.
    exits:
      south:
        to: tba.1772
        hidden: false
        door: null
