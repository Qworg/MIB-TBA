    description: |2
         A long set of stairs lead down to the lower levels of the castle.  A
      luxurious hall opens to the east.  North is a large set of double doors.  You
      gape at all the expensive finery adorning the walls and floors.  A beautiful
      painting of a half-naked woman rising out of a lake holding a sword covers the
