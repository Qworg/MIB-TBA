    extra_descriptions:
    - keywords:
      - engraving
      description: "   \nPilgrim,\n     You have reached the final step on your way to enlightenment.\nIn this last step you will be shown ultimate evil to your north,\nand ultimate good to your south.  This is the land of the undead.\n\n   The dead of both those whose goodness links them to the land,\nand those whose evilness was rejected are here.  To have true\nspirituality one must know both.  Once you have been strengthened\nand forge through the evil, there is one final test before you\nprove yourself equal to the Avatar himself.  You must endure\nthe test of time.\n"
    - keywords:
