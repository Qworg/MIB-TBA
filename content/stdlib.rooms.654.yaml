  tba.65420:
    area: tba_654
    name: Atrium - 1 First Street
    description: |2
         This is the atrium for a compact house on First Street.  It's a small
      room, protected from the elements, where people wait for the owner to let
      them in.  It would not be a good idea to leave your things here because
      they probably wouldn't be here very long.

         What?  You're still here?  Maybe the owner doesn't want to see you.
    exits:
      north:
