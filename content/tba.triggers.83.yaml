  tba_trig_8393:
    vnum: 8393
    name: '99 Bottles of Beer (Drunken Pirate: 8309)'
    attach_type: mob
    flags: b
    types:
    - random
    narg: 10
    arglist: ''
    script: |
      set beers 99
      emote clears his throat.
      wait 3s
      while %beers%
        eval beertens %beers% / 10
        eval beerones %beers% - (%beertens% * 10)
        switch %beerones%
          case 0
            unset alphabeers
            break
          case 1
            set alphabeers One
            break
          case 2
            set alphabeers Two
            break
          case 3
            set alphabeers Three
            break
          case 4
            set alphabeers Four
            break
          case 5
            set alphabeers Five
            break
          case 6
            set alphabeers Six
            break
          case 7
            set alphabeers Seven
            break
          case 8
            set alphabeers Eight
            break
          case 9
            set alphabeers Nine
            break
        done
        switch %beertens%
          case 0
            break
          case 1
            switch %beerones%
              case 0
                set alphabeers Ten
                break
              case 1
                set alphabeers Eleven
                break
              case 2
                set alphabeers Twelve
                break
              case 3
                set alphabeers Thirteen
                break
              case 4
                set alphabeers Fourteen
                break
              case 5
                set alphabeers Fifteen
                break
              case 6
                set alphabeers Sixteen
                break
              case 7
                set alphabeers Seventeen
                break
              case 8
                set alphabeers Eighteen
                break
              case 9
                set alphabeers Nineteen
                break
            done
            break
          case 2
            set alphabeers Twenty %alphabeers%
            break
          case 3
            set alphabeers Thirty %alphabeers%
            break
          case 4
            set alphabeers Fourty %alphabeers%
            break
          case 5
            set alphabeers Fifty %alphabeers%
            break
          case 6
            set alphabeers Sixty %alphabeers%
            break
          case 7
            set alphabeers Seventy %alphabeers%
            break
          case 8
            set alphabeers Eighty %alphabeers%
            break
          case 9
            set alphabeers Ninety %alphabeers%
            break
        done
        if %beers% == 99
          eval alphabeers2 %alphabeers%
        else
          emote sings, '%alphabeers2.trim% bottles of beer on the wall...'
          wait 3s
          emote sings, '%alphabeers2.trim% bottles of beer...'
          wait 5s
          emote sings, 'Take one down, pass it around...'
          wait 3s
          emote sings, '%alphabeers.trim% bottles of beer on the wall.'
          eval alphabeers2 %alphabeers%
          wait 5s
        end
          eval beers %beers% - 1
      done
      wait 10s
  tba_trig_8397:
    vnum: 8397
    name: Chinchirorin Dice (8397)
    attach_type: obj
    flags: h
    types:
    - drop
    narg: 100
    arglist: ''
    script: |
      *** Roll them Bones ***
         wait 1s
         eval die1 %random.6%
         eval die2 %random.6%
         eval die3 %random.6%
         eval roll %die1%%die2%%die3%
         %send% %actor% The dice land on  %die1%, %die2%, %die3%.
         oechoaround %actor% %actor.name% rolls a %die1%, %die2%, %die3%.
      *** Check For 3 of a Kind ***
          if (%roll% == 111)
           oechoaround %actor% It's a 1-1-1!  %actor.name% pays triple the bet!
           %send% %actor% It's a 1-1-1!  You pay triple the bet!
           halt
          elseif ((%die1% == %die2%) && (%die2% == %die3%))
           oechoaround %actor% %die1%%die2%%die3% Three of a kind! %actor.name% wins triple the bet!
           %send% %actor% %die1%%die2%%die3% Three of a kind! You win triple the bet!
           halt
      *** Check for Storms ***
          elseif (%roll% == 123 || %roll% == 132 || %roll% == 213 || %roll% == 321 || %roll% == 312)
           oechoaround %actor% It's a storm!  1-2-3!  %actor.name% pays double the bet!
           %send% %actor% It's a storm!  1-2-3!  You pay double the bet!
           halt
          elseif (%roll% == 456 || %roll% == 465 || %roll% == 546 || %roll% == 654 || %roll% == 645)
           oechoaround %actor% It's a storm!  4-5-6!  %actor.name% wins double the bet!
           %send% %actor% It's a storm!  4-5-6!  You win double the bet!
           halt
      *** Otherwise, Compute the Score ***
          elseif (%die1%==%die2%)
           oechoaround %actor% %actor.name% scores a %die3%.
           %send% %actor% You score a %die3%.
           halt
          elseif (%die1%==%die3%)
           oechoaround %actor% %actor.name% scores a %die2%.
           %send% %actor% You score a %die2%.
           halt
          elseif (%die2%==%die3%)
           oechoaround %actor% %actor.name% scores a %die1%.
           %send% %actor% You score a %die1%.
           halt
          else
           oecho No score!
         end
