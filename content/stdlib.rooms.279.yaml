  tba.27947:
    area: tba_279
    name: Carriage Station
    description: |2
         This paved square seems to be where travelling passengers wait for
      transport, white metal benches placed here and there for the waiting French
      people. The clattering of the carriages can be heard echoing down the stone-
      paved streets, a small sign displaying local travel fares. A small dark tunnel
      lies ominously to the east.
    exits:
      east:
        to: tba.27948
        hidden: false
        door: null
