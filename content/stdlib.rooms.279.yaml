    ambient_phases: {}
    ambient_weather: {}
  tba.27938:
    area: tba_279
    name: The Entrance to Lyon
    description: |2
         The path opens here into the little town of Lyon, famed to be one of the
      most beautiful of all France, albeit one of the smallest. The sounds of
      trickling water and talking people fill the atmosphere, along with delicate
      birdsong. A large board welcomes visitors to this place, proclaiming the town
      as the best maker of wines in all France.
    exits:
      north:
        to: tba.27937
        hidden: false
        door: null
