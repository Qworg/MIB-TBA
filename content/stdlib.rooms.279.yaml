  tba.27934:
    area: tba_279
    name: The Eastern Room of the Second Floor
    description: |2
         This large room has only a concrete floor and ceiling, doric columns
      standing between where ordinarily there would be walls. A vast city spreads
      below, though it does not appear to be Paris, the dress of the bustling people
      being completely different than what one would expect to find. Open breezes
      send a chill through this place, stone demons and snarling gargoyles leering
      from the darker corners.
    exits:
      west:
        to: tba.27933
        hidden: false
        door: null
