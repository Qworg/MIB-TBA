  tba.27950:
    area: tba_279
    name: The Entrance to Champs Elysees
    description: |2
         Ahead lies the entrance to Champs Elysees, a large lush forest of the city
      of Paris. The tranquil singing of birds permeates the air, and the peaceful
      hush of the air passing through the leafy branches. The trees are so tall that
      their tops can hardly be seen, gigantic trunks planted in the ground like the
      columns of a grand hall. To the north lies a golden gate, a prominent notice
      fixed to the bars.
    exits:
