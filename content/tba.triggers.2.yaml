    attach_type: obj
    flags: c
    types:
    - command
    narg: 3
    arglist: unwrap
    script: |
      eval present %random.27%
      eval present2 %present% * 1000
      eval present3 %present2% + %random.4%
      %send% %actor% You begin unwrapping the present.
      %echoaround% %actor% %actor.name% begins unwrapping %actor.hisher% present.
