    extra_descriptions:
    - keywords:
      - cells
      - cell
      description: |2
           You can see small and very cramped cells which are filthy.  You shiver and
        vow to never do anything that would cause you to become a resident.
  tba.32461:
    area: tba_324
    name: Livestock Pasture
    description: |2
         This area is fenced in as well, but not as potentially hazardous as that just
      north of here.  The animals here are all cow, well fed and lazy.  They are the
      main meat, milk and leather supply for the army and so are well tended.  The
      ground is strewn with all sorts of surprises - it might be best to watch one's
      step!
    exits:
