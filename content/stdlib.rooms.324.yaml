  tba.32466:
    area: tba_324
    name: Grandstands
    description: |2
         The stands rise close to forty feet into the air, rows and rows of bleacher
      seats available for spectators to sit and watch any ceremony or event which may
      be taking place in the Parade Grounds just south of here.  To the north behind
      the stands is the practice field, a much less used place where trainees go
      through their drills in hopes of perfection when marching on the opulent Parade
      Grounds.
    exits:
      north:
        to: tba.32465
        hidden: false
        door: null
