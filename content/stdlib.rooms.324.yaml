  tba.32467:
    area: tba_324
    name: Parade Grounds
    description: |2
         The grass here is well kept, tended by the newer recruits so that when they
      obtain rank and become recognized as more than just pukes they might have a
      place where they can proudly march for their superiors.  A large grandstands
      lies just north of the grounds where spectators may view events which take place
      and the higher ranks may give praise to those who have done a job well.
