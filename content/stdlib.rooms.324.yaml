    area: tba_324
    name: Roadway
    description: |2
         The eastern gate to the army is just east of here.  To the north is a
      tremendous wood pile which is fed daily by the logging teams of the army.
      Soldiers work constantly at cutting and shaping the wood for whatever needs the
      Army may have.
