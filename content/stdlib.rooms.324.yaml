      - trees
      description: |2
           The trees are old and tower hundreds of feet above the ground.  If you stand
        still and listen carefully, you can hear the birds singing.
  tba.32460:
    area: tba_324
    name: Branding Block
    description: |2
         There is a large firepit here, irons laying with their business ends in the
      pit.  A large wooden block is here to aid the branders in keeping the animals
      still while branding them with the mark of the Eatern Army/f
    exits:
