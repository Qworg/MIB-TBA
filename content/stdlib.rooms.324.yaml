  tba.32476:
    area: tba_324
    name: General's Tent
    description: |2
         The accomodations of this tent are luxurious compared to that of the common
      foot soldier's tents.  It is not, however, a place which one might call
      comfortable.  There is a bed here, only slightly larger than those found in the
      barracks tents and the small table which doubles as a desk is only large enough
      for two men at the most to eat upon it.
