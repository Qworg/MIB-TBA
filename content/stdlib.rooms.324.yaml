  tba.32465:
    area: tba_324
    name: Footman's Training Grounds
    description: |2
         Soldiers in the Eastern Army get to know this field well, indeed.  Whether a
      footman or member of the cavalry, every soldier learns to march here in
      formation and does horrendous hours of physical training which is required of
      every soldier in the army.  To the east is the cavalry fields where the cavalry
      officers might train in their riding and horseman's skills to better their
      performance on the field of battle.
    exits:
      east:
        to: tba.32479
        hidden: false
        door: null
