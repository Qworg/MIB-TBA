        sell.  Buy - Tells me what you want to buy.  Value - Tells you what I will pay
        for an item.  Sell - Tells me you will sell that item, to me.
  tba.32463:
    area: tba_324
    name: Dry Storage
    description: |2
         This is where all non-perishable foodstuffs are kept by the Army.  Sacks of
      flour, loads of dried fruits and canned goods are stacked neatly on shelves and
      on pallets all over the floor.
