         This place is full of various implements for caring for the steeds of the
      cavalry and for doing the work that the cowboys of the army are responsible for.
      There are a few stalls off in the far east corner of the barn where it appears
      the best of the best of the Army's steeds are kept.
    exits:
      west:
        to: tba.32457
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 32458
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - stream
      - brook
      description: |2
           A stream of the clearest, cleanest water that you have ever seen winds its
        way through the valley.
    - keywords:
      - fish
      description: |2
           A variety of species swims peacefully in the cool, clear water.
    - keywords:
      - trees
      - fruit
      description: |2
           The fruit trees, nourished by the fertile ground at the edge of the stream
        and sustained by the brilliant sunshine, line the banks of the stream and are
        laden with fruit.
  tba.32459:
    area: tba_324
    name: Corral
    description: |2
         Horses run around you in a frenzy, their trained senses to first lash out and
      kick any man who is not their usual rider.  Best to get out of this area quickly
      before you get trampled!
