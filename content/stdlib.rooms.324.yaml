  tba.32479:
    area: tba_324
    name: Cavalry Fields
    description: |2
         The ground beneath your feet is trampled and wet, strewn with divots ripped
      from the earth by the thundering hooves of warhorses.  To the west is the
      footman's training area, a large blue tent blocks any passage south.
    exits:
