  tba_trig_21101:
    vnum: 21101
    name: Load Cards
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 100
    arglist: '*'
    script: "set zone 211\nset start %self.room.vnum%\neval room %self.room.vnum% + 1\nswitch %speech.car%\n  case shuffle\n    if %self.varexists(Cards_Dealt)%\n      %echo%   The voice is in your mind again.\n      %echo%     'I'm sorry, the cards seem to be already laid out.'\n      halt\n    else\n      set deck 78\n      set layout 10\n      global deck\n      global layout\n      set var %zone%01\n      emote shuffles the cards.\n      %echo%   %self.name% seems to speak directly to your mind.\n      %echo%     'Keep shuffling until you feel the deck understands your question.\n      %echo%    When you're ready, say DEAL.'\n      set Deck_Shuffled 1\n      global Deck_Shuffled\n      while %var% < %zone%79\n        set %var% 1\n        remote %var% %self.id%\n        eval var %var% + 1\n      done\n      halt\n    end\n  end\n  case deal\n  if !%self.varexists(Deck_Shuffled)%\n    %echo%   The voice is in your mind again.\n    %echo%     'The cards don't seem to understand your question yet.  Have you \n    %echo%    SHUFFLEd?'\n    halt\n  elseif %self.varexists(Cards_Dealt)%\n    %echo%   The voice is in your mind again.\n    %echo%     'I'm sorry, the cards seem to be already laid out.'\n    halt\n  else\n    emote starts to lay out the cards.\n    %echo%   The voice seems to surround you now.\n    %echo%     'When you're ready, please go up to start your reading.  Once you\n    %echo%    start, you won't be able to come back.  Of course, you can always\n    %echo%    come back for another reading.\n    wait 2 sec\n    %echo%     At each room, LOOK CARD to see the meaning.  Reverse means\n    %echo%    that the card laid out upsidedown which changes the meaning.\n    %echo%    Don't worry about it.  The card will show the reversed meaning.\n    %echo%    The room name will explain what the placement of the card means.'\n    wait 1 sec\n    %door% %self.room.vnum% up flags a\n    emote opens the door to the stairway.\n    while %layout%\n      set zonebase %zone%00\n      eval card %random.78% + %zonebase%\n      eval temp %%self.varexists(%card%)%%\n      eval hascard %temp%\n      if %hascard%\n        mgoto %room%\n        set rand %random.2%\n        if %rand% == 1\n          %load% obj %zone%99\n        end\n        %load% obj %card%\n        mgoto %start%\n        rdelete %card% %self.id%\n        eval deck %deck% - 1\n        eval layout %layout% - 1\n        eval room %room% + 1\n        global deck\n        global layout\n        set Cards_Dealt 1\n        global Cards_Dealt\n      else\n      end\n    done\n    halt\n  break\n  default\n  break\nend\n"
  tba_trig_21102:
    vnum: 21102
    name: Look Card
    attach_type: wld
    flags: c
    types:
    - command
    narg: 100
    arglist: '*'
    script: |
      * Parnassus' Special Anti-Freeze Formula
      if %cmd.mudcommand% == nohassle
        return 0
        halt
      end
      *
      set zone 211
      if %self.vnum% > %zone%10 && %self.vnum% < %zone%24
        * if %self.vnum% > %zone%00 && %self.vnum% < %zone%24
        set cmdroom %zone%20
      elseif %self.vnum% > %zone%30 && %self.vnum% < %zone%44
        set cmdroom %zone%40
      elseif %self.vnum% > %zone%45 && %self.vnum% < %zone%64
        set cmdroom %zone%60
      else
        return 0
        halt
      end
      if %cmd.mudcommand% == look || %cmd.mudcommand% == examine
        * Look Trigger Written by Fizban - June 06 2013
        * This trigger changes the meaning of the card for reverse.
        * If there is no argument, just look.
        if !%arg%
          return 0
          halt
        else
          * Check for the reverser.  If it is in the room, give
          *  one meaning.  If it is not, give the other.
          eval rev %%findobj.%self.vnum%(%zone%99)%%
          * The ~ anchors the comparison to the front of the word.
          * rd /= card but ~rd is not a part of ~card while ~c is.
          set arg ~%arg%
          if ~reverse /= %arg%
            if %rev% < 1
              %send% %actor% You do not see that here.
              halt
            else
              %send% %actor% The card is upside down.
              halt
            end
          end
          if ~card /= %arg%
            if %rev% < 1
              %force% %actor% look card
            else
              %force% %actor% look reverse
            end
          else
            return 0
          end
        end
      elseif %cmd.mudcommand% == quit || %cmd.mudcommand% == afk
        %send% %actor% Because you have decided to %cmd.mudcommand%, you cannot finish the reading.
        %echoaround% %actor% %actor.name% has to leave the reading now.
        wait 1 sec
        %send% %actor% You are magically sent to the end of the reading.
        %echoaround% %actor% %actor.name% is whisked away in a puff of smoke.
        wait 1 sec
        %teleport% %actor% %cmdroom%
        wait 1 sec
        %at% %cmdroom% %force% %actor% down
        wait 1 sec
        %at% %actor% %force% %actor% %cmd% %arg%
        wait 1 sec
        halt
      elseif %cmd% == return || %cmd% == recall || %cmd% == teleport || %cmd.mudcommand% == goto
        %send% %actor% Because you have decided to %cmd%, you cannot finish the reading.
        %echoaround% %actor% %actor.name% has to leave the reading now.
        wait 1 sec
        %send% %actor% You are magically sent to the end of the reading.
        %echoaround% %actor% %actor.name% is whisked away in a puff of smoke.
        wait 1 sec
        %teleport% %actor% %cmdroom%
        wait 1 sec
        %at% %cmdroom% %force% %actor% down
        wait 1 sec
        %at% %actor% %force% %actor% %cmd% %arg%
        wait 1 sec
        halt
      else
        return 0
      end
  tba_trig_21103:
    vnum: 21103
    name: Clear the Cards - r21120, r21140, r21160
    attach_type: wld
    flags: q
    types:
    - leave
    narg: 100
    arglist: ''
    script: |
      * Clears cards from the reading and reader marker
      * when player finishes the reading.
      if %direction% == down
        wait 2 sec
        %purge%
        set room %self.vnum%
        eval purgeroom %room% - 10
        %door% %purgeroom% up flags abcd
        eval purgeroom %purgeroom% + 1
        while %purgeroom% < %self.vnum%
          %at% %purgeroom% %purge%
          eval purgeroom %purgeroom% + 1
        done
        eval purgeroom %purgeroom% + 5
        %at% %purgeroom% %purge%
      end
