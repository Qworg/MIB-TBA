  tba_trig_21105:
    vnum: 21105
    name: Dealer Greets
    attach_type: mob
    flags: h
    types:
    - greet-all
    narg: 100
    arglist: ''
    script: |
      wait 2 sec
      %echo%   The voice of %self.name% seems to fill your head.
      %echo%      'Ahh, you have something on your mind? Let us see what the
      %echo%    cards have to say.  Unfortunately, you cannot hold or shuffle
      %echo%    my cards, but concentrate on your question and say shuffle.
      %echo%    When you feel that the cards know your question, say deal and
      %echo%    I shall lay out the cards for you to examine.
      wait 3 sec
      %echo%      Usually I would interpret the cards for you, but that is
      %echo%    forbidden me in this space and time.  All I am allowed is to
      %echo%    show you the cards and you must decide their meanings in your
      %echo%    own mind. Move from card to card.  Each space and each card
      %echo%    will explain itself to you. 'LOOK CARD' in each room to see
      %echo%    the explanation. These are very simplified meanings so they
      %echo%    are very general.
      wait 3 sec
      %echo%      Remember, this is just a game and should not be taken
      %echo%    seriously any more than you would run your life by newspaper
      %echo%    horoscopes or slips of paper from fortune-cookies.
      wait 2 sec
      %echo%      When you're ready, start by saying SHUFFLE.'
  tba_trig_21106:
    vnum: 21106
    name: Receptionist juggles appointments - M21104
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 100
    arglist: '*'
    script: |
      set zone 211
      * set findobj 0
      * Checks for available readers
      * Kicks out people that are afk, etc
      if %self.room.vnum% != %zone%02
        emote looks around in confusion.
        say I'm sorry.  I have to get to my office.
        emote leaves.
        eval findmob %%findmob.%zone%02(%self.vnum%)%%
        if %findmob% > 0
          %purge% %self%
        else
          mgoto %zone%02
          halt
        end
      end
      if %actor% == %self%
        halt
      end
      * This loop goes through the entire string of words the actor says. .car is the
      * word and .cdr is the remaining string.
      eval word %speech.car%
      eval rest %speech.cdr%
      while %word%
        *   %echo% Word: %word%
        *   %echo% rest: %rest%
        switch %word%
          * Appointment starts the conversation.
          * Objxxx98 keeps trigger from reacting to other conversations.
          * if %actor.is_pc% &&
          case appointment
          * Check to see if someone is already trying to get an appointment.
          if %self.has_item(%zone%98)% && !%actor.varexists(Making_Tarot_Appointment_%zone%)%
            say I'm sorry, %actor.name%.  I'm speaking with someone else right now.
            halt
          end
          if !%self.has_item(%zone%98)%
            %load% o %zone%98
            set Making_Tarot_Appointment_%zone% 1
            remote Making_Tarot_Appointment_%zone% %actor.id%
            say Let me just see if any of our consultants have an opening.
            say Say restart at any time to leave or start over.
            %echo% She consults an appointment book.
            wait 2 seconds
            set available 0
            set readerno 0
            set unreaderno 0
            eval temp %%findobj.%zone%25(card)%%
            eval findobjsibyl %temp%
            if %findobjsibyl% < 1
              eval available %available% + 1
              eval readerno %readerno% + 1
              set reader%readerno% Sibyl
            else
              eval unreaderno %unreaderno% + 1
              set unreader%unreaderno% Sibyl
            end
            eval temp %%findobj.%zone%45(card)%%
            eval findobjesmerelda %temp%
            if %findobjesmerelda% < 1
              eval available %available% + 1
              eval readerno %readerno% + 1
              set reader%readerno% Esmerelda
            else
              eval unreaderno %unreaderno% + 1
              set unreader%unreaderno% Esmerelda
            end
            eval temp %%findobj.%zone%65(card)%%
            eval findobjjaelle %temp%
            if %findobjjaelle% < 1
              eval available %available% + 1
              eval readerno %readerno% + 1
              set reader%readerno% Jaelle
            else
              eval unreaderno %unreaderno% + 1
              set unreader%unreaderno% Jaelle
            end
            if %available% == 0
              say Sorry, Sibyl, Esmerelda and Jaelle all seem to be with clients right now.
              say Please try again later.
              rdelete Making_Tarot_Appointment_%zone% %actor.id%
              halt
            end
            if %available% == 1
              say %unreader1% and %unreader2% are with clients but %reader1% is available.
              say Say %reader1% if you want to see her.
              set Choosing_Tarot_Reader_%zone% 1
              remote Choosing_Tarot_Reader_%zone% %actor.id%
              halt
            end
            if %available% == 2
              say %unreader1% is with a client but %reader1% and %reader2% are available.
              say Say %reader1% or %reader2% to see her.
              set Choosing_Tarot_Reader_%zone% 1
              remote Choosing_Tarot_Reader_%zone% %actor.id%
              halt
            end
            if %available% == 3
              say %reader1%, %reader2% and %reader3% are all available right now.
              say Say %reader1%, %reader2% or %reader3% to see her.
              set Choosing_Tarot_Reader_%zone% 1
              remote Choosing_Tarot_Reader_%zone% %actor.id%
              halt
            end
          end
        break
        case Sibyl
          if %actor.varexists(Choosing_Tarot_Reader_%zone%)%
            eval findobj %%findobj.%zone%25(card)%%
            if %findobj% < 1
              say Sibyl is ready to see you now.
              %door% %zone%02 north flags a
              wait 1 sec
              %force% %actor% north
              %door% %zone%02 north flags abc
              rdelete Making_Tarot_Appointment_%zone% %actor.id%
              rdelete Choosing_Tarot_Reader_%zone% %actor.id%
              mgoto %zone%99
              %purge% quill
              mgoto %zone%25
              %load% obj %zone%49
              mgoto %zone%02
            else
              say I'm sorry.  Sibyl is with another client right now.
              say Please choose one of the available readers.
            end
          end
        break
        case Esmerelda
          if %actor.varexists(Choosing_Tarot_Reader_%zone%)%
            eval findobj %%findobj.%zone%45(card)%%
            if %findobj% < 1
              say Esmerelda is ready to see you now.
              %door% %zone%02 west flags a
              wait 1 sec
              %force% %actor% w
              %door% %zone%02 west flags abc
              rdelete Making_Tarot_Appointment_%zone% %actor.id%
              rdelete Choosing_Tarot_Reader_%zone% %actor.id%
              mgoto %zone%99
              %purge% quill
              mgoto %zone%45
              %load% obj %zone%52
              mgoto %zone%02
            else
              say I'm sorry.  Esmerelda is with another client right now.
              say Please choose one of the available readers.
            end
          end
        break
        case Jaelle
          if %actor.varexists(Choosing_Tarot_Reader_%zone%)%
            eval findobj %%findobj.%zone%65(card)%%
            if %findobj% < 1
              say Jaelle is ready to see you now.
              %door% %zone%02 east flags a
              wait 1 sec
              %force% %actor% e
              %door% %zone%02 east flags abc
              rdelete Making_Tarot_Appointment_%zone% %actor.id%
              rdelete Choosing_Tarot_Reader_%zone% %actor.id%
              mgoto %zone%99
              %purge% quill
              mgoto %zone%65
              %load% obj %zone%50
              mgoto %zone%02
            else
              say I'm sorry.  Jaelle is with another client right now.
              say Please choose one of the available readers.
            end
          end
        break
        case Restart
          if %actor.varexists(Making_Tarot_Appointment_%zone%)%
            rdelete Making_Tarot_Appointment_%zone% %actor.id%
            rdelete Choosing_Tarot_Reader_%zone% %actor.id%
            mgoto %zone%99
            %purge% quill
            mgoto %zone%02
            emote puts down the appointment book.
          end
        break
        default
        break
      done
      * End of the loop we need to take the next word in the string
      * and save the remainder for the next pass.
      eval word %rest.car%
      eval rest %rest.cdr%
      done
  tba_trig_21107:
    vnum: 21107
    name: Tarot Receptionist greets - M21104
    attach_type: mob
    flags: h
    types:
    - greet-all
    narg: 100
    arglist: '*'
    script: |
      if %direction% == south
        welcome %actor.name%
        %send% %actor% Ana says, 'Would you like to make an appointment with one of our readers?'
        %send% %actor% Ana says, 'Before we start, make sure you have enough time to finish your reading.'
        %send% %actor% Ana says, 'Please do not go afk or leave the game before you finish the reading.'
        %send% %actor% Ana says, 'If you are sure, just say appointment.'
      else if %direction% == up
        smile %actor.name%
        %send% %actor% Ana says, 'I hope you enjoyed your reading.  Please, come again soon.'
        %send% %actor% Ana says, 'Of course, if you want another appointment now, say appointment.'
      end
  tba_trig_21108:
    vnum: 21108
    name: Leaving Tarot
    attach_type: mob
    flags: c
    types:
    - command
    narg: 100
    arglist: '*'
    script: "* For mobs to clear reading from players blocking by starting and leaving.\n* Should be adjusted to your muds commands.\n* Parnassus' Special Anti-Freeze Formula\nif %cmd.mudcommand% == nohassle\n  return 0\n  halt\nend\n*\nset zone 211\nif %cmd.mudcommand% == quit || %cmd.mudcommand% == afk\n  if %self.vnum% == %zone%04 && %actor.varexists(Making_Tarot_Appointment_%zone%)%\n    say I'm sorry but I won't be able to give you an appointment right now.\n    say Please come back when you have more time available.\n    rdelete Making_Tarot_Appointment_%zone% %actor.id%\n    rdelete Choosing_Tarot_Reader_%zone% %actor.id%\n    mgoto %zone%99\n    %purge% quill\n    mgoto %zone%02\n    wait 1 sec\n    emote puts down the appointment book.\n    wait 1 sec\n    %force% %actor% %cmd.mudcommand%\n    wait 1 sec\n    halt\n  elseif %self.vnum% == %zone%01 || %self.vnum% == %zone%02 || %self.vnum% == %zone%03\n    set office %self.room.vnum%\n    eval endroom %office% + 10\n    %echo%     %self.name%'s voice sounds reproachfully in your head.\n    %echo%        'You don't seem to have time for this right now.\n    %echo%      Please come back when you have more time.'\n    wait 1 sec\n    %echo%    %self.name% waves her hand and you find yourself outside.\n    wait 1 sec\n    %teleport% %actor% %zone%01\n    mgoto %endroom%\n    down\n    mgoto %office%\n    wait 1 sec\n    %force% %actor% look\n    %force% %actor% %cmd.mudcommand%\n    rdelete Deck_Shuffled %self.id%\n    rdelete Cards_Dealt %self.id%\n    rdelete tarot_reading_started %self.id%\n    halt\n  else\n    return 0\n    halt\n  end\nelseif %cmd% == return || %cmd% == recall || %cmd% == teleport || %cmd.mudcommand% == goto\n  if %self.vnum% == %zone%04 && %actor.varexists(Making_Tarot_Appointment_%zone%)%\n    say I'm sorry but I won't be able to give you an appointment right now.\n    say Please come back when you have more time available.\n    rdelete Making_Tarot_Appointment_%zone% %actor.id%\n    rdelete Choosing_Tarot_Reader_%zone% %actor.id%\n    mgoto %zone%99\n    %purge% quill\n    mgoto %zone%02\n    %send% %actor%  \n    emote puts down the appointment book.\n    %send% %actor%  \n    return 0\n    halt\n  elseif %self.vnum% == %zone%01 || %self.vnum% == %zone%02 || %self.vnum% == %zone%03\n    set office %self.room.vnum%\n    eval endroom %office% + 10\n    %echo%     %self.name%'s voice sounds reproachfully in your head.\n    %echo%        'You don't seem to have time for this right now.\n    %echo%      Please come back when you have more time.'\n    %send% %actor%  \n    %teleport% %actor% %zone%01\n    return 0\n    %send% %actor%  \n    mgoto %endroom%\n    down\n    mgoto %office%\n    rdelete Deck_Shuffled %self.id%\n    rdelete Cards_Dealt %self.id%\n    rdelete tarot_reading_started %self.id%\n    halt\n  else\n    return 0\n    halt\n  end\nelseif %cmd.mudcommand% == south\n  if %self.vnum% == %zone%04 && %actor.varexists(Making_Tarot_Appointment_%zone%)%\n    say I'm sorry but I won't be able to give you an appointment right now.\n    say Please come back when you have more time available.\n    rdelete Making_Tarot_Appointment_%zone% %actor.id%\n    rdelete Choosing_Tarot_Reader_%zone% %actor.id%\n    mgoto %zone%99\n    %purge% quill\n    mgoto %zone%02\n    wait 1 sec\n    emote puts down the appointment book.\n    wait 1 sec\n    %force% %actor% %cmd%\n    halt\n  else\n    return 0\n    halt\n  end\nelse\n  return 0\nend\n"
  tba_trig_21109:
    vnum: 21109
    name: Timer for obj 21198
    attach_type: obj
    flags: f
    types:
    - timer
    narg: 100
    arglist: ''
    script: |
      * Timer on obj 21198 is set to 10 minutes.  This is adjustable.
      * Since 21198 stops any appointments while talking to one person
      *  this keeps any person from blocking the zone until reboot.
      set zone 211
      set actor %self.carried_by%
      if %actor.vnum% == %zone%04
        %echo% %actor.name% says, 'I've been waiting too long for this appointment.'
        %echo% %actor.name% puts down the appointment book.
        %purge% %self%
      else
        set actor %self.carried_by.name%
        %force% %actor% say I seem to have stolen someone's pen.
        %echoaround% %actor% The nib of the pen pokes %actor%.
        %send% %actor% The nib of the pen pokes you.
        %damage% %actor% 5
        %echoaround% %actor% %actor.name% shakes %actor.hisher% hand in pain and drops a pen which rolls away.
        %send% %actor% You drop a pen which rolls away somewhere.
        %purge% %self%
      end
  tba_trig_21110:
    vnum: 21110
    name: Reload glass and bread - obj 21180 and 21182
    attach_type: obj
    flags: c
    types:
    - command
    narg: 100
    arglist: '*'
    script: |
      * This trigger is to keep the waiting room supplied with food and drink.
      * Because of the auto-regenerative qualities, it also cancels out any
      *  sac benefits to prevent spam-saccing for gold or exp.
      * Parnassus' Special Anti-Freeze Formula
      if %cmd.mudcommand% == nohassle
        return 0
        halt
      end
      *
      set zone 211
      if get == %cmd.mudcommand% || sacrifice == %cmd.mudcommand%
        if %self.room.vnum% == %zone%02
          set testernumber 2
        else
          set testernumber 1
        end
        set arg _%arg%
        eval inroom %self.room%
        eval obj %inroom.contents%
        * find the first object in the room
        while %obj%
          set next_obj %obj.next_in_list%
          set objlist %obj.name%
          set keywordlist _%obj.name.car%
          set keywordrest _%obj.name.cdr%
          while %keywordlist%
            * while an object is in the room
            if %keywordlist.contains(%arg%)%
              if %obj.id% == %self.id%
                if get == %cmd.mudcommand%
                  %force% %actor% %cmd.mudcommand% %obj.name.car%
                elseif sacrifice == %cmd.mudcommand%
                  %send% %actor% You carefully dispose of %obj.shortdesc%.
                  %echoaround% %actor% %actor.name% carefully disposes of %obj.shortdesc%.
                  set me %self.vnum%
                  eval temp %%findobj.%zone%02(%me%)%%
                  eval tester %temp%
                  if %self.room.vnum% == %zone%02
                    set testernumber 2
                  else
                    set testernumber 1
                  end
                  if %tester% < %testernumber%
                    %at% %zone%02 %load% obj %self.vnum%
                  end
                  %purge% %self%
                end
                set me %self.vnum%
                eval temp %%findobj.%zone%02(%me%)%%
                eval tester %temp%
                if %tester% < %testernumber%
                  %at% %zone%02 %load% obj %self.vnum%
                end
                halt
              end
            end
            set keywordlist %keywordrest.car%
            set keywordrest %keywordrest.cdr%
          done
          * find the next object for the while to loop
          set obj %next_obj%
        done
        return 0
        halt
      else
        return 0
        halt
      end
