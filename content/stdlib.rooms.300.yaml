  tba.30055:
    area: tba_300
    name: A Stone Tunnel
    description: |2
         The dragon's throat continues east and west on a path which neither
      rises nor falls.  On the south wall, to the dragon's left, a warmth
      can be felt, followed by a feeling of pure evil.
    exits:
