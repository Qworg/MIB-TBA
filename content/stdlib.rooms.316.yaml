    area: tba_316
    name: West Alley
    description: |2
         The alley heads north and south, the cold, dark gray walls of stone buildings
      surrounding you on every side.  Just south of you lies an offshoot of the main
      alleyway which heads west into the cleric's guild.
    exits:
      north:
        to: tba.31643
        hidden: false
        door: null
