  tba.31664:
    area: tba_316
    name: South Street
    description: |2
         The street, now completely enclosed on the north and south side by gray stone
      walls of guild buildings, leads west to an intersection of some sort, or east
      out into the main business district of McGintey Cove.
    exits:
