# Circle / tbaMUD spell catalog (TBA-E18, doc §8.2).
#
# Hand-authored from the sibling tbaMUD checkout at
# /home/qworg/Development/tbamud:
#
#   - the spell ids and `NUM_SPELLS` come from `src/spells.h:39-127`
#     (`SPELL_RESERVED_DBC` 0 .. `SPELL_DARKNESS` 54; `SPELL_DG_AFFECT` 298 is a
#     framework-only script affect and is deliberately absent here).
#   - every entry's `mana`, target type, `min_position` and routine come from
#     the `mag_assign_spells()` table in `src/spell_parser.c:733-919`
#     (`spello(SPELL_X, "name", mana_max, mana_min, mana_change, minpos,
#     targets, violent, routines, wear_off_msg)`).
#   - damage and healing dice come from `mag_damage()` in `src/magic.c:195-289`
#     and `mag_points()` in `src/magic.c:801-822`; buff affects come from
#     `mag_affects()` in `src/magic.c:314-556`.
#   - each buff-carrying spell's `duration` (in combat rounds) is the
#     `af[].duration` that `mag_affects()` assigns, with the `magic.c` line
#     cited beside it. A spell with no source duration falls back to the
#     documented `DEFAULT_SPELL_DURATION` (6) in `code/src/content.rs`.
#
# `mana` is Circle's `mana_min` — the settled cost after the source's
# `mana_max - mana_change * (level - min_level)` reduction bottoms out. The
# source triple is recoverable from `spell_parser.c` above; this phase charges
# the flat floor because `cast` does not level-scale mana.
#
# Dice are the magic-user branch of `mag_damage()` (the 8-sided variant); the
# source's level term (`earthquake`'s `+ level`, `cure light`'s `+ level/4`)
# and `energy drain`'s level-<=2 instant kill are not representable in a fixed
# `Dice`, so the level-independent part is used and noted on the entry.
#
# Note: tbaMUD's `src/spells.h` does not define a `cure serious` spell (the
# cleric line here is `cure blind`, `cure critic`, `cure light`, `curse`), so
# there is no `cure_serious` entry; the task's illustrative list names one from
# stock CircleMUD 3.1, not from this checkout's `NUM_SPELLS` table.
#
# `kind` maps to what the genre handler can actually do:
#   damage -> `Damage`, heal -> `Heal`, an applied affect -> `Buff`,
#   divination -> `Detect`, anything whose Circle routine is not modelled
#   (flags, summons, object/room manipulation, group logic) -> `Utility`.
# Nothing here invents an effect: a `Utility` spell spends its mana and reports
# that nothing happens yet.
spells:
  # src/spell_parser.c:741-742, routines MAG_SUMMONS (not modelled).
  animate_dead:
    name: animate dead
    mana: 10
    kind: utility
    target: none
    min_position: standing

  # src/spell_parser.c:744-745, magic.c:333-336 (APPLY_AC -20, dur 24).
  armor:
    name: armor
    mana: 15
    kind: buff
    affect:
      location: armor_class
      modifier: -20
    duration: 24
    target: victim
    min_position: fighting

  # src/spell_parser.c:747-749, magic.c:341-348 (APPLY_HITROLL +2 and
  # APPLY_SAVING_SPELL -1, both 6 rounds; the catalog carries the hitroll).
  bless:
    name: bless
    mana: 5
    kind: buff
    affect:
      location: hitroll
      modifier: 2
    duration: 6
    target: victim
    min_position: standing

  # src/spell_parser.c:751-752, MAG_AFFECTS (AFF_BLIND bit, not modelled).
