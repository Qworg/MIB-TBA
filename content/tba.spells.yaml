# Circle / tbaMUD spell catalog (TBA-E18, doc §8.2; GitHub issue #7).
#
# Hand-authored from the sibling tbaMUD checkout at
# /home/qworg/Development/tbamud:
#
#   - the spell ids and `NUM_SPELLS` come from `src/spells.h:39-127`
#     (`SPELL_RESERVED_DBC` 0 .. `SPELL_DARKNESS` 54; `SPELL_DG_AFFECT` 298 is a
#     framework-only script affect and is deliberately absent here).
#   - `name`, `target`, `min_position` and the routine come from the
#     `mag_assign_spells()` table in `src/spell_parser.c:733-919`
#     (`spello(SPELL_X, "name", mana_max, mana_min, mana_change, minpos,
#     targets, violent, routines, wear_off_msg)`).
#   - the mana triple is exactly `spello()`'s `mana_max`, `mana_min` and
#     `mana_change`; the cost is `mag_manacost()` (`src/spell_parser.c:58-62`)
#     -> `MAX(mana_max - mana_change * (level - min_level[class]), mana_min)`.
#   - `min_level` is `init_spell_levels()` (`src/class.c:1589-1665`), the level
#     at which each class first learns the spell; a class absent from the map
#     pays `mana_max`.
#   - damage and healing dice come from `mag_damage()` (`src/magic.c:195-301`)
#     and `mag_points()` (`src/magic.c:801-826`); `level_bonus` is the
#     source's per-level term (`earthquake`'s `+ level`,
#     `cure light`/`cure critic`'s `+ level / 4`). Dice are the magic-user
#     branch (the 8-sided variant); the source's class-dependent 6-sided
#     branch is not modelled.
#   - buff/debuff affects come from `mag_affects()` (`src/magic.c:303-553`);
#     each affect's `duration` is the source `af[].duration` (or the
#     `duration_bonus`/`duration` pair for the level-scaled ones, e.g.
#     `strength`'s `(level / 2) + 4`).
#   - `save` is the outcome of `mag_savingthrow()` (`src/magic.c:36-53`):
#     `half` is `dam /= 2` (`magic.c:291`), `negate` is the source's
#     `CONFIG_NOEFFECT; return` branch (`magic.c:355`, `:376`, `:447`). `cast`
#     always rolls `SAVING_SPELL` (`call_magic`, `spell_parser.c:205-222`).
#
# `kind` maps to what the engine can actually do:
#   damage -> `Damage`, heal -> `Heal`, a self/ally affect -> `Buff`, a
#   hostile affect -> `Debuff`, a divination -> `Detect`. A spell whose Circle
#   routine the engine cannot express is `kind: utility` and MUST carry an
#   `unsupported:` reason; the cast spends its mana and reports that reason
#   rather than silently doing nothing. Nothing here invents an effect.
