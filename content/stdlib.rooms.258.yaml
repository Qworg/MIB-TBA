  tba.25800:
    area: tba_258
    name: A Well Travelled Road
    description: |2
         This road still continues east to west, still an extremely wide road, made
      for heavy traffic.  To the east, the forest begins to close in on either side of
      the road, getting more and more thick the farther east you go.  A smaller road
      branches off to your north here, looking as if it is not a very popular road,
      probably made by some farmer or woodcutter who wanted easier access to his home.
      West you can see the walled city of Jareth, with majestic Lord's Keep sitting
      high atop the tallest hill, flying Jareth's standard proudly.
    exits:
      north:
        to: tba.25801
        hidden: false
        door: null
      west:
        to: tba.25802
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 25800
    coord: null
    sector: field
    extra_descriptions:
    - keywords:
      - credits
      - info
      description: |2
           *Light Forest
           Light Forest by Kaan for Dibrova
        This was originally the Miden'Nir, re-mapped and remobbed as a basic
        connector zone.  It is now fit to connect to 8 separate zones, more if
        desired, with low level mobs to populate it.  It would be my suggestion
        that, if you used this zone, take the mobs and junk them and make new
        ones.  The ones in this zone suck pretty bad - it has been on my list to
        redo them, but I have never actually gotten around to it - always have
        an excuse to do something else ;-) Enjoy!

        Replace XXXX with a town name of your choosing.

        Zone 258 is linked to the following zones:
