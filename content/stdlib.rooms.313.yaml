      fields below, a figure or two can be seen running crouched over from one spot to
      another trying not be seen.  Small pockets of fighting can be heard if not seen
      in the areas below.  It is rumored that the Lord of Jareth sent reinforcements
      for the town to try and eliminate the threat of the goblins, maybe that is what
