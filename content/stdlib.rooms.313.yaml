  tba.31302:
    area: tba_313
    name: At the Wall of Ofingia
    description: |2
         The southern wall of Ofingia stands tall and impregnable on the north side.
      To the east, the jumbled upon which you stand drops off into a large field which
      may once have been growing tall with corn but now only boasts a few scorched
      stalks.  South is much the same, a steep drop off down into the burnt-out field.
      It does not appear that the way down in either direction is safe - it is
      recommended that another way be found.
    exits:
