  tba.31323:
    area: tba_313
    name: The Southeastern Corner
    description: |2
         The Eastern Causeway ends at this point, another section of it heading west
      through more of the farmlands.  To the south is a fairly large plot of land
      owned and farmed - until recently - by Jon Boggins, the first farmer in this
      area.  His land is now scorched and ruined with no hope of a crop for at least a
      couple more years until the soil repairs itself.  The folk of Ofingia have only
      seen Jon once since the raids began, when he came into town to ask for military
      help from the mayor.  Jon's farm was the first hit by the raids, and the mayor
      thought that it would be a one-time occurance.  Since the town forces were
      already fighting in the caverns east of town and were few in number to start
      with, the mayor refused Jon his help.  Jon spit in the mayor's face and vowed
      never to pay another dime in taxes.  The only communication from Jon was a cart
      bearing his farm's crest sent into town bearing the remains of Jon's son.
    exits:
