    name: Private Causeway
    description: |2
         At one time - not too long ago - this section of the farming area was owned
      and kept by Scorfahr, the richest of the farmers in the Ofingian farmlands due
      to the immense size of his fields and the quality of the soil with which he
      produced the most plentiful crops year after year.  Scorfahr was killed right at
      the outset of the raids by a roaving band, his farm burnt to the ground.
