  tba.31308:
    area: tba_313
    name: A Breathtaking View
    description: |2
         The start of the walkway begins here, the tall manmade rock causeway that
      spans over most of the farming area of Ofingia.  From this height, most of the
      farmlands and the small homes within those areas can be seen.  At one time, an
      artist could probably have been struck with wonder and awe at the beauty of this
      vast, organized farming area.  Now the fields - once green and verdant with life
      - are burnt and smoking.  Farmhouses have been all but erradicated by the roving
      hoardes of giblins from the mountain caverns to the north.  The causeway leads
      south into the smoke and soot or north toward the city.
    exits:
