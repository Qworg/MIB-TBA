rooms:
  tba.31300:
    area: tba_313
    name: At the South Gate to Ofingia
    description: |2
         Looking south toward what should be the farming capitol of Dibrova, an
      intense weight of sorrow for the men and women who farmed there, lived there,
      loved there, and died there staggers you with the sheer immensity of the crimes
      done them.  The sky which once was nearly always blue and clear is filled now
      with char and soot, carried upon winds of smoke and ash from the goblin raids
      which took this peaceful community by surprise.  The gate to the north always
      stays closed and barred from the inside, vigilant guards on the ramparts
      watching for any signs of trouble and bidding you a safe journey.
    exits:
      east:
        to: tba.31301
        hidden: false
        door: null
      south:
        to: tba.31306
        hidden: false
        door: null
      west:
        to: tba.31304
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 31300
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - credits
      description: |2
           *Shattered Farmlands of Ofingia
        *Written by Kaan for Dibrova
        Level: 8 - 15
        94 rooms
        13 mobs
        27 objs
        Connector Zones: Ofingia
        After making Ofingia a Hometown on Dibrova and having it basically in
        the middle of BFE, I decided it might be a good idea to stick a zone
        in that would be close in proximity to Ofingia and have some mobs
        available that were low level, made just for players fresh out of the
        Newbie Zones.
        This is not a very exciting area, I will be the first to admit. There
        are a number of same-room descrips in this one that make the zone
        slightly blah. The objs are all intended to be for lower level players,
        same as the mobs. The plot is supposed to feed off the already existing
        plot that Ofingia had from the start:
        The goblins have the town under seige, they have ransacked these
        farmlands in an attempt to prohibit the town from having any food
        supplies. They constantly come in and loot and burn everything they
        can find to further the town's losses. The Lord of Jareth has sent in
        a retinue of his finest to help quell the threat, however they are
        unaffective against the numbers of goblins in the area.
        Hope you like it.
        Exits: 07s, 16s
        Links: 00n cave, 33w cave
  tba.31301:
    area: tba_313
    name: The Rocky Flatlands at the City Wall
    description: |2
         Jagged rocks rise from their resting places in the earth the solid rock
      formations being what Ofingia was built upon.  Just to south a ways, the rocks
      taper off and open up a small valley where one of the many farmland fields of
      this area are.  Of course, the fields are no longer as cared for as they once
      were, being that every time any farmer makes an attempt at replanting a field, a
      band of goblins come along and burn it to ash and kill the farmer.  The city
      wall lies to the north - a tall, thick obstuction which is the town's only
      defense against the goblin hoardes which attempt to overrun the town daily.
    exits:
      east:
