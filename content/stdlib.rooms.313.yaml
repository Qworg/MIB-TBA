  tba.31333:
    area: tba_313
    name: The End of a Private Causeway
    description: |2
         This small section of additional causeway was built by Scorfahr so he could
      have his own ingress and egress to his home without having to deal with the
      common farmhands who frequented the main causeway.  A sloping path leads down to
      the north into the field and homestead where Scorfahr used to reside.  His home,
      once the largest and most opulent home in the farmlands, is now no more than a
      burnt out shell - still smoking.
