  tba.31303:
    area: tba_313
    name: Rocky Flatlands at the City Wall
    description: |2
         On the north side the south wall of Ofingia rises thirty feet up, solid and
      unyielding.  Stolid faces look down upon you from the ramparts, faces of men and
      women who have known much pain and injustice from the goblins who continually
      raid this town.  To the south and west are steep rocky drop-offs, too steep for
      climbing.  They lead down into the farming area, where the soil is rich and
      strong when its not being burnt by goblins or trampled by the feet of marching
      soldiers.
