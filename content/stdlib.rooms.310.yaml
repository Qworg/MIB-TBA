  tba.31024:
    area: tba_310
    name: The Ledge
    description: |2
         You find yourself on a very wide ledge.  You could stretch out here and take
      a nap if you wanted too.  To the south you get a fantastic view of the entire
      forest.  There is perhaps another forty feet to the top of the cliff, all of
      which appears to be an easy climb.
    exits:
      east:
