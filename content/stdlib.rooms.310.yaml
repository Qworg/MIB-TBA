  tba.31002:
    area: tba_310
    name: The Great Field
    description: |2
         You are standing in a great field of tall grass.  The smell of fresh dirt
      and sunlight surrounds you.  The air is filled with the sound of chirping birds
      happily building their nests in the depths of the knotted grass.  A wagon trail
      runs in an east-south direction.
    exits:
      west:
        to: tba.31003
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 31002
    coord: null
    sector: field
    extra_descriptions: []
  tba.31003:
    area: tba_310
    name: The Forest's Edge
    description: |2
         The grassland fades to spotted scrub here, and finally merges into a great
      line of trees.  To the far north a stormcloud hangs in the air ominously, but
      strangely enough it is still quite pleasant out.  Crickets chirp merrily, and
      the sun's rays warm your skin.  The wagon trail leads eastwards back into the
      grassland, and dissapears westwards into the forest.
    exits:
      east:
        to: tba.31002
        hidden: false
        door: null
      west:
        to: tba.31004
        hidden: false
        door: null
