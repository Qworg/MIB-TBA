    extra_descriptions:
    - keywords:
      - ledge
      - thin
      description: |2
           The ledge is very narrow, perhaps two feet at it's widest part.
  tba.31023:
    area: tba_310
    name: The Thin Ledge
    description: |2
         You are standing on a very thin ledge, just wide enough for your feet to
      stand on it widthwise.  The ledge widens to the west and east.
    exits:
