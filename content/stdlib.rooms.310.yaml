  tba.31025:
    area: tba_310
    name: Oops.
    description: |2
         "Aaarrrggg!  ", you scream as you plummet toward the earth.  The ground
      rushes up at you at a dizzying pace, and you prepare for impact.  Suddenly,
      there is a flash of blinding light, and you feel yourself floating in white
      light.  You notice a glint in Aten's eye.  "Your time has not yet come..  ", he
      utters.
    exits: {}
