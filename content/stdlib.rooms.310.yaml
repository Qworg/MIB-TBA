  tba.31020:
    area: tba_310
    name: The Cliff Wall
    description: |2
         You inch your way upwards, hand over hand, searching out more footholds.
      Sweat stings your eyes, and your breathing becomes ragged.  You can still drop
      safely to the forest floor, or madly continue upwards.
    exits:
      down:
