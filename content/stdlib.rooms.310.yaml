  tba.31021:
    area: tba_310
    name: The Overhang
    description: |2
         You progress upwards is stopped by what appears to be an overhang.  It would
      be a nice place to stop an rest..  If you weren't underneath it.  You glance
      around for an alternate path..
    exits:
      down:
