  tba.27581:
    area: tba_275
    name: The Lobby To Goethe's Library
    description: |2
         You are totally consumed by the sheer power generated by the
      combined intelligence in this building.  This IS the library of
      the famed philosopher, Goethe.  Here, researchers and intellects
      gather to learn from the mass collections of knowledge.  The only
      problem is that recently the library has become overrun by cutthroat
      knowledge seekers.  The library also serves as the source of magic
      scrolls to adventurers in New Sparta.
         Broadway continues to the west.
