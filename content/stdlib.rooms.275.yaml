    area: tba_275
    name: The Tunnel
    description: |2
         You stand at the end of a long tunnel, the long walk where
      the fearless gladiators collect their final thoughts before
      entering the battle zone.  There is a light at the end of the
      tunnel, beckoning you to enter.  You hear the roar or the crowd,
      and begin to feel your animalistic instincts rise inside of you.
      Can you take that long walk...?
         Above you are the stands, to your east is the playing field.
