  tba.27589:
    area: tba_275
    name: The Pool Room
    description: |2
         As you look about the pool room, you think to yourself, gee, if only
      I could get Norm drunk enough to win money off of him.  Then you realize
      that 1) you couldn't afford the money it would take to get him drunk, and
      2) you really don't think Norm would ever leave his stool unguarded.  You
      see a pool table and pool sticks.
         The bar stools are to east.
