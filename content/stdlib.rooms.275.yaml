      description: |2
           ******************************************
           *                                        *
           *            WarDome SuperBoxes          *
           *            ------------------          *
           *    SuperBoxes reserved for only the    *
           *    very rich and privileged.  If you   *
           *    do not fall into these categories,  *
           *    then GET LOST!!!!!                  *
           *                       Thank you,       *
           *                       The Management   *
           *                                        *
           ******************************************
  tba.27541:
    area: tba_275
    name: The Visitor's Locker Room
    description: |2
         What you see (and smell) before you is the typical bloodball
      locker room, filled with tape, torn jerseys, mud, blood, and
      assorted pieces of equipment and body parts.
         To the west is the shower room, to the south you exit onto
      the concourse.
