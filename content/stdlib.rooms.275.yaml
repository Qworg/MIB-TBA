    - keywords:
      - table
      description: |2
           This is your standard tournament pool table (would you expect anything less).
  tba.27590:
    area: tba_275
    name: Melville's Restaurant
    description: |2
         This is the famous restaurant upstairs from the Cheers bar.  It
      is currently owned by the evil bald man, Jonathan Hill.  Although the
      company might be bad, you are definitely assured to get a good meal.
      If you aren't wearing a jacket and tie, you'd better leave fast before
      Mr. Hill gets snotty and throws you out (but you can always steal their
      mints!).
         The Cheers Bar is downstairs.
    exits:
