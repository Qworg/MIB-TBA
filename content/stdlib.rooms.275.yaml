  tba.27582:
    area: tba_275
    name: The Entrance To Cheers Bar
    description: |2
         Making your way in the world today takes everything you've got.
      Taking a break from all your worries sure would help a lot -- well,
      we think you know the rest.  Anyway, this is just a place where you
      can sit back and enjoy a drink with Norm and the guys.  And if that
      gets old, (it sure hasn't with Norm) you're sure to find something
      else to do.
         The Main Bar is to the west, Broadway is to the east.
    exits:
