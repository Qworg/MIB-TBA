  tba_trig_11721:
    vnum: 11721
    name: say 'hello' -11717
    attach_type: mob
    flags: d
    types:
    - speech
    narg: 1
    arglist: hello
    script: |
      * This trigger has been exported 'as is'. This means that vnums
