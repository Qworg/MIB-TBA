  tba.26430:
    area: tba_264
    name: At the Fringes of Civilization
    description: |2
         You step through the trees and out of the darkness into an open glade nestled
      deep in this hollow.  A small lane stretches south into a tiny village, lined by
      low, stone and mortar homes.  The source of the glow you saw from back in the
      forest is a small street lantern mounted on a post.  Although it's light would
      be considered meager at best out in the world above, here it seems to burn with
      a fierce light, one that makes you squint.  You see that all along the lane
      there are similiar lanterns on posts as well.
    exits:
      north:
        to: tba.26409
        hidden: false
        door: null
      south:
