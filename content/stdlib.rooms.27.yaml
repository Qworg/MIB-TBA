    name: Kitchen Pantry
    description: |2
         Rows of shelves line the walls, supporting the weight of various jars and
      bowls and various preserved meats dangle from hooks in the walls.  The ceiling
      too, is obscured by dried spices and herbs, filling the air with a heady
      mixture of scents.  A dip in the middle of the roof allows a strange tubed
      contraption to collect the dripping condensation.
