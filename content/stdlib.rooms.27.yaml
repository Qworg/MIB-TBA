    - no_mob
    num: 2719
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - broken
      - toys
      description: |2
           A tiny clay doll's head lies in the dirt, its unblinking eyes coated in a
        delicate film of dust.
    - keywords:
      - useless
      - tools
      description: |2
           Broken wooden handles, and rust-decayed metal lie half buried in the sandy
        ground, forgotten and left to rot.
    - keywords:
      - old
      - cobwebs
      description: |2
           These webs look to be years old, any beauty to their carefully woven
        structure long eroded, grayed and dimmed so that they are little more than
        fluttering ghosts in the breeze.
    ambient_phases: {}
    ambient_weather: {}
  tba.2720:
    area: tba_27
    name: Musty Tunnel
    description: |2
         A deep gloom seems to fill this place, heat wafting uncomfortably from the
      walls and making the air shimmer.  The slime everywhere seems to have congealed
      into sticky pools of fungus and mineral-saturated water, coating every jagged
      rock as though the cavern bleeds.
    exits:
      north:
        to: tba.2757
        hidden: false
        door: null
      south:
        to: tba.2718
        hidden: false
        door: null
    spawns: []
