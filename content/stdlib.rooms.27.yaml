    name: Chamber of Lyra
    description: |2
         This entire room is an apparent tribute to the powerful Khan'li emotion of
      Lyra, similar in expression to love, but more selfish and obsessive.
      Flickering fire dances freely along the metal gilding in the wall, writhing and
      changing into various humanoid forms as it fills the room with heat and a film
      of moisture.  Scarlet symbols of passion and possession paint the floor and
      ceiling alike, splashed liberally here and there like splatters of blood.
    exits:
