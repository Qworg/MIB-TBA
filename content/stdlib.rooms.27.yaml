    description: |2
         Nothing seems real in this room, filled with a vague fog it is hard to focus
      on anything tangible.  Imagination seems to instantly materialise as dancing
      mirages, piles of treasures appearing and disappearing, glimpses of besotted
      lovers, of smiling families, of beauty, bejewelled castles and powerful thrones
      shaping themselves in the mist as though every lingering daydream found its way
