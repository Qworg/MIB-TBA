    ambient_weather: {}
  tba.2721:
    area: tba_27
    name: Memlin Living Quarters
    description: |2
         Wide and spacious, several benches line the walls of this cavern.  Heat from
      a nearby fire source warms the rock so that it is hot to the touch, and the air
      is heavy with humidity.  In the middle of the room there is a large stone
      sculpture of weighing scales depicting the central memlin belief of balance and
      moderation.
    exits:
      east:
        to: tba.2715
        hidden: false
        door: null
      north:
        to: tba.2722
        hidden: false
        door: null
      west:
        to: tba.2723
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 2721
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - several
      - benches
      description: |2
           These benches are simple in design, barely more than wooden slabs, fastened
        to the stony walls and worn in places.
    - keywords:
      - large
      - stone
      - sculpture
      - weighing
      - scales
      description: |2
           A tall spiralling column of metallic rock stretches almost to the roof of the
        cavern, two elegant silvery arms spreadeagling out from either side.  At the end
        of each a long loop of sparkling chain hangs down, each suspending a flat metal
        plate, a careful representation of the scales normally used for weighing and
        measuring.
    ambient_phases: {}
    ambient_weather: {}
  tba.2722:
    area: tba_27
    name: Cavernous Hot Spring
    description: |2
         This cavern looks almost as though it was naturally hollowed at some point,
      perhaps by a gushing flood of water.  The walls on either side have collapsed
      though, allowing only a small stream to flow through the room.  Heat makes the
      air seem to shimmer, and the sound of dripping echoes off the jagged walls.  A
      small row of towels are hung neatly to the side, along with some lumps of
      sweet-smelling soap.
    exits:
      south:
        to: tba.2721
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - no_mob
    num: 2722
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - towels
      description: |2
           These towels look as though they were once clean and fluffy, but now are
        little more than brown rags, used solely for getting the job done.
    - keywords:
      - lumps
      - soap
      description: |2+
           These appear to have been mashed together out of some homemade substance and
        used as soap.  Several of the slippery lumps sit in crevices along the spring.

    ambient_phases: {}
    ambient_weather: {}
  tba.2723:
    area: tba_27
    name: Sleeping Hollows
    description: |2
         The air is warm and hazy with moisture, and a thick carpet of lush green
      moss covers the floor.  On closer inspection, several cubicle-like hollows can
      be seen carved into the walls.  A few trailing vines act as ladders to the ones
      nearest the roof, and inside the lower ones tufts of fresh and dry moss can be
      seen heaped together as bedding.
    exits:
      east:
        to: tba.2721
        hidden: false
        door: null
      north:
        to: tba.2724
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    num: 2723
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - cubicle-like
      - hollows
      description: |2
           These little carved hollows seem to be used as bunk beds, comfortable looking
        arrangements of moss and bracken fluffed together into bedding piles.
    - keywords:
      - trailing
      - vines
      description: |2
           These dark veiny tendrils weave their way along the walls, providing firm
        support for anyone who would wish to climb inside the higher hollows.
    ambient_phases: {}
    ambient_weather: {}
  tba.2724:
    area: tba_27
    name: Tiny Hollow
    description: |2
         The space here is so small it can hardly be considered a room.  More like a
      cubicle, the ceiling is so low it is only comfortable to lie in.  The rock
      walls have been carefully sanded smooth and child's drawings hang on the wall.
      A few scattered toys stick out of the moss bedding and a tiny chair sits in the
      corner.
    exits:
      south:
        to: tba.2723
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    num: 2724
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - toys
      description: |2
           Several basic children's toys lie scattered around, a bright pink ball
        particularly catches the eye, as does a rather beautiful painted doll.
    - keywords:
      - drawings
      description: |2
           These drawings look meticulously done, many of the papers depicting the sun
        and the moon.  A few of the newer ones show memlin stick-figures wielding picks
        and digging.
    ambient_phases: {}
    ambient_weather: {}
