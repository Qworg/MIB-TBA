    name: Natul, Bringer of Life
    description: |2
         Beyond the glass walls of this room, a great explosion of light can be seen
      suspended in the midst of deep space, frozen in time and almost blinding in
      intensity.  In its wake a small barren planet can be seen beginning to blossom,
      the initial sprouts of growth and life coloring its dusky surface with splashes
      of green, the nearby stars starting to glow brightly as if emblazened with
      unnatural fire.
