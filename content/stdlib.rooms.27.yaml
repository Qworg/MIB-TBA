    name: The Mouth of an Obscured Cave
    description: |2
         The huge slopes of an ancient mountain range tower above the landscape.  In
      the side of the rocky wall a large gaping cave is almost obscured by the
      surrounding trees.  A cold breeze, heavy with the smell of dust and damp wafts
      from the opening, and a faint sound of clanging can be heard from within.
      Large amounts of rubble are piled up at the entrance as though there has been a
      lot of digging activity.
