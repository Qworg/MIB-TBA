  tba.2784:
    area: tba_27
    name: A Blazing Throne Room
    description: |2
         Leaping tongues of fire dance all around the walls of this circular room, the
      heat so intense that everything shimmers with waves of glistening evaporation.
      Perfectly reflective metal flooring mirrors the writhing light, suspending the
      entire contents of this massive room above the raging inferno below.  A great
      throne stands in the center, formed magically from red beryll and studded with
      glimmering blooddrop rubies.  A feeling of intense anger and energy fills the
      air, tiny static sparks igniting randomly here and there.
    exits:
