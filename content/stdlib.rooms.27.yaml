  tba.2799:
    area: tba_27
    name: Detta's Chamber
    description: |2
         Warm hues of amber adorn the curving walls of this large subtly-lit room.
      Against the northern side stands a beautiful bed, intricately carved from lush
      cherry wood and spread with soft cream linen.  Several wall-hung candles
      illuminate the room, serpentine tongues of firelight writhing upon the smooth
      canvas of the bedsheets as shadows weave a sultry dance around the walls.  The
      sweet scent of vanilla wafts in the air, mingled with the deeper, earthier aroma
      of musk and gentle wood-wind music can only vaguely be heard beneath the
      meditative murmuring of a central glass fountain, adding to the almost ethereal
      tranquility of this place.
    exits: {}
    spawns: []
    tags: []
    num: 2799
    coord: null
