  tba.2785:
    area: tba_27
    name: The Foundation of All
    description: |2
         Seemingly suspended in space through some illusion, the glass walls of this
      curving room offer a spectacular panoramic view of the cosmos.  Blazing
      meteorites and whirling planets dance continuously, twinkling stars bespeckling
      the vast dark canvas of deep space.  Burning suns and icy moons light the
      blackness, shimmering gaseous clouds sparkling with stardust and cosmic debris
      as they wander past.
