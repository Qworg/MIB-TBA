    name: Eyes of Truth
    description: |2
         This cavern is immensely tall, the ceiling stretching so high that it cannot
      be seen.  In the center of the room a vibrant tree of Green Ash grows, swaying
      and murmuring in some unfelt breeze.  Floor tiles of ebony and ivory depict an
      image of balancing scales, and a magnificent altar stands at the far end of the
