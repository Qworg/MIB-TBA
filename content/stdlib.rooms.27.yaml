  tba.2788:
    area: tba_27
    name: Navi, the Will of the Imari
    description: |2
         This large glass room extends from the south, the illusion of deep space
      surrounding the frail shimmering walls.  Outside, the universe is blossoming
      rapidly under the careful guidance of the immensely powerful concentrations of
      life energy known as Imari.  Their forms can be seen as pure ripples of light,
      wafting here and there amidst the stars like a breath of life, choreographing
      the great cosmic dance and maintaining the equilbrium of order.  The exertion of
      their efforts can be seen influencing all that exists, continuously pulling
      everything to a state of balance, dark to light and light to dark.
    exits:
