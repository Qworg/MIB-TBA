    description: |2
         Silhouettes flit about the stone walls in an elaborate dance of darkness and
      light, shadows snaking up the walls and across the arched ceiling.  The open
      cavern reveals no source of the ghostly figures and it almost seems as though
      they have a life of their own, their alien forms twisting and weaving in
      perpetual motion as the illumination throughout the cave flickers.
