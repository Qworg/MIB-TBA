    description: |2
         The near barren landscape of a vast planet stretches in all directions, only
      the most primal fungi and mosses beginning to bloom.  Large footprints are
      imprinted deeply into the ground though there appears to be very little life
      around.  Only in the distance can the dark shapes of gigantic creatures be seen
      moving slowly across the horizon.  In the sky, an enormously bright wave of
      light can be seen slowly moving away into the recesses of space.
