    name: An Abandoned Nursery
    description: |2
         This is a child's room, the tiny bed and furnishings decorated with the
      jewels and lace one would bestow upon a little girl.  Long abandoned, layers of
      old gray dust cover the once beautiful surfaces of wood and satin.  Dreary
      cobwebs linger in the corners like ghostly shadows, whispering silent words in
      the cool breeze.
