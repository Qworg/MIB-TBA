    description: |2
         A faint amber glow emanates from a large stone in the center of the room
      pulsing a visual rhythm of light throughout the cavern.  Dark azurite encrusts
      the rounded walls, filling the room with the tranquil sapphire hue of twilight.
      The roof of the cave is high and peaks into a slight dome, tiny crystalized
      stalactites bejewelling the ceiling and reflecting the light like stars.
