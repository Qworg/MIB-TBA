  tba.2719:
    area: tba_27
    name: A Forgotten Cupboard
    description: |2
         Dark and dreary, this cupboard looks as though it has been long forgotten,
      remnants of broken toys and useless tools littering the floor.  Old cobwebs
      coat everything in a film of dust and time, but even the spider weavers seem to
      have forsaken this place, abandoning it and its contents to slow decay.
    exits:
      west:
        to: tba.2712
        hidden: false
        door:
          locked: false
          closed: false
          key: null
          name: seamlessdoor
          pickable: true
