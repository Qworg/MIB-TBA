      echoing quietly with the sounds of continuous dripping.  Gently glowing flora
      cast the place in an eerie green hue, and a luminous pool in the center of the
      room sends veins of light rippling and dancing up the sloping walls and across
      the ceiling.  Some sort of sort of phosphorus sap has been used to paint a
      large circle all the way around the center of the room, the same substance
