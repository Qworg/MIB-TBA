  tba.28758:
    area: tba_287
    name: A Landing
    description: |2
         A stairwell plunges down to the next level here.  To the west, a steel door
      forbids your passage.
    exits:
      down:
        to: tba.28759
        hidden: false
        door:
          locked: false
          closed: false
