    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28739:
    area: tba_287
    name: The Stone Hallway
    description: |2
         There is no escaping this cold, damp cave.  The Grunting Boar comes to mind,
      but you can not reach its warm fires now.  Only through worse danger will you
      leave these caves.
    exits:
      east:
        to: tba.28740
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
