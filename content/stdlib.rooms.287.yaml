  tba.28753:
    area: tba_287
    name: A Dark Hall in Goblin-Town
    description: |2
         This hall is deadly dangerous.  The goblins try to chase you into a corner,
      but you dart from shadow to shadow.  You must escape!
    exits:
      east:
        to: tba.28754
        hidden: false
        door:
          locked: false
