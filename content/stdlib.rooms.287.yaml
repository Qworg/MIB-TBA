    ambient_weather: {}
  tba.28786:
    area: tba_287
    name: On the Underground Stream
    description: |2
         The stream flows south to east, where the roof seems to be much higher.  It
      is darker here, but since the current pushes you east, you don't much need to
      see.
    exits:
      east:
        to: tba.28787
        hidden: false
        door: null
