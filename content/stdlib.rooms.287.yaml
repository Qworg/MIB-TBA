  tba.28799:
    area: tba_287
    name: The Throne Room
    description: |2
         Here stands the Great Goblin's ugly throne of bones grotesquely carved.  He
      sits here among his bodyguards, ready to pound your skull in for entering his
      miserable halls!
    exits:
      north:
        to: tba.28797
        hidden: false
        door: null
    spawns: []
