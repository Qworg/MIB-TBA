  tba.28747:
    area: tba_287
    name: The Spiral Tunnel
    description: |2
         There is no use counting how far this tunnel has spiralled down.  Goblins
      must be near, though; you can smell it.  Here the tunnel jogs down and west.
    exits:
      down:
        to: tba.28748
        hidden: false
