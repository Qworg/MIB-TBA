    ambient_weather: {}
  tba.28760:
    area: tba_287
    name: A Pale-Glowing Hall in Goblin-Town
    description: |2
         Not a pleasant place for a Sunday stroll!  Wonder how far down you are?
    exits:
      north:
        to: tba.28759
        hidden: false
        door: null
      south:
        to: tba.28775
        hidden: false
        door:
