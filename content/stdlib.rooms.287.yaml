  tba.28754:
    area: tba_287
    name: A Small Storeroom
    description: |2
         You are not sure what is stored in this room, but there are plenty of crude
      chests to open.  Many appear to be of dwarven make; plunder, no doubt.
    exits:
      west:
        to: tba.28753
        hidden: false
        door:
