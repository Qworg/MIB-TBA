    - dark
    num: 28751
    coord: null
    sector: field
    extra_descriptions:
    - keywords:
      - inscription
      description: |2
                       Let the fate of he whose arms rest here
                     Warn the fool who follows him to Goblin Town
    ambient_phases: {}
    ambient_weather: {}
  tba.28752:
    area: tba_287
    name: A Small Armory
    description: |2
         The Goblins keep a few weapons here, perhaps those they do not like to use.
    exits:
      east:
        to: tba.28751
        hidden: false
        door:
