  tba.28748:
    area: tba_287
    name: The Spiral Tunnel
    description: |2
         It is no use counting any more how many times this tunnel has wound around.
      You do not want to know.  The stench of goblin-caves is very bad here, but
      bearable.
    exits:
      down:
        to: tba.28750
        hidden: false
        door: null
      up:
        to: tba.28747
