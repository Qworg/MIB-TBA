    area: tba_287
    name: The Guard Chamber
    description: |2
         Behind that brazen door, the goblin's deadliest warriors wait until the Great
      Goblin sends them to ravage Lonoya.  Can you slay these foul creatures, or will
      you flee?
    exits:
