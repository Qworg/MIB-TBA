    ambient_weather: {}
  tba.28756:
    area: tba_287
    name: A Small Room
    description: |2
         This is another storeroom, of some sort.  This entire level is, like a ship's
      hold, devoted to storage.
    exits:
      north:
        to: tba.28755
        hidden: false
        door:
