  tba.28757:
    area: tba_287
    name: A Guard Room
    description: |2
         Not now!  Not another guard room!  But this is where one should be; after
      all, there hasn't been any other on this floor.
    exits:
      east:
        to: tba.28758
        hidden: false
        door:
