          key: tba_item_28703
          name: door bronze
          pickable: true
          difficulty: 0
      west:
        to: tba.28763
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28761
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28762:
    area: tba_287
    name: A Barracks Room
    description: |2
         Bunks hewn from the stone walls, stacked five or six high, line the granite
      walls of this room.  You are far below limestone, now.  The goblins sleep here.
      Some sleep now.  What extraordinary dreams they must be having, the foul
      creatures!
    exits:
      south:
        to: tba.28761
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 28762
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28763:
    area: tba_287
    name: A Pale-Glowing Hall in Goblin-Town
    description: |2
         The walls flash here a little, where metal veins come to the surface.  This
      is very unnerving, and it does not help that you are dodging goblins left and
      right.
    exits:
      east:
        to: tba.28761
        hidden: false
        door: null
      north:
        to: tba.28764
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
      south:
        to: tba.28773
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
      west:
        to: tba.28765
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28763
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28764:
    area: tba_287
    name: A Barracks Room
    description: |2
         The goblins sleep in here, packed in like sardines in a can.  The rooms smell
      worse than week-old sardines, littered as they are with old hides and
      accumulated filth.  You had better be leaving.
    exits:
      south:
        to: tba.28763
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 28764
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28765:
    area: tba_287
    name: A Pale-Glowing Hall in Goblin-Town
    description: |2
         Uh oh...  This passage seems to go to a large, well guarded room.  A shadow
      standing there is bigger than any goblin you have ever seen.
    exits:
      east:
        to: tba.28763
        hidden: false
        door: null
      north:
        to: tba.28766
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
      south:
        to: tba.28767
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28765
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28766:
    area: tba_287
    name: A Barracks Room
    description: |2
         The room might suit goblins, but you would never sleep here, unless pressed
      by dire need.  Even then, it would be miserable.  Here weapons and battered
      armor lie discarded, but you could use little of it.
    exits:
      south:
        to: tba.28765
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 28766
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28767:
    area: tba_287
    name: A Glowing Hallway in Goblin-Town
    description: |2
         Hurry up!  That hulking shadow nearby to the south might not have seen you
      running through the halls, but you probably won't get through unnoticed.
    exits:
      north:
        to: tba.28765
        hidden: false
        door: null
      south:
        to: tba.28768
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28767
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28768:
    area: tba_287
    name: The Mess
    description: |2
         And it really IS a mess, too.  Bones of all sorts lie tramped into the sandy
      clay floor.  Often they still have quite a lot of meat left on them.  Goblins
      are quite apt to bite something and throw it away, though it comes from a king's
      board.  Grotesque green-skinned warriors of all sizes and degrees of hideousness
      mill about, chewing on meat, whose origins you do not wish to know.  The east
      smells like a knacker's yard, when he is boiling down corpses.
    exits:
      east:
        to: tba.28769
        hidden: false
        door: null
      north:
        to: tba.28767
        hidden: false
        door: null
      south:
        to: tba.28770
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28768
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - bones
      - meat
      description: |2
           These bones all look somewhat decayed and smell very bad.  They don't whet
        your appetite, that is certain.  Besides, they may be poisoned after sitting
        around for so long.
    ambient_phases: {}
    ambient_weather: {}
  tba.28769:
    area: tba_287
    name: The Mess
    description: |2
         Here you see the goblins' cook - and you might make a good dinner.  Rather
      not have to take off your armor, but his pot always needs another chunk of meat,
      however it tastes.  Around him are stacked jars of strange substances to add to
      his pot, probably not tasty spices.  Dry, boiled bones are piled in the corner.
    exits:
      south:
        to: tba.28771
        hidden: false
        door: null
      west:
        to: tba.28768
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28769
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - bones
      - pile
      - corner
      description: |2
           They are of all different sizes.  Some are only Deer or Rabbit bones, but too
        many are from creatures that walk on two legs.
    ambient_phases: {}
    ambient_weather: {}
  tba.28770:
    area: tba_287
    name: The Mess
    description: |2
         This corner is a crude caricature of a homely Inn, like the good old Grunting
      Boar.  Fellowship and the enjoyment of good beer are unknown among these foul
      creatures, so they swallow some terrible-smelling concoction of cave molds until
      it kills them.  There is no such thing as a happy drunk here.  You remember the
      dwarven village fondly now.
    exits:
      east:
        to: tba.28771
        hidden: false
        door: null
      north:
        to: tba.28768
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28770
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28771:
    area: tba_287
    name: The Mess
    description: |2
         And what a mess it is!  Here the hall is less full of goblins and more
      littered with rubbish.  A guarded door leads east; it is made of stone, and
      elaborately carved.  Some orcish runes are cut into the stone.
    exits:
      east:
        to: tba.28772
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door carved stone
          pickable: false
          difficulty: 0
      north:
        to: tba.28769
        hidden: false
        door: null
      west:
        to: tba.28770
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 28771
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - orcish
      - runes
      description: |2
           They say: Krsd be da hammer wieldn dwarfs
    - keywords:
      - carved
      - carvings
      - stone
      - door
      description: |2
           Goblins never make anything beautiful, but this door is very well made.  You
        suspect this cave once had better occupants.  The door is in excellent condition
        (though scrawled on) ...  Glowing
    ambient_phases: {}
    ambient_weather: {}
  tba.28772:
    area: tba_287
    name: A Small Room
    description: |2
         The door you entered through is certainly of dwarven make.  You can easily
      push it open, so well-balanced was its weight on steel posts, when unlocked.
      Some spell on it probably saved it from ruin.  This particular room might have
      once been a treasury or armory of the dwarves (or gnomes), with a lock like
      that, but now a rough hole in its floor leads downward.
    exits:
      down:
        to: tba.28776
        hidden: false
        door: null
      west:
        to: tba.28771
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door carved stone
          pickable: false
          difficulty: 0
    spawns: []
    tags: []
    num: 28772
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28773:
    area: tba_287
    name: The Barracks Room
    description: |2
         Rough bunks are let into the walls here, so about fifty goblins can sleep in
      this rather large room.  If it was better kept up, this place might actually be
      comfortable, suggesting that it was not made by the goblins, who would not have
      made it so big.  As it is, they have crammed in the bunks as closely as
      possible, and you see a few which, because their walls were too thin, have
      collapsed on the bunk below.
    exits:
      north:
        to: tba.28763
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 28773
    coord: null
    sector: inside
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.28774:
    area: tba_287
    name: The Barracks Room
    description: |2
         All of these barracks rooms are similar, with bunks carved out of the walls,
      much like a catacombs' tombs are.  In the middle of all these barracks rooms'
      floors are deep pits in the stone, and a foul stench streaming upward from them
      suggests their purpose and use.
    exits:
      north:
        to: tba.28761
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28700
          name: door bronze
          pickable: true
          difficulty: 0
    spawns: []
    tags: []
    num: 28774
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - pits
      - pit
      - hole
      - holes
      description: |2
           They appear to be latrines.
    ambient_phases: {}
    ambient_weather: {}
  tba.28775:
    area: tba_287
    name: The Chieftain's Quarters
    description: |2
         This is obviously the chamber of a goblin chief, but you still wouldn't want
      to live here.  A pallet of vermin-ridden furs is piled on a stone slab that
      serves as a bed.  Not even a dwarf would like such a life!  The walls are scrawn
      all over with orc-runes and signs, and decorated with scalps and skulls.  You
      would not live long if the chief found you here.
    exits:
      north:
        to: tba.28760
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_28702
