    ambient_weather: {}
  tba.28743:
    area: tba_287
    name: The Spiral Tunnel
    description: |2
         This tunnel spirals slowly clockwise, delving deeper into the bowels of the
      mountain.  You must be very far down now.
    exits:
      down:
        to: tba.28744
        hidden: false
        door: null
      up:
        to: tba.28741
        hidden: false
        door:
          locked: false
          closed: false
