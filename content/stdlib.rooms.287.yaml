  tba.28740:
    area: tba_287
    name: The Stone Hallway
    description: |2
         The limestone walls in this room are cracked and seep icy water.  Your boots
      are soaking wet by the time you have walked twenty-five yards.
    exits:
      east:
        to: tba.28741
        hidden: false
        door: null
      west:
        to: tba.28739
