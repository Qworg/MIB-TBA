  tba.28751:
    area: tba_287
    name: Upper Goblin-Town
    description: |2
         You reach the first level of the goblin city.  Now you must fight for your
      life, adventurer!  Draw your weapon and stay on your guard!
    exits:
      south:
        to: tba.28753
        hidden: false
        door: null
      up:
        to: tba.28750
        hidden: false
        door: null
      west:
        to: tba.28752
        hidden: false
