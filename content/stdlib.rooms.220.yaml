  tba.22005:
    area: tba_220
    name: Snuffins' Dwelling
    description: |2
         Everything inside is, refreshingly, average-sized.  A spartan
      twin bed covered in thick blankets is pushed to the side, while a
      large, cherrywood desk dominates most of the room.  Candles burning
      atop it give off an aesthetic vanilla scent and just enough heat to
      keep the room at a comfortable temperature.  One of the walls is
      decorated with family photos portraying a happy group of mice.  The
      presence of numerous books, maps and globes hints at a person who
      enjoys travel.
    exits:
      south:
        to: tba.22004
        hidden: false
        door: null
    spawns: []
    tags:
    - peaceful
    num: 22005
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - books
      description: |2
           The books laying around are all thick and ancient looking.  Upon closer
        inspection, it seems like they're all books on history or geography.  There are
        several atlases, as well.
    - keywords:
      - diary
      description: |2
           Day 39 :  I am trapped.  My punishment for leaving home so early to
        travel the world has come back to bite me in the butt.  I had only planned to
        stay in this place for a night, merely to rest before I continued my journey,
        but it seems as if I've met my match in the devilcat named Oreo.
    - keywords:
      - desk
      description: |2
           This desk is cluttered with paperwads and chewed-up pens.  A thick book is
        pulled open, and looks to be a kind of diary.
    - keywords:
      - photos
      - walls
      - pictures
      description: |2
           A happy mouse family is depicted in the many pictures along the walls.  One
        of the most eye-catching is the image of a young mouse at a theme park,
        wearing what looks to be a set of plastic human ears over his head.
        Strange...
    - keywords:
      - maps
      - globes
      description: |2
           Several different-size globes sit around the room, and maps are spread out
        in various places.  Comically large thumbtacks are placed on random locations
        over the world.  Cities like Venice, New York, Rome and Tokyo are circled in
        bold red.
