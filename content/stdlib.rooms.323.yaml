  tba.32385:
    area: tba_323
    name: Throne Room
    description: |2
         The walls are all worked in glorious carvings, all of them of the likeness of
      the Pale Man.  Many fine underworld carvers have paid tribute to the Pale Man
      over the millenia in donating some of their talent to beautifying his abode.
      All these walls pale, however, in comparison to the huge black throne which
      stands tall and proud on its dias against the far east wall.
    exits:
      west:
        to: tba.32384
        hidden: false
        door: null
    spawns: []
    tags:
