  tba.32388:
    area: tba_323
    name: The Cavern Widens
    description: |2
         And widen it does, indeed.  It continues to widen until it reaches a huge
      circular well just to the east.  A small chamber to the south looks particularly
      uninviting, however it may warrant a quick look.
    exits:
      east:
        to: tba.32390
        hidden: false
        door: null
      south:
        to: tba.32389
        hidden: false
        door: null
      west:
        to: tba.32376
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32388
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32389:
    area: tba_323
    name: A Grim Chamber
    description: |2
         Maybe it wasn't such a good idea to get that quick look.  The dreadful
      creature which makes its home in this place is not at all what one might call a
      good host, and if it not here now, chances are that it will be back very
      quickly.
    exits:
      north:
        to: tba.32388
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32389
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32390:
    area: tba_323
    name: Deep Well
    description: |2
         Looking down into the depths of this thing, you cannot see bottom.  That does
      not mean that there isn't one, though - never fear.  Dropping a pebble down into
      it you hear...  Nothing.  That does not mean it didn't land, though - do not be
      afraid.  It appears that the rocky interior of the well would be suitable for
      climbing.
    exits:
      down:
        to: tba.32391
        hidden: false
        door: null
      west:
        to: tba.32388
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32390
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32391:
    area: tba_323
    name: In the Well
    description: |2
         The handholds turn out to be quite stable, allowing access to both the top
      and bottom of the well.  The bottom of the well can be seen now, bone dry.
    exits:
      down:
        to: tba.32392
        hidden: false
        door: null
      up:
        to: tba.32390
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32391
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32392:
    area: tba_323
    name: Well's Base
    description: |2
         The well ascends above you into the wide chamber.  It turns out there is yet
      another wide chamber leading east from down here as well.  It also seems much
      warmer down here than it did above.
    exits:
      east:
        to: tba.32393
        hidden: false
        door: null
      up:
        to: tba.32391
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32392
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32393:
    area: tba_323
    name: Crosschamber
    description: |2
         The cavern splits here, one chamber heading off south, the other continuing
      east.  It is much wider to the east, however the heat that you feel seems to
      radiate from that direction - a sign, perhaps?
    exits:
      east:
        to: tba.32394
        hidden: false
        door: null
      south:
        to: tba.32396
        hidden: false
        door: null
      west:
        to: tba.32392
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32393
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32394:
    area: tba_323
    name: Near a Glow
    description: |2
         A strange maroon glow comes from the eastern chamber, some sort of maroon
      draping or mound lies in that room.  The glow shimmers and dazzles as it shines.
      The heat now has become nearly unbearable, you can feel your face and hands
      burning slightly, turning red.
    exits:
      east:
        to: tba.32395
        hidden: false
        door: null
      west:
        to: tba.32393
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32394
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32395:
    area: tba_323
    name: The Dragon's Hoarde
    description: |2
         Ahh, so it was the glow of all that money and treasure gleaming on a huge
      dragon's scales - that's all it was.  Maybe it would have been better had you
      stayed in Jareth, maybe tossed a couple of beers down at the Goat and called it
      a night...
    exits:
      west:
        to: tba.32394
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32395
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32396:
    area: tba_323
    name: Side Tunnel
    description: |2
         This tunnel is certainly more narrow than the one to the north.  However,
      that does not help to ease the uneasy feeling you get from this small tunnel.
      Something, someone lies to the south and it is not something good.
    exits:
      north:
        to: tba.32393
        hidden: false
        door: null
      south:
        to: tba.32397
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32396
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32397:
    area: tba_323
    name: Side Tunnel
    description: |2
         The tunnel makes a curve, heading into a small chamber filled with heaps of
      coins!  Maybe that bad feeling was just that you weren't sure how you were going
      to carry all this gold back to the bank.
    exits:
      east:
        to: tba.32398
        hidden: false
        door: null
      north:
        to: tba.32396
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32397
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32398:
    area: tba_323
    name: Deep Room
    description: |2
         You realize with a sinking feeling that the heaps you thought were gold were
      actually the sides of the Deepspawn inhabiting this place.  Somewhere, somehow
      back just west of Jareth, you feel you must have taken a wrong turn.
    exits:
      west:
        to: tba.32397
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32398
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32399:
    area: tba_323
    name: The Aboleth's Lair
    description: |2
         So this is why the aboleth attacked so suddenly on the ledge!  She was
      protecting her babies.  Not to mention a considerable treasure...
    exits:
      up:
        to: tba.32369
        hidden: false
        door: null
