  tba.32308:
    area: tba_323
    name: Chamber of Fear
    description: |2
         This chamber is aptly named, aptly indeed.  The creature which occupies this
      small space is a feyr, pronounced *fear*, a creature made and created by the
      terrible fears of men and beast in the area.  A feyr is said to rest during
      daylight hours in places such as this and terrorize the ones who unknowingly
      created it during the night hours.  It is said only very powerful magic can
      destroy or even harm a creature such as this one.
