    area: tba_323
    name: Along the Tributary
    description: |2
         Ahead, a stone wall prohibits any further progress east.  The water flows
      from an opening which is not large enough to accomodate your girth.
    exits:
      east:
        to: tba.32357
        hidden: false
        door: null
      west:
        to: tba.32355
