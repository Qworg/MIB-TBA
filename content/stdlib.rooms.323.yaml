  tba.32357:
    area: tba_323
    name: The Water Flows Under
    description: |2
         The source of the water may never be known, at least not at this point as the
      water comes from some place past this wall which keeps any further travel east
      impossible.  There is a narrow passage to the north, a barely noticeable thing
      leading away from the tributary's shore.
    exits:
      north:
        to: tba.32358
        hidden: false
        door: null
