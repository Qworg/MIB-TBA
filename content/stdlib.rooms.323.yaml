    num: 32353
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32354:
    area: tba_323
    name: Small Cavernway
    description: |2
         This is the top of the chimney, the dark shaft leading back down into the
      main cavern below.  This cavernway leads off to the east and west, following
      along the shore of an underground lake which looks to be quite deep indeed.
      The lake is close enough that you could stick your toe in it - the ledge you
      stand upon must drop off quite immediately into the water.  To the west, the
      ledge curves around the 'shore' of the lake, plus a small cave leads away from
      the lake's edge even farther west.
    exits:
      down:
        to: tba.32353
        hidden: false
        door: null
      east:
        to: tba.32355
        hidden: false
        door: null
      west:
