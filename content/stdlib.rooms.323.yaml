  tba.32370:
    area: tba_323
    name: Vaulted Chamber
    description: |2
         The cave here is very wide and very tall, the black rock looking as if it
      were carved by the hands of man - or something like man.  The top of the cave
      comes to a point, the ceiling sloping down in two perfectly even archs to reach
      the walls, making this almost seem like a holy walkway - one that might lead to
      a holy man of some sort.
    exits:
      east:
        to: tba.32371
        hidden: false
        door: null
      west:
        to: tba.32322
