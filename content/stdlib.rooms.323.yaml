  tba.32358:
    area: tba_323
    name: A Tiny Crack
    description: |2
         A strange quiet pervades this small area.  One that is completely unsettling
      and certainly not natural.  Every warning bell in your being is going off,
      telling you that this is not the place of a being that either kind nor
      honorable.  A slight chill runs through your spine.
    exits:
      north:
        to: tba.32359
        hidden: false
        door: null
      south:
        to: tba.32357
        hidden: false
        door: null
    spawns: []
