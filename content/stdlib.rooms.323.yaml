    num: 32358
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32359:
    area: tba_323
    name: Death's Kiss
    description: |2
         The room has a strange chill to it, an unholy chill which comes not from the
      stone around it, but from the thing which dwells within it.  The small crack to
      the south looks almost inviting in comparison to the feeling of horror which
      pervades this room.
    exits:
      south:
        to: tba.32358
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32359
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32360:
    area: tba_323
    name: The Lake's Edge
    description: |2
         A passage runs west away from the lake.  The ledge that borderd the lake runs
      south around it for a short space and then terminates at the cavern wall.
      Small ripples dance across the surface of the lake - otherwise, it is dead calm.
    exits:
      east:
        to: tba.32354
        hidden: false
