  tba.32371:
    area: tba_323
    name: Vaulted Chamber
    description: |2
         The chamber ends just east of here at a giant hole in the center of the
      floor.  The ceiling and walls do not stray from their shape or form that began
      at the entrance to the main cavern, indeed they hold their shape right up to the
      point where they meet the far eastern wall on the other side of the hole.
    exits:
      east:
        to: tba.32372
        hidden: false
        door: null
      west:
        to: tba.32370
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32371
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32372:
    area: tba_323
    name: Top of the Shaft
    description: |2
         The gigantic hole on the floor turns out that it is a huge circular shaft
      which down deeper into the rock.  This was most definitely man-made as it is
      completely smooth walled with a set of rungs built into one side, made for easy
      climbing.
    exits:
      down:
        to: tba.32373
        hidden: false
        door: null
      west:
        to: tba.32371
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32372
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32373:
    area: tba_323
    name: In the Shaft
    description: |2
         You are about midway through the shaft now.  The ceiling of the chamber above
      can be seen from here as can the floor of a chamber below.  Both seem about as
      promising as a night on the iron maiden.
    exits:
      down:
        to: tba.32374
        hidden: false
        door: null
      up:
        to: tba.32372
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32373
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32374:
    area: tba_323
    name: Bottom of the Shaft
    description: |2
         The shaft rises high above you, black rock rungs climbing up one side of the
      wall of the shaft.  A vaulted passage runs off to the east, much like the one
      above.  In fact, it is exactly like the one above.
    exits:
      east:
        to: tba.32375
        hidden: false
        door: null
      up:
        to: tba.32373
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32374
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32375:
    area: tba_323
    name: Vaulted Chamber
    description: |2
         You notice for the first time that the grime and filth of the caverns above
      does no seem to extend down into this section of the caves.  The floors are free
      of litter, indeed they are free of dirt, as it appears they are swept or
      scrubbed regularly.  The passageway continues east for a short distance further
      then turns north, the vaulted ceiling turning with the rest of the cavern.
    exits:
      east:
        to: tba.32376
        hidden: false
        door: null
      west:
        to: tba.32374
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32375
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32376:
    area: tba_323
    name: Archway
    description: |2
         The vaulting of the ceiling runs off to the north through a very well-crafted
      archway.  The archway boasts two statues on either side of the entrance north,
      both of short, bald men who hold their hands over their hearts and stare
      resolutely into space in front of them.  To the east the cavern continues,
      however the walls and ceiling become rough, no longer carved in that direction.
      The way east gains width as it runs in that direction, getting more and more
      wide with every foot east.
    exits:
      east:
        to: tba.32388
        hidden: false
        door: null
      north:
        to: tba.32377
        hidden: false
        door: null
      west:
        to: tba.32375
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 32376
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32377:
    area: tba_323
    name: Wide Carpeted Caveway
    description: |2
         Oddly enough, the floor of this caveway is carpeted with a fine black rug,
      making the way north quite enjoyable.  Ahead are torches in ornate sconces,
      burning strongly, lighting the whole way.  You can see that the caveway runs
      north for quite some distance before turning east.
    exits:
      north:
        to: tba.32378
        hidden: false
        door: null
      south:
        to: tba.32376
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32377
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32378:
    area: tba_323
    name: Wide Carpeted Caveway
    description: |2
         The caveway runs north to south, the ceiling still vaulted and the walls
      smooth and clean as any palace.  The denizens of this place seem especially
      proud of their home.
    exits:
      north:
        to: tba.32379
        hidden: false
        door: null
      south:
        to: tba.32377
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32378
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32379:
    area: tba_323
    name: Wide Carpeted Caveway
    description: |2
         The caveway makes its turn just north from here, the carpet following along.
      To the south is the way back to the vaulted caves which lead back into the main
      cavern.
    exits:
      north:
        to: tba.32380
        hidden: false
        door: null
      south:
        to: tba.32378
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32379
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32380:
    area: tba_323
    name: Before the Chamber
    description: |2
         The view to the east is nothing short of astonishing!  A large black rock
      throne lies against the far east wall, quite some distance from here, small
      alcoves hold waiting attendants the length of the hall.  The black carpeting
      runs straight to the throne.
    exits:
      east:
        to: tba.32383
        hidden: false
        door: null
      south:
        to: tba.32379
        hidden: false
        door: null
    spawns: []
    tags:
    - no_mob
    - soundproof
    num: 32380
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32381:
    area: tba_323
    name: Waiting Chamber
    description: |2
         All manner of cave dwellers have waited in this place.  Waited on the
      pleasure of the Pale Man, who it is said holds the power of the Underdark.
      Legends told of the Pale Man say that he has lived for a thousand years and will
      live for a thousand more.  No one disputes them, as the Pale Man kills any being
      foolhardy enough to make an attempt on his life, even in thought.
    exits:
      south:
        to: tba.32383
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32381
    coord: null
    sector: inside
    extra_descriptions: []
