    area: tba_323
    name: Mold Cavern
    description: |2
         This small cavern is a mass of fungi and mold, every inch of the walls,
      floor, and ceiling are covered in the glowing growth.  The sounds that you
      became so accustomed to in the caves outside - the echoes, the wide open sound
      of the air blowing through - all of that is gone here, replaced by a deep
      penetrating silence.
    exits:
