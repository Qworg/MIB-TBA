  tba.32302:
    area: tba_323
    name: The Air Gets Cold
    description: |2
         It is no longer getting cold, it IS cold.  The air has dropped dwon near
      freezing, the steady breeze that blows through the caves making it seem all the
      more cold.  The floor continues to slope downward to the east, the darkness as
      complete as darkness can be.  Any sounds made in this dark, lonely place echo
      back a thousand fold - making the isolation complete.
    exits:
      east:
        to: tba.32303
