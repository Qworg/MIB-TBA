  tba.32342:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         The bugbear clan does not enjoy intrusion in any way.  They are very
      protective of what little area the Pale Man allows them to occupy here and will
      fight to the death to keep it for their own.  The large stewpot to the north in
      the main room gives testament to that fact.
