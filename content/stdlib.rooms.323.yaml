  tba.32304:
    area: tba_323
    name: Hundreds of Feet Below the Surface
    description: |2
         The surface, the open air - it is all now just a memory.  It is easy to lose
      track of time down in places such as these with no light and no other human
      contact.  The steady drip of the walls is still all that comes back from this
      dreary place as you make your way through.
