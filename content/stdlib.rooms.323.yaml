  tba.32349:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         The clan keeps a very efficient den, having certain areas sectioned off for
      persons of import and other, larger areas available for the general clansmen.
      Some of the more prestigious dwellings of bugbear clansmen lie to the north,
      south and west.
    exits:
      east:
