    name: A Large Room
    description: |2
         This must be the main living area for the gibberling tribe - the place where
      they make their last stands against bugbear invasions.  Bones are strewn about,
      not in an eerie way, just sloppy.  Everything is coated with the same grime and
      goo found all over this area.
