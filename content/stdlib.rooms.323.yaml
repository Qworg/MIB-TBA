  tba.32348:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         This is the lair of the bugbear shaman.  He is the one who administers the
      word of the Gods among his clansmen, sharing with them the will of the Gods and
      keeping the clan from spiritual danger.  Usually, the word from the Gods is that
      the clan should go out and slay as many of the neighboring gibberlings as
      possible, as the shaman is quite fond of gibebrling meat.
    exits:
      south:
        to: tba.32349
        hidden: false
        door: null
    spawns: []
