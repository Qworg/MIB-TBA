  tba.32368:
    area: tba_323
    name: The Lake's Edge
    description: |2
         With your back against a wall to the west and a deep subterrainean lake to
      the east, you may either go north or south along this ledge.  You see a pile
      of...  Something just south of here heaped against the south wall on the ground.
    exits:
      north:
