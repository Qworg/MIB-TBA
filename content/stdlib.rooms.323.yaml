  tba.32350:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         This is the home of the clan's leader.  This is the one who takes the clan
      out on raids, always at the front of the battle.  If there is ever any
      discipline in the ranks that needs doled out, it is this bugbear who does the
      doling.  Being that he also leads most raids, the leader is often replaced out
      of need - bugbears are not stupid, but neither are they all that smart.
    exits:
      east:
        to: tba.32349
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32350
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32351:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         This is the private den of the bugbear chief.  All matters pertaining to the
      clan end at this one.  If the leader or shaman wish to impose their will upon
      the clan, they first must get the support of the chief.  If the chief disagrees,
      then it ends there.  A chief can only be replaced through a direct challenge
      from another of the clansmen, therefore the chief always remains a young, robust
      bugbear with great physical prowess.
    exits:
      north:
        to: tba.32349
        hidden: false
        door: null
    spawns: []
    tags:
    - soundproof
    num: 32351
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32352:
    area: tba_323
    name: A Steep Climb
    description: |2
         This has turned out to be some sort of shaft or chimney which leads far up
      into the rock above.  The water does not flow from this place, it is completely
      dry here and hand holds abound, making the climb relatively easy.
    exits:
      down:
        to: tba.32324
        hidden: false
        door: null
      up:
        to: tba.32353
        hidden: false
        door: null
    spawns: []
