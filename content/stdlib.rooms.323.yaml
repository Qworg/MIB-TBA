    - soundproof
    num: 32354
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32355:
    area: tba_323
    name: Along the Tributary
    description: |2
         The lake begins to taper down into a smooth, flowing river which along side
      this walkway.  It appears that the water flows east into the lake, which must
      then leak somewhere underneath down along the wall of the cavern below,
      cascading past the cavern down deeper into the earth.
    exits:
      east:
        to: tba.32356
        hidden: false
        door: null
      west:
