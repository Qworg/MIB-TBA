  tba.32341:
    area: tba_323
    name: Den of the Bugbears
    description: |2
         This is the fringe of the bugbear territory in these caverns.  Their deep,
      guttural language can be heard in snatches and rumblings from afar.  Every now
      again a heavy huff or thump can be heard over the voices, sometimes even the
      clang of metal on metal.  Tread lightly.
    exits:
