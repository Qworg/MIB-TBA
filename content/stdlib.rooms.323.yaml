    - soundproof
    num: 32352
    coord: null
    sector: inside
    extra_descriptions: []
  tba.32353:
    area: tba_323
    name: Up Toward a Fresh Scent
    description: |2
         The breeze wafting down from above carries the same fresh smell of the water
      below.  Could the source of the cascade be somewhere above?  The scent energizes
      you, giving you fresh vigor for the climb.
    exits:
      down:
        to: tba.32352
        hidden: false
        door: null
      up:
        to: tba.32354
        hidden: false
        door: null
    spawns: []
