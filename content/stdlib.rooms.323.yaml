  tba.32303:
    area: tba_323
    name: Deeper and Deeper
    description: |2
         The steady depth at which the cavern angles toward is enough to make ears pop
      and eyes water.  A faint pinpoint of light is all that can be seen of the
      entrance far west and above this locale.  Oddly, there seems to be no change in
      the color or makeup of the rock walls that this tunnel runs through.  They are a
      solid, gleaming black which seems to both reflect the light and soak it up all
      at once - it is unnerving.
    exits:
      east:
        to: tba.32304
        hidden: false
        door: null
