  tba.32369:
    area: tba_323
    name: The Lake's Edge
    description: |2
         The ledge has reached the southern wall of the cavern, ended any further
      progress on the ledge.  Something smells quite dreadful here, very much like
      dead, decayed fish - but maginified many times over.
    exits:
      down:
