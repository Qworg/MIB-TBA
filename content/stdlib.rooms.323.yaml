    name: Entrance to the Dens
    description: |2
         The light shines upon a den of bugbears, their lair opening up to the east
      and spreading out for quite some area in these caverns.  It does not appear that
      they will venture forth into the cavern proper, although within their own domain
      they will certainly show no fear.
    exits:
