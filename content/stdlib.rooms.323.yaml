rooms:
  tba.32300:
    area: tba_323
    name: Entry into the Darkness
    description: |2
         A cold rush of air rushes up from the depths of the caverns, one that could
      chill a frost giant.  The uncompromising, black granite walls reflect the
      flickering light back in a thousand ways, making this place seem surreal, almost
      otherwordly.  A steep slope heads east, downward into darkness.  There are no
      sounds of movement or voices at all, only the steady, quiet drip of the caverns'
      moist walls.
    exits:
      east:
        to: tba.32301
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    - dark
    - soundproof
    num: 32300
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - credits
      - info
      description: |2
           *Caverns of the Pale Man
           *Written by Kaan for Dibrova
        Level: 25 - 50
        100 rooms
        23 mobs
        45 objs
        Connector Zones: The Plains of Blood
        These are a sytem of caverns made of black rock which catacomb for
        many miles. There are a number of cavernous mobs, all of them
        relatively high level - even the bats kick some ass. This zone is
        mainly intended to be a zone for high level players to gain good exp
        and find some good eq.
  tba.32301:
    area: tba_323
    name: Descending Into the Depths
    description: |2
         The air gets markedly colder the farther to the east that is traveled.  The
      floor slopes gently at first, then with more vigor as it continues.  Soon anyone
      trying to negotiate east would have to lean back as they walk just so that they
      might keep their balance.
    exits:
      east:
        to: tba.32302
        hidden: false
        door: null
