  tba.32361:
    area: tba_323
    name: Moldy Passage
    description: |2
         A strange mold grows over the walls and floor of this cavern, probably from
      the moister of the nearby lake.  The mold glows slightly with a strange
      luminescence.  It is really quite comforting after being the complete darkness
      for so long.
    exits:
      east:
        to: tba.32360
        hidden: false
        door: null
      west:
        to: tba.32362
