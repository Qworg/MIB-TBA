    name: Cold Storage
    description: |2
         This chamber is covered in the mold on the walls and floor, but it is easily
      thrity degrees cooler here than just a few feet to the east.  You begin to feel
      the heat drain from your body and suddenly realize what the thing on the floor
      is!
    exits:
