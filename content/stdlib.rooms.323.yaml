    name: Loud as Hell
    description: |2
         The noise is now deafening, maddening.  To think that any creature would
      spend its entire existance like this is an atrocity.  The gibberlings take their
      delight in the mental anguish they cause their prey, watching it squirm and
      writhe just before they attack.
