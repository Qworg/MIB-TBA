  tba.32383:
    area: tba_323
    name: Entering the Chamber
    description: |2
         The hall runs east toward the throne, to the north and south are small
      alcoves.  The alcoves are where beings wait for their chance to speak to or make
      a request of the Pale Man.
    exits:
