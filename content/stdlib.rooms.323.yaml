  tba.32362:
    area: tba_323
    name: Moldy Passage
    description: |2
         The mold on the floor and walls continues unabated, making it feel as if you
      were walking upon a thick carpet.  As indeed in a sense you are.  A fairly large
      room opens up to the south, its walls and floor covered just the same.
    exits:
