    ambient_phases: {}
    ambient_weather: {}
  tba.7536:
    area: tba_75
    name: The Taboo Way
    description: |2
         The tunnel is cold and confining.  The dirt walls give off a stale musty
      odor.  A faint mutter seems to echo from everywhere.  The tunnel tilts up and
      down.
    exits:
      down:
        to: tba.7537
        hidden: false
        door: null
