  tba.7537:
    area: tba_75
    name: The Taboo Way
    description: |2
         The tunnel opens up to a much larger room.  Large wooden beams have been
      placed in the four corners of the room for support.  The walls and ground are
      just slightly moist.  A tunnel leads up and down.
    exits:
      down:
        to: tba.7538
        hidden: false
        door: null
      up:
        to: tba.7536
        hidden: false
        door: null
