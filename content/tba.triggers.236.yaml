    vnum: 23600
    name: Cleric Fight Spec - 23621
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 35
    arglist: ''
    script: |
      * select the spell
      eval spellnr %random.4%
      if %spellnr%==1
        dg_cast 'harm' %actor%
      elseif %spellnr%==2
        dg_cast 'curse' %actor%
      elseif %spellnr%==3
        dg_cast 'call lightning' %actor%
      else
        dg_cast 'blindness' %actor%
      end
