  tba.65337:
    area: tba_653
    name: Apartment 101
    description: |2
         This room is a convenient space where the legal tenant can leave things to
      have them protected against crashes and reboots.  If this is a vacant apartment,
      do not leave your things here.  Only owned apartments are protected.

         Guests can also leave things.  If this is your apartment, typing 'house' with
      the name of a player will add that player to your guest list if the player is
      not on the list, or will remove the player from the guest list if the player is
      already on the list.  The player specified must be in the player database for
      the MUD, although he or she does not necessarily have to be logged on at the
      time.

         Typing 'house' with no arguments gives a list of the people currently on your
      house's guest list.
    exits:
      south:
