        die/victim: You have been burned to death by $n!
        die/room: $n has burned $N to death!
        miss/attacker: You miss $N with your burning hands.
        miss/victim: $n reaches for you with burning hands, but misses!
        miss/room: $n tries to burn $N, but $E escapes!
        hit/attacker: You burn $N with your hot little hands!
        hit/victim: You cry out in pain as $n grabs you with burning hands!
        hit/room: $N cries out as $n burns $M!
        god/attacker: Your attempt to burn $N nears BLASPHEMY!!!
        god/victim: The pitiful creature before you tries to burn you.
        god/room: Unaware of the risks, $n tries to burn $N.
    keywords:
    - combat
    - messages
    - burning hands
    see_also: []
    audience: public
