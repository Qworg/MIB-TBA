# Generated by tbaport from tbaMUD world files. Do not edit by hand.
topics:
  background:
    title: Background
    category: information
    summary: (lib/text/background)
    body: |-
      (lib/text/background)

      There once was a guy who played MUDs
      But the MUDs that he played were all duds
         "I'll write one," said he.
         And he brushed off his C.
      And soon played his game with his buds.
    keywords:
    - background
    see_also: []
    audience: public
  combat-message-10:
    title: 'Combat messages: color spray'
    category: combat
    summary: The color spray attack messages
    body: |
      Combat messages for color spray (attack type 10).

      Variant 1:
        die/attacker: YOU KILLED $N!!! -- don't you feel ashamed...
        die/victim: Your head is filled with all the colors of the rainbow before it bursts!
        die/room: $n makes $N into a colorful corpse!
        miss/attacker: Your spray of color misses $N -- what a dull world...
        miss/victim: $n unsuccessfully tries to add color to your life!
        miss/room: $n splashes color everywhere except $N.
        hit/attacker: Your own private rainbow hits $N in the face -- WOWIE!!
        hit/victim: A sudden burst of colors sends you reeling!
        hit/room: $n throws colors at $N who in vain tries to escape!
        god/attacker: Your spray of colors turn into butterflies as $N frowns.
        god/victim: Your frown is enough to turn $n's color spray into little butterflies.
        god/room: The air is filled with butterflies as $N frowns at $n's color spray.
    keywords:
    - combat
    - messages
    - color spray
    see_also: []
    audience: public
  combat-message-131:
    title: 'Combat messages: backstab'
    category: combat
    summary: The backstab attack messages
    body: |
      Combat messages for backstab (attack type 131).

      Variant 1:
        die/attacker: $N makes a strange sound but is suddenly very silent as you place $p in $S back.
        die/victim: Suddenly $n stabs you in the back, R.I.P....
        die/room: $n places $p in the back of $N, resulting in some strange noises, a lot of blood, and a corpse.
        miss/attacker: $N quickly avoids your backstab and you nearly cut your own finger!
        miss/victim: $n tries to backstab you, but you avoid $m!
        miss/room: $n tries to backstab $N but nearly cuts $s own finger!
        hit/attacker: $N makes a strange sound as you place $p in $S back!
        hit/victim: Suddenly $n stabs you in the back!
        hit/room: $n places $p in the back of $N, resulting in some strange noises and some blood!
        god/attacker: $N sends you a look that makes you forget all about backstabbing.
        god/victim: $n tries to backstab you, but changes $s mind.
        god/room: $n tries to backstab $N, but changes $s mind.
    keywords:
    - combat
    - messages
    - backstab
    see_also: []
    audience: public
  combat-message-132:
    title: 'Combat messages: bash'
    category: combat
    summary: The bash attack messages
    body: |
      Combat messages for bash (attack type 132).

      Variant 1:
        die/attacker: $N doesn't recover from your bash! -- $E is dead.
        die/victim: As $n bashes at you, you give up living and die...
        die/room: $N dies after $n has bashed $M!
        miss/attacker: As $N avoids your bash, you topple over and fall to the ground!
        miss/victim: You dodge a bash from $n who loses $s balance and falls!
        miss/room: $N avoids being bashed by $n who loses $s balance and falls!
        hit/attacker: Your bash at $N sends $M sprawling!
        hit/victim: $n sends you sprawling with a powerful bash!
        hit/room: $n sends $N sprawling with a powerful bash!
        god/attacker: Your effort to bash $N sends YOU sprawling on the ground.
        god/victim: $n fruitlessly tries to bash you and is sent sprawling.
        god/room: $n dares a bash at $N and is sent sprawling without touching $M.
    keywords:
    - combat
    - messages
    - bash
    see_also: []
    audience: public
  combat-message-134:
    title: 'Combat messages: kick'
    category: combat
    summary: The kick attack messages
    body: |
      Combat messages for kick (attack type 134).

      Variant 1:
        die/attacker: Your kick at $N's face splits $S head open -- yummy!
        die/victim: $n aims a kick at your face which splits your head in two!
        die/room: $n neatly kicks $N's head into pieces -- YUMMY!
        miss/attacker: You miss your kick at $N's groin, much to $S relief...
        miss/victim: $n misses a kick at your groin, you breathe lighter now...
        miss/room: $n misses a kick at $N's groin, much to $N's relief...
        hit/attacker: Your kick hits $N in the solar plexus!
        hit/victim: You're hit in solar plexus, wow, this is breathtaking!!
        hit/room: $n kicks $N in solar plexus, $N is rendered breathless!
        god/attacker: You attempt to kick $N but lose your balance and fall face down in some mud that has suddenly appeared.
        god/victim: When $n tries to kick you, you quickly make him fall in some mud you have created.
        god/room: $n falls face down in some mud created by $N.

      Variant 2:
        die/attacker: Your kick at $N's kidneys made $M die.
        die/victim: $n kills you by kicking your kidneys in!
        die/room: $N dies from $n's last kick in $S kidneys!
        miss/attacker: Your beautiful full-circle kick misses $N by a mile.
        miss/victim: $n makes a nice balletstep which plants $s foot a mile above your head.
        miss/room: $n makes a nice balletstep which plants $s foot a mile above $N's head.
        hit/attacker: Your boots need polishing again -- blood all over them...
        hit/victim: $n wipes $s boots in your face!
        hit/room: $n wipes $s boots in the face of $N!
        god/attacker: $N makes you kick at a huge stone appearing from nowhere -- OUCH!
        god/victim: You make $n kick a huge stone appearing from nowhere -- *giggle*
        god/room: $n starts kicking a huge stone which suddenly appears.
    keywords:
    - combat
    - messages
    - kick
    see_also: []
    audience: public
