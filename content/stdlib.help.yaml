  combat-message-26:
    title: 'Combat messages: fireball'
    category: combat
    summary: The fireball attack messages
    body: |
      Combat messages for fireball (attack type 26).

      Variant 1:
        die/attacker: Your fireball hits $N with full force, causing an immediate death!
        die/victim: As you burst into flames of death $n grins evilly...
        die/room: The heat from a fireball from $n turns $N into a charred corpse!
        miss/attacker: Your fireball blooms few feet before $N who claps $S hands in wonder.
        miss/victim: $n aims a fireball at you but it blooms few feet before you; you clap your hands at the show.
        miss/room: A fireball from $n misses $N -- what great fireworks around here!!
        hit/attacker: You throw a fireball at $N and have the satisfaction of seeing $M enveloped in flames!
        hit/victim: You are enveloped in flames from a fireball sent by $n -- OUCH!!
        hit/room: $n smirks as $s fireball explodes into the face of $N!
        god/attacker: How shameful to throw fireballs at a GOD!!!
        god/victim: You choose to ignore $n's shameful attempt to fireball you.
        god/room: $n's fireball is tactfully ignored by $N.
    keywords:
    - combat
    - messages
    - fireball
    see_also: []
    audience: public
  combat-message-27:
    title: 'Combat messages: harm'
    category: combat
    summary: The harm attack messages
    body: |
      Combat messages for harm (attack type 27).

      Variant 1:
        die/attacker: As you finish the incantation of the spell, $N falls dead due to the amount of harm $E takes!
        die/victim: You feel light headed as $n completes a spell which causes you so much harm that you just snuff it.
        die/room: As $n touches $M, $N takes the full brunt of a harm spell and collapses.  Dead.
        miss/attacker: Swinging out at $N, you miss and your harm spell goes off harmlessly.
        miss/victim: You duck out of the way of $n and $s harm spell misses you.
        miss/room: Showing remarkable dexterity, $N avoids $n's reach and subsequent harm spell.
        hit/attacker: You watch the pained expression on $N's face as you hit $M with your harm spell.
        hit/victim: You grimace in pain as $n's harm spell strikes you.
        hit/room: A large grin crosses $n's face as $s harm spell causes $N grievous pain.
        god/attacker: Harm a god?  Are you serious?  Of course $N avoids it casually.
        god/victim: $n tries to harm you.  Poor sod.
        god/room: What a buffoon!  $n looks somewhat perturbed as $N ignores the recently cast harm spell.
    keywords:
    - combat
    - messages
    - harm
    see_also: []
    audience: public
