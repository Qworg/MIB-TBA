        die/victim: You feel enlightened by the lightning bolt $n sends, and then all is darkness -- R.I.P.!
        die/room: $N receives the full blast of a lightning bolt from $n... and is no more.
        miss/attacker: Your aim goes from bad to worse, and your lightning bolt misses $N!
        miss/victim: $n has bad aim and $s lightning bolt misses you!
        miss/room: $n tries to hit $N with a lightning bolt but only hits the sky!
        hit/attacker: The lightning bolt hits $N with full impact!
        hit/victim: YOU'RE HIT!  A lightning bolt from $n has reached its goal!
        hit/room: $N wavers under the impact of the lightning bolt sent by $n!
        god/attacker: Your lightning bolt is extinguished as mighty $N moves $S ears!
        god/victim: You move your ears to extinguish $n's lightning bolt.
        god/room: $N moves $S ears and $n's lightning bolt is extinguished!
    keywords:
    - combat
    - messages
    - lightning bolt
    see_also: []
    audience: public
  combat-message-300:
    title: 'Combat messages: type 300'
    category: combat
    summary: The type 300 attack messages
    body: |
      Combat messages for type 300 (attack type 300).

      Variant 1:
        die/attacker: You hit $N with a blow that breaks $S spine!
        die/victim: $n hits you with a blow that breaks your spine!
        die/room: $n hits $N with a blow that breaks $S spine!
        miss/attacker: $N ducks under your fist as you try to hit $M.
        miss/victim: You duck under $n's fist as $e takes a swing at you.
        miss/room: $N ducks under $n's fist as $e takes a swing at $M.
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: It isn't polite to swing at a GOD!
        god/victim: $n tries to take a swing at you -- how pathetic!
        god/room: $n pathetically tries to take a swing at $N - ha!

      Variant 2:
        die/attacker: You hit $N with such force that $S neck snaps in two!
        die/victim: $n hits you with such force that your neck snaps in two!
        die/room: $N's neck is snapped in two by a powerful blow from $n!
        miss/attacker: You try to hit $N who easily avoids the blow.
        miss/victim: $n tries to hit you but you easily avoid the blow.
        miss/room: $n tries to hit $N who easily avoids the blow.
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: You try to hit $N but hit yourself instead!
        god/victim: $n tries to hit you but you hits $mself instead!
        god/room: $n tries to hit $N but hits $mself instead!

      Variant 3:
        die/attacker: You punch $N in $S kidneys resulting in $S immediate death!
        die/victim: You receive a punch in your kidneys which ends your worldly misery -- R.I.P.!
        die/room: $n punches $N in the kidneys causing immediate death!
        miss/attacker: You wildly punch at the air, missing $N.
        miss/victim: $n misses a wild punch at you.
        miss/room: $n practices shadow-boxing while $N takes a break.
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: Instead of letting you punch $M, $N forces you to play Punch and Judy!!!
        god/victim: You convince $n of playing Punch and Judy instead of punching you.
        god/room: $N convinces $n that no punching is necessary.

      Variant 4:
        die/attacker: You punch $N's head with a blow that crushes $S skull!
        die/victim: $n punches your head with a blow that crushes your skull!
        die/room: $n punches $N's head so hard that $S skull cracks open!
        miss/attacker: You swing your fist at $N, but miss $M!
        miss/victim: You barely avoid $n's fist as $e takes a swing at you!
        miss/room: $N barely avoids a blow from $n!
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: Your fist flops as your body refuses to fight the mighty $N.
        god/victim: $n seems to be having trouble getting $s body to fight you!!
        god/room: $n's body rebels against $m when $e tries to punch $N.
    keywords:
