    category: combat
    summary: The energy drain attack messages
    body: |
      Combat messages for energy drain (attack type 25).

      Variant 1:
        die/attacker: $N crumples as you kill $M by draining $S energy!
        die/victim: As $n drains your last energy you look forward to the peace of the graveyard...
        die/room: $n drains the energy of $N who crumples as a lifeless cocoon!
        miss/attacker: You need more draining lessons...
        miss/victim: Luckily for you $n slept during draining-lessons!
        miss/room: $n fails to drain $N -- what a waste of energy!
        hit/attacker: You drain $N of some of $S energy!
        hit/victim: You feel less energic as $n drains you!
        hit/room: $n drains $N -- what a waste of energy!
        god/attacker: You waste energy trying to drain $N!
        god/victim: How amusing -- $n tries to drain you!
        god/room: $N's eyes twinkle with laughter as $n tries to drain $M.
    keywords:
    - combat
