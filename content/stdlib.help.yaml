    - messages
    - type 300
    see_also: []
    audience: public
  combat-message-301:
    title: 'Combat messages: type 301'
    category: combat
    summary: The type 301 attack messages
    body: |
      Combat messages for type 301 (attack type 301).

      Variant 1:
        die/attacker: You violently sting $N repeatedly, causing $S death!
        die/victim: You die a horrid death as $n stings you repeatedly all over your body!
        die/room: As $n stings $N all over the place, $N falls lifeless to the ground.
        miss/attacker: You sting towards $N, but miss $M!
        miss/victim: $n misses you with $s sting!
        miss/room: You watch on as $n stings at $N, but misses!
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: You sting at $N, and all that happens is that $E slaps himself as if a mosquito bit $M.
        god/victim: Was that a bee you just felt?  Oh.. wait, it was just $n.
        god/room: $N begins to slap at $Mself as $n tries to sting $M.

      Variant 2:
        die/attacker: You drive a sting directly into the heart of $N, killing $M!
        die/victim: With a powerful driving force, $n's sting tears right through your chest causing instant death!
        die/room: $n drives $s sting through $N's chest, killing $M!
        miss/attacker: You miss $N with your stinging blow!
        miss/victim: $n drives $s stinging blow at you, barely missing!
        miss/room: You watch in fright as $n stings at $N, missing by mere inches!
        hit/attacker: (none)
        hit/victim: (none)
        hit/room: (none)
        god/attacker: Sting -- God... What are you thinking?
        god/victim: $n tries to sting you, somewhat comical to tell the truth.
        god/room: $n stings at $N, then looks horrified as $N grins at $m!
