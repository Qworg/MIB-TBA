  tba.10322:
    area: tba_103
    name: The Mouth of the River
    description: "   The air seems to be a bit more soothing here, there are trees on both sides\nof the river, and the serene sun shining down into the river, making it so you\ncan see the every little ripple in the water.  Magnificent fish add to the\nbeautiful scene here, swimming through the river distorting the image of the\nsmall pebbles on the bottom.  Leaves fall gently into the river and majesticly\nfloat down the stream.  This area looks to have been untouched by the\ndestructive human hand, the trees to the northwest are to thick to see\nthrough much less walk through.  This also seems to be a perfect place to relax\nfrom the troubles of everyday.  \n"
