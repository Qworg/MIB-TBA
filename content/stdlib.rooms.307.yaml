  tba.30782:
    area: tba_307
    name: Wide Road Through the Foothills
    description: |2
         You come round a slight curve in the roadway and get your first solid glimpse
      of the castle which lies only a short span away.  It is a well-kept place, one
      which appears to be frequented by many as the hedges are all neatly trimmed and
      the banners which fly from the tall masts on the ramparts and which hang from
      either side of the grand entry are fresh and clean.  The roadway runs east and
      west.
    exits:
