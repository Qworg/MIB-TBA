  tba.30781:
    area: tba_307
    name: Wide Road Through the Foothills
    description: |2
         The road continues on through the foothills to the east and the west.  On
      either side of the road are the rolling hills of the area, their grassy slopes
      broken only once in a while by trees and bushes.  Off to the west, the pennants
      of a castle can be seen poking above the hill lines which block your sight.
      Obviously, someone owns these lands upon which you travel and lives just west of
      here.
    exits:
