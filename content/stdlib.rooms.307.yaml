  tba.30783:
    area: tba_307
    name: Cold Storage
    description: |2
         The costs involved in maintaining this room is really quite amazing.  Every
      single day, a man drives his cart out to the frozen sea at the fringes of the
      land where the minotaurs rule and brings back with him huge, solid chunks of ice
      which are kept here in this sealed room where all perishable items are kept.
