    area: tba_33
    name: A Small Road
    description: |2
         The road ends here, leading up to a stone house
      to the south.  Smoke rises from the chimney in a dark
      stream, and the windows are frosted over with humidity.
      North, you see the main intersection of Stanneg.
    exits:
      north:
