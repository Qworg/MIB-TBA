  tba_trig_24702:
    vnum: 24702
    name: Priest Align - 24703
    attach_type: mob
    flags: b
    types:
    - random
    narg: 100
    arglist: ''
    script: |
      set actor %random.char%
      if %actor.is_pc%
        if %actor.fighting%
          say You are commiting blasphemy!
