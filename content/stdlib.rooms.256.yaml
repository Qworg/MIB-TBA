    extra_descriptions: []
  tba.25666:
    area: tba_256
    name: On the Drawbridge
    description: |2
         Standing in front of the keep, one cannot help but feel daunted to some
      degree.  Some of the feeling is due to the sheer immensity of this castle, it's
      powerful presence, but you also can't help but feel that something must be wrong
      here.  The guards standing at attention here are afraid to even look in any
      direction but straight ahead and from inside the castle you hear no sounds of
      merriment or laughter, as is usually the case in the entryway of the Lord's
      Keep.  The Lord's Court lies west of you, while the twin guard towers flank your
      entry to the east into Lord's Keep.
    exits:
      east:
        to: tba.25667
        hidden: false
        door: null
      west:
        to: tba.25665
        hidden: false
        door: null
    spawns: []
    tags:
