    description: |2
         You have entered a very cramped earthen passageway which is darker than
      darkest night.  You feel something skitter by you feet and give a small shudder
      at the thought of what it might be.  The walls seem to have been man made, dug
      out of hard clay, without supports.  You begin to feel a chill, and even a bit
