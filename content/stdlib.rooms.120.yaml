        hidden: false
        door: null
      west:
        to: tba.12039
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 12046
    coord: null
    sector: city
    extra_descriptions:
    - keywords:
      - mountain
      description: |2
           Off to the southwest, you can see a huge mountain that is partially obscured
        by the haze.  It is rumored that the gods reside there and protect the city.
    - keywords:
      - stone
      - structure
      - aqueduct
      description: |2
           You see a massive stone structure, built several centuries ago, that is used
        to channel water into the city.
  tba.12047:
    area: tba_120
    name: The Summit Of The Mountain Of The Gods
    description: |2
         You are at the summit of a very high mountain and are standing above
      the clouds.  The sun is shining brilliantly here and the clouds below
      look like balls of cotton.  The path that you have been walking on is
      damp and the scent of lilac is in the air.
    exits:
      down:
        to: tba.12052
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 12047
    coord: null
    sector: mountain
    extra_descriptions: []
  tba.12048:
    area: tba_120
    name: The Aqueduct
    description: |2
         You are in a massive stone structure that has been designed to channel
      water into the city of Rome.  Due to the recent drought, the water level
      is low, allowing passage without a boat.  The walls and floor are covered
      with algae and slime, producing treacherous footing conditions.  There are
      exits in all four cardinal directions.
    exits:
      east:
        to: tba.12041
        hidden: false
        door: null
      north:
        to: tba.12057
        hidden: false
        door: null
      south:
        to: tba.12041
        hidden: false
        door: null
      west:
        to: tba.12048
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 12048
    coord: null
    sector: water_swim
    extra_descriptions:
    - keywords:
      - slime
      - algae
      description: |2
           Due to the availability of moisture and nutrients, a green viscous slime has
        grown and covered everything with a slippery coating.  It seems to go out of its
        way to drip on you.
  tba.12049:
    area: tba_120
    name: Froboz's Workshop
    description: |2
         You are standing in the workshop of Froboz the Great, the most powerful and
      famous mage that Rome has ever known.  Workbenches line the walls and are
      covered with various test tubes, beakers, petri dishes and crucibles and there
      is an odor in here that can best be described as a combination of old sweat
      socks and burning tires.  The only exit is back through the door through which
      you came.  In the middle of the room, you see a pile of ashes that looks like it
      once was a body and Froboz is is busy making adjustments on a new type of magic
      wand...  Possibly the one responsible for the explosion a few minutes ago.  He
      removes a jeweler's loupe from his eye as he turns around.  'How in the name of
      Merlin did you get in here??!!  ' he asks.  'Oh, nevermind!  Since you are here,
      you can serve as witnesses to the final test of the new mages' spell:
      "ectowatt".  ' With this he makes a magical gesture and a paladin appears.
      Crossing his fingers, Froboz waves the wand his direction and what happens next
      is incredible!  The Paladin is enveloped in what appears to be a small, well
      contained, thermonuclear explosion.  When the smoke clears you can see that the
      paladin and all of equipment has been reduced to a large pile of flaming
      cinders.  Froboz throws his head back and cackles with insane glee.  'Now, my
      young friends, what can I do for you?  ', he asks.
    exits:
      west:
        to: tba.12042
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_12038
          name: door
          pickable: false
          difficulty: 0
    spawns: []
    tags: []
    num: 12049
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - cinders
      - ashes
      - pile
      description: |2
           The ashes are a very fine grayish white powder that seems to be the only
        worldly remains of Froboz's "test specimens".
    - keywords:
      - workbench
      - workbenches
      - tubes
      - beakers
      - crucibles
      - dishes
      description: |2
           These are all tools of great power.  You cannot even begin to understand what
        any of this stuff does.
  tba.12050:
    area: tba_120
    name: The Courtroom
    description: |2
         You stand inside of a large courtroom in which common civil disputes and
      criminal matters are decided.  There is a judge's bench and a witness stand
      on the far side of the room and a jury's box along side.  The Emperor's seal
      is prominently displayed on the wall behind the judge's stand, reminding all
      who enter that he is an extension of his highness.  There is a door, possibly
      leading to the judge's chambers, to the east and the waiting room is to the
      west.
    exits:
      east:
        to: tba.12055
        hidden: false
        door:
          locked: false
          closed: false
          key: tba_item_12039
          name: door
          pickable: true
          difficulty: 0
      south:
        to: tba.12060
        hidden: false
        door: null
      west:
        to: tba.12043
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 12050
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - seal
      description: |2
           The seal of the Emperor is mounted above the judge's stand.
    - keywords:
      - bench
      - stand
      - box
      - jury
      description: |2
           You see large wooden structures that are designed to separate the judge, jury
        and witnesses from the rest of the courtroom.  They are made of polished oak and
        are strictly functional.
  tba.12051:
    area: tba_120
    name: The East Gate Of Rome
    description: |2
         You are standing inside of the eastern gate of Rome.  There are two tall
      spires built into the city wall, from which the guards can see the whole
      eastern side of the city.  The gate is currently open and to the east,
      there is a heavily used road, made of packed clay, that leads out of Rome.
      Another road leads westward into the city.
    exits:
