rooms:
  tba.24500:
    area: tba_245
    name: Entry Chamber
    description: |2
         You stand upon a flat surface of hard rock, smooth and open.  A solid wall of
      granite forms the northern boundary of the area you stand upon, the wall rising
      high into darkness, the heights unfathomable.  There is an eastern and western
      wall which enlose the rock upon which you stand, however to the south is nothing
      but dark, open air which - from this vantage point - appears to lead nowhere.
      A steady drone from the south echoes up to you, a solid sound that sounds almost
      like a very large being letting loose a sigh that doesn't end.
    exits:
      east:
        to: tba.24501
        hidden: false
        door: null
      south:
        to: tba.24505
        hidden: false
        door: null
    spawns: []
    tags:
    - dark
    - soundproof
    num: 24500
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - credits
      description: |2
           Nether
        Written by Kaan for Dibrova
        200 rooms
        18 mobs
        14 objs
        *
        The Nether is by far the most difficult zone on Dibrova. This is
        mainly due to the level of the mobs that inhabit the Nether, but it
        is also due to the number of secret doors and secret paths within
        the Nether. All mobs are aggro, all are magic resistant (if your
        mud does not support magic resistance, obviously they will not be
        magically resistant) and all are of the highest levels in Dibrova.
        In Dibrova, our mobs go as high as level 200 - if your mud's levels
        do not go as high, you will need to edit the mobs' levels and stats
        to match your own mud.
        *
        The Maw: There are a number of rooms titled 'Within the Maw' which
        have little to no description. This is because Dibrova uses a flag
        for these rooms which is called IMPENETRABLE in which no light
        permeates, not even magical light. These rooms could be simply made
        DARK, however anyone with a light would be able to see in them (these
        rooms were meant as a trap). 24538-24564
        *
        If your mud uses secret doors, the following are secret doors:
        from #60 down into #65
        from #87 north into #99
        from 2#57 east into 2#58
        *
        In #99 the exit east is a 'wimp-exit' meant to give those who wish
        to wimp out a chance to do so.
        In 2#58 the exit north is the only way out of the Nether by mundane
        means; a player must go the entire way through the Nether to use
        this exit.
    ambient_phases: {}
    ambient_weather: {}
