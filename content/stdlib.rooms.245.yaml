  tba.24513:
    area: tba_245
    name: Skirting the Maw
    description: |2
         A solid layer of bricking makes a walkway around an opening in the floor of
      the chamber.  More of an enormous well than an opening, the gaping hole in the
      center of the chamber holds a broiling darkness which actually moves and writhes
      as if with its own inner life.  Hooting, howling creatures cavort about the
