    vnum: 6100
    name: Near Death Trap Spiders - 6131
    attach_type: wld
    flags: g
    types:
    - enter
    narg: 100
    arglist: ''
    script: |
      * Near Death Trap stuns actor, then poison will almost kill them.
      wait 3 sec
      set stunned %actor.hitp%
      %damage% %actor% %stunned%
      wait 3 sec
      dg_affect %actor% poison on 1
      %send% %actor% The spiders wrap you up and leave you to die.
  tba_trig_6101:
    vnum: 6101
    name: Magic user - 6112, 6114-6117
    attach_type: mob
    flags: k
    types:
    - fight
    narg: 10
    arglist: ''
    script: |
      switch %actor.level%
        case 1
        case 2
        case 3
        break
        case 4
          dg_cast 'magic missile' %actor%
        break
        case 5
          dg_cast 'chill touch' %actor%
        break
        case 6
          dg_cast 'burning hands' %actor%
        break
        case 7
        case 8
          dg_cast 'shocking grasp' %actor%
        break
        case 9
        case 10
        case 11
          dg_cast 'lightning bolt' %actor%
        break
        case 12
          dg_cast 'color spray' %actor%
        break
        case 13
          dg_cast 'energy drain' %actor%
        break
        case 14
          dg_cast 'curse' %actor%
        break
        case 15
          dg_cast 'poison' %actor%
        break
        case 16
          if %actor.align% > 0
            dg_cast 'dispel good' %actor%
          else
            dg_cast 'dispel evil' %actor%
          end
       break
        case 17
        case 18
          dg_cast 'call lightning' %actor%
        break
        case 19
        case 20
        case 21
        case 22
          dg_cast 'harm' %actor%
        break
        default
          dg_cast 'fireball' %actor%
        break
      done
