  tba.34361:
    area: tba_343
    name: Rumbles Office
    description: |
      Inside Rumble's Office. It is a sealed pagoda, which is setup as an
      office than a shrine.  It has a desk in the center of the room with several
      filing cabinets along the wall on one side.  A fold out ship's bunk is here to
      sleep on setup along the wall.  It is done in a typical 14th Century Oriental
