          elseif %place% > %origin%
            switch e
            elseif %place% < %origin%
              switch w
              end
              case n
                %echo% The missile fires north.
                eval next %origin% + 10
                while %next% < %place%
                  %at% %next% %echo% A missile whizzes past.
                  eval next %next% + 10
                done
                %at% %place% %echo% A missile hits its target.
              break
              case e
                %echo% The missile fires east.
                eval next %origin% + 1
                while %next% < %place%
                  %at% %next% %echo% A missile whizzes past.
