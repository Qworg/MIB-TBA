  tba.29264:
    area: tba_292
    name: Reception
    description: |2
         Kell's wife, Myrama, greets you with a smile.  The rooms here are
      big and clean, and you'll never have a more comfortable stay than at
      Kell's House.
    exits:
      north:
        to: tba.29263
