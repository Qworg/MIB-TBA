    coord: null
    sector: inside
    extra_descriptions: []
  tba.29250:
    area: tba_292
    name: The Kerofk MobChute
    description: |2
         This room delivers mobs randomly around the city, and should not be
      reachable to player characters.  Thanks to Locke of Cthulhu mud for
      use of this idea!
    exits:
      down:
        to: tba.29234
        hidden: false
        door: null
