    attach_type: wld
    flags: b
    types:
    - random
    narg: 5
    arglist: ''
    script: |
      %echo% An apple falls...
      wait 5
      %force% reallyweirdalias say look out!
      if !%self.catched%
         %echo% ...on the ground.
         %load% obj 501
      end
      set catched 0
      remote catched %self.id%
