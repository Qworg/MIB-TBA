    name: Leaving MrSmithy
    attach_type: mob
    flags: q
    types:
    - leave
    narg: 100
    arglist: ''
    script: "if %actor.is_pc%\n  %send% %actor% %self.name% says 'Come back and see me again, %actor.name%. Really!'\n  %echo% \nend\n"
  tba_trig_55515:
    vnum: 55515
    name: BeggarGold
    attach_type: mob
    flags: n
    types:
