rooms:
  tba.25000:
    area: tba_250
    name: An Ancient Path through the dense forest
    description: |2
         This path appears to be very old, and well travelled.  It amazes you that
      you have never noticed it was here before.  That is until you look back and
      realize that the clay road is completely invisible to you from here.  To the
      east, the path continues.  It appears that the western opening you entered
      through is now impassible.  You are here whether you like it or not....
    exits:
      east:
        to: tba.25001
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 25000
    coord: null
    sector: forest
    extra_descriptions:
    - keywords:
      - credits
      - info
      description: |2
           Builder      :
           Zone         : 250 Dragonspyre
           Player Level : 28-30
           Rooms        : 100
           Mobs         : 10
           Objects      : 22
           Links        : 38u, 43d
    ambient_phases: {}
    ambient_weather: {}
  tba.25001:
    area: tba_250
    name: An Ancient Path through the dense forest
    description: |2+
         The path is becoming more and more difficult to traverse now, as the trees
      seem to reach out to strangle you.  You feel like you are utterly alone, and,
      if not for the mountain you can now see in the distance, would probably just
      recall to Midgaard.  But then again, who ever said that adventuring was easy?

    exits:
      east:
        to: tba.25002
        hidden: false
        door: null
      west:
        to: tba.25000
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 25001
    coord: null
    sector: forest
    extra_descriptions: []
    ambient_phases: {}
    ambient_weather: {}
  tba.25002:
    area: tba_250
    name: The End of the Ancient Path
    description: |2
         You finally burst free from the grasp of the wood, only to find yourself at
      the foot of a path.  The path leads north, to the mountain which has, until now
      been your only beacon.  Now that you can better see the ominous mountain
      looming before you, you begin to rethink the idea of recalling to Midgaard.
    exits:
      north:
        to: tba.25003
        hidden: false
        door: null
      west:
        to: tba.25001
        hidden: false
        door: null
    spawns: []
