    num: 28138
    coord: null
    sector: water_swim
    extra_descriptions: []
  tba.28139:
    area: tba_281
    name: Walking on stony soil
    description: |2
         As you walk on, the mountainside begins to change much more steeper
      before you.  However it seems that you can advance easily enough.
    exits:
      south:
        to: tba.28138
        hidden: false
        door: null
      up:
        to: tba.28140
        hidden: false
        door: null
    spawns: []
