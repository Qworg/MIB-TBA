    coord: null
    sector: hills
    extra_descriptions: []
  tba.28140:
    area: tba_281
    name: Climbing on the mountainside
    description: |2
         You ascend a narrow split and arrive at a small plateau that
      continues both north and west.  Dark fungus appears to grow profuse
      here.
    exits:
      down:
        to: tba.28139
        hidden: false
        door: null
      north:
        to: tba.28142
