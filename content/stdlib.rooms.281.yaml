  tba.28136:
    area: tba_281
    name: A weak trail
    description: |2
         The forest is clearly more lighter now, and you sense gentle sunshine
      on your cheeks.  The trail leads north toward the mountain, and west, into
      the deeper forest.
    exits:
      north:
        to: tba.28137
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28136
    coord: null
    sector: field
    extra_descriptions: []
  tba.28137:
    area: tba_281
    name: A lighter forest
    description: |2
         You are approaching the edge of the forest from where a stony mountain-
      side begins to ascend, very gentle at first.  Rippling of water can be heard
      from nearby.
    exits:
      north:
        to: tba.28138
        hidden: false
        door: null
      south:
        to: tba.28136
        hidden: false
        door: null
    spawns: []
