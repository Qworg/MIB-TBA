  tba.28155:
    area: tba_281
    name: Through some bushes
    description: |2
         You are struggling at a thicket, disturbed by several multicolorous
      spiders and gadflies.  Most of these bushes are unusually tough, lashing
      your face with an unpleasant force.  There is a small ditch to the south.
    exits:
      south:
        to: tba.28154
        hidden: false
        door: null
      west:
        to: tba.28115
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28155
    coord: null
    sector: forest
    extra_descriptions: []
  tba.28156:
    area: tba_281
    name: The brink of the grassy hillside
    description: |2
         You are standing on the brink of the grassy hillside that begins
      to descend gently.  Below there lies what appears very dense forest.
      To the north is a ditch.
    exits:
      down:
        to: tba.28157
        hidden: false
        door: null
      north:
        to: tba.28153
        hidden: false
        door: null
    spawns: []
