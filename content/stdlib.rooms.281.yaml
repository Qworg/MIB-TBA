  tba.28157:
    area: tba_281
    name: Descending the hillside
    description: |2
         You start climbing down a small worn-out path on the hillside.  Despite
      the fresh footprints all around, the way doesn't appear very busy.
    exits:
      down:
        to: tba.28158
        hidden: false
        door: null
      up:
        to: tba.28156
        hidden: false
        door: null
    spawns: []
