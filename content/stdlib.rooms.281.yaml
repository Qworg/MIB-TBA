    extra_descriptions: []
  tba.28158:
    area: tba_281
    name: On a gray trunk
    description: |2
         Reaching the foot of the hillside you notice a large grayish trunk,
      penetrating into the forest as if it were a straight bridge.  You begin
      to walk on it.
    exits:
      east:
        to: tba.28159
        hidden: false
        door: null
      up:
        to: tba.28157
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28158
    coord: null
    sector: city
    extra_descriptions: []
  tba.28159:
    area: tba_281
    name: Walking on the trunk
    description: |2
         You move forward, keeping your balance quite easily since the trunk
      is so broad.  It seems that many smaller trees remained under when this
      giant overturned years ago.
         Now, there lies the rhizome.  The roots appear to give passage to
      the south.
    exits:
      south:
        to: tba.28160
        hidden: false
        door: null
      west:
        to: tba.28158
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28159
    coord: null
    sector: city
    extra_descriptions: []
  tba.28160:
    area: tba_281
    name: A narrow path
    description: |2
         You step on a narrow path, engraved deep in the ground.  Several
      stones make your walking quite difficult, and you are worried about
      your feet.  The foliages form a green and inpenetrable "wall" around
      the path which seems to descend to the east.
    exits:
      east:
        to: tba.28161
        hidden: false
        door: null
      north:
        to: tba.28159
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28160
    coord: null
    sector: field
    extra_descriptions: []
  tba.28161:
    area: tba_281
    name: Under some massive roots
    description: |2
         Here the path goes very deep in the ground, almost as if it were
      an ancient trench.  Tremendous, gnarled roots from some brown and black
      arches above.  The path leads both to the west and east.
    exits:
      east:
        to: tba.28162
        hidden: false
        door: null
      west:
        to: tba.28160
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28161
    coord: null
    sector: field
    extra_descriptions: []
  tba.28162:
    area: tba_281
    name: A small meadow
    description: |2
         You arrive at a small meadow that grows tall yellowish hay, swaying
      slowly in the wind.  The path leads towards the north, where you make out
      some high osiers.
    exits:
      north:
        to: tba.28163
        hidden: false
        door: null
      west:
        to: tba.28161
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28162
    coord: null
    sector: field
    extra_descriptions: []
  tba.28163:
    area: tba_281
    name: On a trail through high osiers
    description: |2
         Despite the thickness of these bushes you still detect the path and
      walk on it easily.  Now your trip begins to wind downwards, from where you
      can hear some voices.
    exits:
      down:
        to: tba.28164
        hidden: false
        door: null
      south:
        to: tba.28162
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28163
    coord: null
    sector: forest
    extra_descriptions: []
  tba.28164:
    area: tba_281
    name: An ancient crater
    description: |2
         You find yourself standing at a vast and deep pit, obviously an
      ancient crater with a diameter of 30 metres, at least.  The bottom is
      covered in brownish grass and there are several rough boulders around,
      most of them black.  Also you notice that the crater is full of small
      folk, everyone directing towards a structure of some kind further away
      to the east.
    exits:
      east:
        to: tba.28165
        hidden: false
        door: null
      up:
        to: tba.28163
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    - no_mob
    num: 28164
    coord: null
    sector: field
    extra_descriptions: []
  tba.28165:
    area: tba_281
    name: At the crater
    description: |2
         With the brownies you start approaching the structure as well.
      It looks like a wooden dais, on where a couple of beings are sitting,
      deep in their discussion.  Behind them there stands what could be a
      totem or a statue of some kind.  Yet you do not know what this all is
      about, but no doubt this place must be of great importance and sanctity
      for these people.
    exits:
      east:
        to: tba.28166
        hidden: false
        door: null
      south:
        to: tba.28167
        hidden: false
        door: null
      west:
        to: tba.28164
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28165
    coord: null
    sector: field
    extra_descriptions: []
  tba.28166:
    area: tba_281
    name: Before the wooden steps
    description: |2
         Just before you lie firm, wooden steps, ascending onto the dias.
      Simple, but elegant symbols have been encarved on them.
    exits:
      up:
        to: tba.28168
        hidden: false
        door: null
      west:
        to: tba.28165
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28166
    coord: null
    sector: field
    extra_descriptions: []
  tba.28167:
    area: tba_281
    name: Before the wooden steps
    description: |2
         Just before you lie firm, wooden steps, ascending onto the dias.
      Simple, but elegant symbols have been encarved on them.
    exits:
      north:
        to: tba.28165
        hidden: false
        door: null
      up:
        to: tba.28168
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    num: 28167
    coord: null
    sector: field
    extra_descriptions: []
  tba.28168:
    area: tba_281
    name: The Ceremony Plateau
    description: |2
         The dais has been grinded very smooth.  Four green pictures cover
      its surface, representing fine trees.  Each picture points to the sepa-
      rate cardinal direction.  In the middle of the dais stands a tall, wooden
      statue, resembling an impressive woman, clad in clothes made of large
      leaves and garments.
         The brownies assemble to the foot of the dais and you feel the
      atmosphere running high.
    exits:
      north:
        to: tba.28169
        hidden: false
        door: null
      west:
        to: tba.28170
        hidden: false
        door: null
    spawns: []
    tags:
    - outdoor
    - no_mob
    num: 28168
    coord: null
    sector: city
    extra_descriptions:
    - keywords:
      - statue
      - woman
      description: |2
           The statue is of light wood and appears very skillfully carved.  The woman it
        presents has a tall lenght of straight hair almost reaching her legs.  Worn on
        her head is a crown made of the most beautiful flowers, barely found in every
        forest.  Couple of small birds are sitting on her shoulders, seemingly listening
        earnestly.  This must be the Queen of the forest herself.
  tba.28169:
    area: tba_281
    name: Descending the steps
    description: |2
         You start descending from the dais.
    exits:
      down:
        to: tba.28166
        hidden: false
        door: null
      south:
        to: tba.28168
        hidden: false
