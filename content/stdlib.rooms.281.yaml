    extra_descriptions: []
  tba.28154:
    area: tba_281
    name: A grassy ditch
    description: |2
         You are standing on the bottom of a small and grassy ditch.  There
      is some thicket growing around.  The ditch leads to the east.
    exits:
      east:
        to: tba.28153
        hidden: false
        door: null
      north:
        to: tba.28155
        hidden: false
