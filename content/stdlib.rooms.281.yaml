      apart slowly, and you hear birds singing here and there.  Way farther
      to the north raises a tremendous, gray figure, the mountainside of
      Great Aesarthwe.
    exits:
      east:
        to: tba.28136
        hidden: false
        door: null
      south:
        to: tba.28133
        hidden: false
