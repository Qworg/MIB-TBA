  tba.27435:
    area: tba_274
    name: Apothecary/Magic Shoppe
    description: |2
         A foul stench waifs through the air as you step in and you try not to wrench
      onto the floor from the awful stench that you could smell outside.  It is an
      array of chaos in this store.  It has aisles upon aisels of potions of every
      sort and count, but they are all mixed up and out of order.  The only escape is
      the shop keeper who works behind her counter on the north wall, where her
      assistants work behind a cauldron that brew some sort of noxious potion.  They
      sell water here, and you wonder if it was could be tained from all the chemicals
      they used in these awful potions.  The only exit out of the smell is to the
      south onto the street.
