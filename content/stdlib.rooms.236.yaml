  tba.23606:
    area: tba_236
    name: The Armorers Stall
    description: |2
         You are in the corner of the cave, which the dwarves have decided to use as a
      trade area.  In this, the farthest corner from the entrance, some shining armor
      has been laid out on an old sack.  Behind it, the assistant to the armorsmith
      is getting ready to display his merchandise to you.  To get back to the center
      of the trade halls, you must go south.
    exits:
      south:
        to: tba.23607
        hidden: false
        door: null
    spawns: []
    tags: []
    num: 23606
    coord: null
    sector: inside
    extra_descriptions:
    - keywords:
      - sack
      - armor
      - armor
      description: |2
           The different pieces of armor have been strewed all over the ground here,
        but it might be an unwise idea to try to just pick it up.  Theft is not looked
        lightly upon in the dwarven kingdom.
  tba.23607:
    area: tba_236
    name: Center of the Trade Halls
    description: |2
         You are Standing in the middle of what you would have to call a domed cave,
      in lack of other words.  The cave is strangely symmetrical, though, and you are
      certain the ceiling high above you have been touched by a dwarfs pickaxe in the
      past.  The floor is rock, and there is rock above and around you.  You are also
      certain the dwarfs can monitor you here from hidden holes in the rockface.  To
      your west and north there are stalls set up by the traders, while to the east
      you can try to enter the dwarven city itself.  You can leave to the south.
    exits:
      east:
        to: tba.23609
