name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

# The game builds against a sibling MIB checkout (path deps), and the converter
# tests read a sibling tbaMUD checkout. This workflow lays all three out as
# siblings of the checked-out repo and points the converter at the source.
env:
  CARGO_TERM_COLOR: always
  TBAMUD_SOURCE: ${{ github.workspace }}/tbamud

# The default token only reads this repository and the public tbaMUD checkout.
# The private engine is fetched with `MIB_DEPLOY_KEY`, a read-only deploy key
# scoped to Qworg/MIB alone, so CI never holds a credential that can write to
# other repositories.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIB-TBA
        uses: actions/checkout@v4
        with:
          path: MIB-TBA

      # Fail loudly rather than with a confusing 404 when the credential is
      # absent (for example on a fork PR, where repository secrets are not
      # exposed). Only whether the secret is set is materialised into the
      # environment, never its value.
      - name: Require the engine deploy key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.MIB_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::MIB_DEPLOY_KEY is not set. Qworg/MIB is private,"
            echo "so CI cannot check out the engine without it. Add a read-only"
            echo "deploy key for Qworg/MIB as the MIB_DEPLOY_KEY secret."
            exit 1
          fi

      - name: Checkout the MIB engine (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: Qworg/MIB
          path: MIB
          # Read-only deploy key, scoped to Qworg/MIB. `persist-credentials:
          # false` keeps the key out of MIB/.git/config, so a later build step
          # cannot read it.
          ssh-key: ${{ secrets.MIB_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout tbaMUD (converter source)
        uses: actions/checkout@v4
        with:
          repository: tbamud/tbamud
          path: tbamud

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            MIB-TBA/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('MIB-TBA/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        working-directory: MIB-TBA
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: MIB-TBA
        run: |
          cargo clippy -p mib-tba --lib --tests -- -D warnings
          cargo clippy -p tbaport --all-targets -- -D warnings
          cargo clippy -p dg-vm --all-targets -- -D warnings

      - name: Test the pack
        working-directory: MIB-TBA
        run: cargo test -p mib-tba

      - name: Test the DG VM (corpus tests read tbaMUD via TBAMUD_SOURCE)
        working-directory: MIB-TBA
        run: cargo test -p dg-vm

      - name: Test the converter (full-conversion validation)
        working-directory: MIB-TBA
        run: cargo test -p tbaport

      - name: Validate the shipped pack offline
        working-directory: MIB-TBA
        run: cargo run -q -p mib-tba -- validate-packs
